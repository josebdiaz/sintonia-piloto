<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sintonía · El plan de tu parche</title>
<link rel="stylesheet" href="assets/sintonia.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>Sintonía</a>
    <button class="btn btn-ghost btn-sm" id="refrescar" type="button" aria-label="Actualizar">↻ Actualizar</button>
  </header>
  <div id="app" aria-live="polite">
    <div class="card empty"><div class="pulse" aria-hidden="true"></div><p class="muted">Cargando tu plan…</p></div>
  </div>
  <div id="extra"></div>
  <footer class="foot">Piloto académico · Universidad Icesi · <a href="aviso.html">Aviso de privacidad</a></footer>
</main>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var app = S.$('#app'), extra = S.$('#extra'), pid = S.adoptPid(S.param('pid')), planId = S.param('plan_id') || '', timer = null, data = null;

  function html(h) { app.innerHTML = h; }
  function poll(on) { clearTimeout(timer); if (on) timer = setTimeout(load, 20000); }

  function stopsHtml(o) {
    return '<ul class="stops">' + (o.paradas || []).map(function (p, i) {
      return '<li><b>' + (i + 1) + '. ' + S.esc(p.nombre) + '</b><div class="meta"><span>' + S.esc(p.zona || '') + '</span>' +
        (p.horario ? '<span>Horario: ' + S.esc(p.horario) + '</span>' : '') + (p.costo_aprox !== '' && p.costo_aprox !== undefined ? '<span>Costo: ' + (/^\$?\s*0$/.test(String(p.costo_aprox).trim()) ? 'gratis' : S.esc(p.costo_aprox)) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>';
  }
  function optionHtml(o, i, extra) {
    return '<h3>' + S.esc(o.titulo || ('Opción ' + (i + 1))) + '</h3>' + stopsHtml(o) +
      '<div class="meta">' + (o.hora_salida ? '<span>Salida sugerida: <b>' + S.esc(o.hora_salida) + '</b></span>' : '') +
      (o.presupuesto_aprox ? '<span>Presupuesto: <b>' + S.esc(o.presupuesto_aprox) + '</b></span>' : '') + '</div>' +
      (o.por_que ? '<p class="small" style="margin:10px 0 0">' + S.esc(o.por_que) + '</p>' : '') + (extra || '');
  }

  function load() {
    if (!pid) return html('<div class="card warn empty"><h2>Abre tu enlace personal</h2><p class="small">Este enlace llega cuando te registras. Si lo perdiste, escríbele a quien organiza o al WhatsApp de Sintonía.</p></div>');
    var q = { view: 'plan', pid: pid }; if (planId) q.plan_id = planId;
    S.get(q).then(function (r) {
      data = r;
      if (!r || !r.ok) {
        poll(false);
        extra.innerHTML = '';
        if (r && r.error === 'revocado') return html('<div class="card warn empty"><h2>Tu participación se cerró</h2><p class="small">' + S.esc(S.errMsg(r)) + '</p></div>');
        return html('<div class="card danger empty"><h2>No pudimos abrir tu plan</h2><p class="small">' + S.esc(S.errMsg(r)) + '</p></div>');
      }
      S.saveMe({ rol: r.rol, exp: r.experimento });   // 2.0.2: la identidad guardada sale del backend, no de otra persona que usó este celular
      if (r.plan_id) planId = r.plan_id;
      render(r); retiro();
    });
  }

  function render(r) {
    if (r.estado === 'sin_plan' && r.grupo_estado === 'reclutando') { poll(true); return esperando(r); }   // 2.0.2: en E1 y E2 el organizador recupera su invitación
    if (r.experimento === 'E1' && !r.failover && r.estado !== 'cerrado') {
      poll(false);
      return html('<div class="card soft empty"><h2>Tu plan va por WhatsApp</h2><p class="small">Tu parche está en la versión de WhatsApp: las opciones, la votación y los recordatorios te llegan por el chat de Sintonía.</p></div>');
    }
    if (r.estado === 'sin_plan') {
      poll(true);
      if (r.grupo_estado === 'excluido') { poll(false); return html('<div class="card warn empty"><h2>Este grupo no entra en la prueba</h2><p class="small">No todas las personas invitadas completaron las autorizaciones, así que por rigor el grupo no participa. Gracias por tu tiempo.</p></div>'); }
      if (r.grupo_estado === 'reclutando') return esperando(r);
      return preparando();
    }
    if (r.estado === 'preparando') { poll(true); return preparando(); }
    if (r.estado === 'votando') { poll(true); return votando(r); }
    if (r.estado === 'cerrado') { poll(false); return cerrado(r); }
    if (r.estado === 'caido') { poll(false); return html('<div class="card warn empty"><h2>Esta vez el plan no se dio</h2><p class="small">Pasa. Cuando haya una nueva propuesta, aparecerá aquí mismo.</p></div>'); }
    html('<div class="card empty"><p class="muted">Estado del plan: ' + S.esc(r.estado) + '</p></div>');
  }

  /** 2.0.2: mientras el grupo recluta, el organizador recupera su invitación y ve cuántos aceptaron. */
  function esperando(r) {
    var cuenta = (r.n_consentidos !== undefined && r.n_invitados) ? '<p class="small"><b>' + r.n_consentidos + ' de ' + r.n_invitados + '</b> ya aceptaron.</p>' : '';
    var h = '<div class="card empty"><div class="pulse" aria-hidden="true"></div><h2>Esperando a tu parche</h2>' + cuenta +
      '<p class="small muted">El plan arranca cuando todas las personas invitadas acepten desde su enlace.</p></div>';
    if (r.codigo_invitacion) {
      var inv = S.link('unirse.html', { inv: r.codigo_invitacion });
      h += '<div class="card"><h3>Tu enlace de invitación</h3><p class="small muted">Compártelo con quienes faltan. Cada persona acepta por sí misma.</p>' +
        '<div class="linkbox">' + S.esc(inv) + '</div><div class="actions split"><button class="btn btn-ghost" id="invCopiar" type="button">Copiar enlace</button>' +
        '<a class="btn btn-primary" target="_blank" rel="noopener" href="' + S.esc(S.waShare('¡Parche! Estoy probando Sintonía para que el plan sí se dé. Únete aquí (toma 2 minutos): ' + inv)) + '">Compartir por WhatsApp</a></div></div>';
    }
    html(h);
    if (r.codigo_invitacion) S.$('#invCopiar').onclick = function () { S.copy(S.link('unirse.html', { inv: r.codigo_invitacion })); };
  }

  function preparando() {
    html('<div class="card empty"><div class="pulse" aria-hidden="true"></div><h2>Sintonía está armando las opciones para tu parche.</h2><p class="small muted">Vuelve en un momento. Esta página se actualiza sola.</p></div>');
  }

  function votando(r) {
    var ops = r.opciones || [], total = Math.max(1, Number(r.n_invitados) || 1);
    var h = '<div class="hero"><h1>¿Cuál les suena?</h1><p>Vota por una opción. Si te sirve cualquiera, dilo; si ninguna te sirve, también: así nadie queda incómodo.</p></div>';
    h += '<p class="small muted">' + (r.n_votos || 0) + ' de ' + (r.n_invitados || '?') + ' ya votaron · el conteo es anónimo</p>';
    // 2.0.5: «Sí a todo» (me sirve cualquiera) se guarda como opción -1: cuenta como voto y deja que el resto decida
    var flex = (r.conteo && r.conteo[-1]) || 0, todoMio = String(r.mi_voto) === '-1';
    h += '<div class="card si-todo' + (todoMio ? ' mine' : '') + '"><div class="actions" style="margin:0;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><h3 style="margin:0">¿Te sirve cualquiera?</h3><p class="small muted" style="margin:2px 0 0">Si te da igual, vota «Sí a todo» y que el parche decida.' + (flex ? ' ' + flex + (flex === 1 ? ' persona ya lo dijo.' : ' personas ya lo dijeron.') : '') + '</p></div>' +
      '<button class="btn ' + (todoMio ? 'btn-ghost' : 'btn-honey') + '" data-todo data-busy="Guardando…">' + (todoMio ? '✓ Dijiste sí a todo' : 'Sí a todo') + '</button></div></div>';
    ops.forEach(function (o, i) {
      var n = (r.conteo && r.conteo[i]) || 0, mine = String(r.mi_voto) === String(i);
      h += '<article class="option' + (mine ? ' mine' : '') + '">' + optionHtml(o, i,
        '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(n / total * 100) + '%"></i></div>' +
        '<div class="actions"><button class="btn ' + (mine ? 'btn-ghost' : 'btn-primary') + ' btn-block" data-voto="' + i + '" data-busy="Guardando…">' + (mine ? '✓ Tu voto · ' : 'Voto por esta · ') + n + ' voto' + (n === 1 ? '' : 's') + '</button></div>') + '</article>';
    });
    h += '<div class="card"><p class="small" style="margin:0 0 8px">Ninguna me sirve' + (r.vetos ? ' · ' + r.vetos + ' ya lo dijeron' : '') + '</p><button class="btn ' + (r.mi_voto === 'veto' ? 'btn-ghost' : 'btn-danger') + ' btn-block" data-veto data-busy="Guardando…">' + (r.mi_voto === 'veto' ? '✓ Dijiste que ninguna te sirve' : 'Veto · ninguna me sirve') + '</button></div>';
    html(h);
    S.$$('[data-voto]', app).forEach(function (b) { b.onclick = function () { votar(b, Number(b.dataset.voto), false); }; });
    S.$('[data-veto]', app).onclick = function () { votar(this, '', true); };
    S.$('[data-todo]', app).onclick = function () { votar(this, -1, false); };
  }
  function votar(btn, opcion, veto) {
    S.busy(btn, function () { return S.post({ action: 'votar', plan_id: planId, pid: pid, opcion: opcion, veto: veto }); })
      .then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast(veto ? 'Anotado: ninguna te sirve.' : opcion === -1 ? 'Anotado: te sirve cualquiera.' : '¡Voto guardado!'); load(); });
  }

  function cerrado(r) {
    var o = (r.opciones || [])[Number(r.elegida)] || (r.opciones || [])[0] || {};
    var hora = r.hora_encuentro ? new Date(r.hora_encuentro) : null, now = Date.now();
    var ventana = !hora || (now >= hora.getTime() - 3 * 36e5 && now <= hora.getTime() + 8 * 36e5);
    var yo = r.yo || {};
    var h = '<div class="hero"><h1>¡El plan quedó!</h1><p>Llega sabiendo qué esperar. Ruta clara, ganas intactas.</p></div>';
    h += '<article class="option win">' + optionHtml(o, 0, hora ? '<p style="margin:12px 0 0"><b>Encuentro: ' + S.esc(S.fecha(hora)) + '</b></p>' : '') + '</article>';
    if (r.experimento !== 'E1' || r.failover) {
      h += '<div class="card"><h3>¿Vas?</h3><p class="small muted">' + (r.n_apuntados || 0) + ' de ' + (r.n_invitados || '?') + ' ya se apuntaron.</p><div class="actions split">' +
        (yo.apuntado ? '<button class="btn btn-ghost" data-ev="no_puedo" data-busy="Guardando…">Ya no puedo</button><span class="btn btn-primary" aria-disabled="true">✓ Te apuntaste</span>'
                     : '<button class="btn btn-primary" data-ev="me_apunto" data-busy="Guardando…">Me apunto</button><button class="btn btn-ghost" data-ev="no_puedo" data-busy="Guardando…">No puedo</button>') + '</div></div>';
      h += '<div class="card"><h3>El día del plan</h3>' + (yo.llego ? '<p class="small">✓ Marcaste que llegaste. ¡Que lo disfruten!</p><div class="actions"><button class="btn btn-ghost btn-block" data-ev="llego_casa" data-busy="Guardando…">Ya llegué a casa</button></div>'
        : '<p class="small muted">Cuando llegues al sitio, márcalo aquí. No usamos tu ubicación.</p><div class="actions"><button class="btn btn-honey btn-block" data-ev="checkpoint_llegada" data-busy="Guardando…"' + (ventana ? '' : ' disabled') + '>¡Llegué!</button></div>' + (ventana ? '' : '<p class="tiny muted center">Se activa unas horas antes del encuentro.</p>')) + '</div>';
    }
    var antes = hora && now < hora.getTime();   // 2.0.2: el pulso se abre desde la hora de encuentro
    if (antes) h += calendario(o, hora);
    h += '<div class="card soft"><h3>Después de la salida</h3>' + (yo.retro ? '<p class="small">¡Gracias por contarnos cómo les fue!</p>' :
      antes ? '<p class="small muted">Después del encuentro te pediremos 2 minutos para contarnos cómo les fue.</p>' :
      '<p class="small">Si hubo sintonía, sigan. Cuéntanos cómo te fue en 2 minutos.</p><div class="actions"><a class="btn btn-primary btn-block" href="' + S.esc(S.link('retro.html', { plan_id: planId, pid: pid })) + '">Cuéntanos cómo te fue</a></div>') + '</div>';
    if (antes && hora.getTime() - now < 12 * 36e5) { clearTimeout(timer); timer = setTimeout(load, hora.getTime() - now + 5000); }   // una sola recarga al llegar la hora (sin sondear el backend)
    html(h);
    S.$$('[data-ev]', app).forEach(function (b) {
      b.onclick = function () {
        S.busy(b, function () { return S.post({ action: 'evento', plan_id: planId, pid: pid, tipo: b.dataset.ev }); })
          .then(function (x) { if (!x || !x.ok) return S.toast(S.errMsg(x), true); S.toast({ me_apunto: '¡Listo, te esperamos!', no_puedo: 'Anotado. Gracias por avisar.', checkpoint_llegada: '¡Bienvenid@! Quedó registrado.', llego_casa: 'Qué bueno. ¡Gracias!' }[b.dataset.ev]); load(); });
      };
    });
  }

  /* ---------- 2.0.7 (R3) · Retirarse desde la web, en dos pasos (Ley 1581 · I9) ---------- */
  function retiro() {
    if (extra.dataset.abierto === '1') return;   // no se redibuja mientras la persona decide
    extra.innerHTML = '<details class="card" id="retiroBox"><summary class="small"><b>Retirarme del piloto</b></summary><p class="small muted" style="margin:8px 0">Puedes irte cuando quieras, sin dar explicaciones. Se borran tu nombre, tu número, tus votos y tus respuestas. Por rigor, tu grupo deja de contarse en la prueba.</p>' +
      '<div id="retiroPaso"><button class="btn btn-danger btn-sm" id="retiro1" type="button">Retirarme y borrar mis datos</button></div></details>';
    S.$('#retiroBox').addEventListener('toggle', function () { extra.dataset.abierto = this.open ? '1' : ''; });
    S.$('#retiro1').onclick = function () {
      S.$('#retiroPaso').innerHTML = '<div class="card danger small" style="margin:0"><b>¿Seguro?</b> No se puede deshacer.<div class="actions split" style="margin-top:8px"><button class="btn btn-ghost btn-sm" id="retiroNo" type="button">Cancelar</button><button class="btn btn-danger btn-sm" id="retiroSi" type="button" data-busy="Borrando…">Sí, retirarme</button></div></div>';
      S.$('#retiroNo').onclick = function () { extra.dataset.abierto = ''; retiro(); };
      S.$('#retiroSi').onclick = function () {
        var b = this;
        S.busy(b, function () { return S.post({ action: 'revocar', pid: pid }); }).then(function (x) {
          if (!x || !x.ok) return S.toast(S.errMsg(x), true);
          ['pid', 'grupo', 'rol', 'exp', 'nombre'].forEach(function (k) { S.LS.del('sintonia_' + k); });
          poll(false); extra.innerHTML = ''; extra.dataset.abierto = '';
          html('<div class="card warn empty"><h2>Listo, te retiraste</h2><p class="small">Borramos tus datos. Gracias por tu tiempo. Si tienes dudas, escríbenos a ' + S.esc(S.CONFIG.CONTACTO_EMAIL) + '.</p></div>');
        });
      };
    };
  }

  /* ---------- 2.0.7 (R13) · Calendario: el celular avisa antes del encuentro ---------- */
  function calendario(o, hora) {
    var ini = new Date(hora), fin = new Date(ini.getTime() + 3 * 36e5);
    var z = function (d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
    var titulo = 'Plan con el parche · ' + (o.titulo || 'Sintonía'), lugar = (o.paradas || []).map(function (p) { return p.nombre; }).join(' → ');
    var detalle = 'Tu plan en Sintonía: ' + S.link('plan.html', { pid: pid });
    var g = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(titulo) + '&dates=' + z(ini) + '/' + z(fin) + '&location=' + encodeURIComponent(lugar) + '&details=' + encodeURIComponent(detalle);
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sintonia//Piloto//ES', 'BEGIN:VEVENT', 'UID:' + planId + '@sintonia', 'DTSTAMP:' + z(new Date()), 'DTSTART:' + z(ini), 'DTEND:' + z(fin),
      'SUMMARY:' + titulo, 'LOCATION:' + lugar, 'DESCRIPTION:' + detalle,
      'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:En 2 horas es el plan', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    return '<div class="card"><h3>Agrégalo a tu calendario</h3><p class="small muted">Así tu celular te avisa 2 horas antes.</p><div class="actions split">' +
      '<a class="btn btn-ghost" target="_blank" rel="noopener" href="' + S.esc(g) + '">Google Calendar</a>' +
      '<a class="btn btn-ghost" download="plan-sintonia.ics" href="data:text/calendar;charset=utf-8,' + encodeURIComponent(ics) + '">iPhone u otro (.ics)</a></div></div>';
  }

  S.$('#refrescar').onclick = load;
  document.addEventListener('visibilitychange', function () { if (!document.hidden && data && ['votando', 'preparando', 'sin_plan', 'cerrado'].indexOf(data.estado) >= 0) load(); });
  load();
})();
</script>
</body>
</html>
