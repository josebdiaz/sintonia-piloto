<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sintonía · Consola del mago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/sintonia.css">
<link rel="stylesheet" href="assets/ds3.css">
<link rel="stylesheet" href="assets/consola.css">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
/* 2.4.0 · recorrido del mago: mensajes dentro de «Lo que toca ahora», encuestas y evento copiables, decisión por ronda */
.next-msgs { display: grid; gap: 10px; margin-top: 12px; }
.next-msgs .tpl { background: var(--color-bg-surface, #fff); }
.tpl-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; margin-bottom: 4px; }
.poll { border: 1px dashed var(--line, #d9d6cf); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: rgba(44,106,134,.04); }
.poll-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(14,17,22,.06); }
.poll-row:first-of-type { border-top: 0; }
.poll-row > span { min-width: 0; overflow-wrap: anywhere; }
.poll-row .btn { flex: 0 0 auto; }
.dec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.dec-n { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; }
.dec-n input { min-height: 40px; }
#tab-planes input[type="date"] { min-height: 44px; width: 100%; padding: 0 10px; border: 1px solid var(--line, #d9d6cf); border-radius: 12px; background: #fff; font: inherit; }
details.etapa > summary { cursor: pointer; font-size: 1rem; }
</style>
</head>
<body class="consola">
<main class="wrap wide">
  <header class="c-bar">
    <a class="c-id" href="mago.html" aria-label="Sintonía · inicio de la consola"><span class="brand-mark" aria-hidden="true"></span><span class="wm" aria-hidden="true">sinton<span class="i">ı</span>a</span></a>
    <h1>Consola del mago</h1><span class="ver" id="verConsola"></span>
    <div class="mago-tira" id="magoTira" hidden role="status"></div>
    <div class="c-acc">
      <a class="btn btn-sm c-solo-ancho" href="panel.html">Panel</a>
      <button class="btn btn-sm" id="recargar" type="button">↻ Recargar</button>
      <button class="btn btn-sm" id="verAtajos" type="button" aria-haspopup="dialog">Atajos</button>
      <details class="c-mas"><summary>Más</summary><div class="c-menu">
        <a href="investigadores.html">Mapa de vistas</a>
        <a href="panel.html">Panel del piloto</a>
        <button id="cfg" type="button">URL del backend</button>
        <button id="salir" type="button">Salir</button>
      </div></details>
    </div>
  </header>

  <section id="gate" class="hidden">
    <form class="card" id="gateForm" style="max-width:420px">
      <h2>Entrar a la consola</h2>
      <p class="small muted">Solo el equipo. La clave se guarda en esta pestaña y se borra al cerrarla.</p>
      <div class="field"><label for="key">ADMIN_KEY</label><input id="key" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="entrar" data-busy="Verificando…">Entrar</button>
    </form>
  </section>

  <section id="consola" class="hidden">
    <p class="sr-only" id="vivo" aria-live="polite"></p>
    <p class="small muted" id="resumen"></p>
    <div class="consola-top"><div id="expbar"></div><div id="modobox"></div><div id="magobar"></div></div>
    <div id="magoNudge"></div>
    <div class="consola-mid"><div id="glist"></div><div id="siguiente"></div></div>
    <div class="c-tabbar"><nav class="s-tabs" role="tablist" aria-label="Operación">
      <button role="tab" data-tab="grupos" aria-selected="true">Grupo</button>
      <button role="tab" data-tab="planes">Plan</button>
      <button role="tab" data-tab="mensajes">Mensajes</button>
      <button role="tab" data-tab="registro">Llegadas y tiempo</button>
    </nav>
    <details class="c-ajustes"><summary>Ajustes ▾</summary><div class="c-menu">
      <button type="button" data-tab="inventario">Inventario</button>
      <button type="button" data-tab="cambios">Cambios entre planes</button>
      <button type="button" data-tab="reinicio">⟲ Empezar piloto real</button>
    </div></details></div>
    <div id="tab-grupos" class="tab"></div>
    <div id="tab-planes" class="tab hidden"></div>
    <div id="tab-mensajes" class="tab hidden"></div>
    <div id="tab-registro" class="tab hidden"></div>
    <div id="tab-cambios" class="tab hidden"></div>
    <div id="tab-inventario" class="tab hidden"></div>
    <div id="tab-reinicio" class="tab hidden"></div>
  </section>
</main>
<dialog class="hoja" id="hoja" aria-label="Confirmar"></dialog>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var D = null, key = '', sel = { grupo: '', plan: '' }, borrador = [], filtro = 'piloto', formCache = {}, verOcultos = false, lastAct = Date.now(), previo = null;
  var CAUSAS = [['coordinacion', 'Coordinar el plan'], ['redactar_mensaje', 'Redactar mensajes'], ['resolver_duda', 'Resolver una duda'], ['cambio_plan', 'Cambio de plan'], ['recordatorio', 'Recordatorios y checkpoints'], ['falla_tecnica', 'Falla técnica'], ['seguridad', 'Seguridad'], ['otro', 'Otro']];
  var ultimaCarga = null, hashUsado = false;   // 2.0.6: mago.html#reinicio (o #planes, #cambios…) abre esa pestaña
  var CAIDA = [['trafico', 'Tráfico'], ['lluvia', 'Lluvia'], ['agenda', 'Agenda / no cuadró'], ['costo', 'Costo'], ['desinteres', 'Desinterés'], ['imprevisto', 'Imprevisto'], ['otro', 'Otro']];
  var e = S.esc;

  /* ---------- Acceso ---------- */
  function gate(on) { S.show('#gate', on); S.show('#consola', !on); }
  S.$('#gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); S.SS.set('sintonia_admin_key', S.$('#key').value.trim()); S.busy(S.$('#entrar'), load); });
  S.$('#salir').onclick = function () { S.forgetKey(); location.reload(); };
  S.$('#cfg').onclick = S.configBackend;
  S.$('#recargar').onclick = function () { S.busy(this, function () { return load(true); }); };

  var cargaN = 0;   // 2.3.0 (test drive 13/11): una respuesta vieja no pisa una más nueva (los estados «retrocedían»)
  var invCache = null, invTs = 0;   // 2.5.0: el inventario (lo más pesado) se pide una vez cada 10 min o con «Recargar»
  function load(forzar) {
    key = S.adminKey(false);
    if (!key) { gate(true); return Promise.resolve(); }
    var mia = ++cargaN, conInv = forzar === true || !invCache || Date.now() - invTs > 10 * 6e4;
    return S.get(conInv ? { view: 'mago', key: key } : { view: 'mago', key: key, inv: '0' }).then(function (r) {
      if (mia !== cargaN) return;
      if (!r || !r.ok) { if (r && r.error === 'no_autorizado') { S.forgetKey(); gate(true); } S.toast(S.errMsg(r), true); return; }
      if (r.inventario) { invCache = { a: r.inventario, p: r.inventario_pendiente }; invTs = Date.now(); } else if (invCache) { r.inventario = invCache.a; r.inventario_pendiente = invCache.p; }
      avisarNovedades(r);
      D = r; ultimaCarga = new Date(); gate(false); renderAll();
    });
  }
  // 2.4.0 (prueba 14/11): avisa inscripciones y aceptaciones nuevas desde la última carga
  function avisarNovedades(r) {
    var ahora = {}; (r.grupos || []).forEach(function (g) { ahora[g.grupo_id] = g.miembros.length; });
    if (previo) {
      var nuevos = (r.grupos || []).filter(function (g) { return !(g.grupo_id in previo); });
      var mas = (r.grupos || []).filter(function (g) { return g.grupo_id in previo && g.miembros.length > previo[g.grupo_id]; });
      if (nuevos.length) S.toast('Grupo nuevo inscrito: ' + nuevos.map(grupoNom).join(', '));
      else if (mas.length) S.toast('Aceptó alguien más en ' + mas.map(grupoNom).join(', '));
    }
    previo = ahora;
  }
  // 2.4.0: la consola se actualiza sola cada 60 s en cualquier pestaña, salvo mientras escribes. Lo escrito sin guardar se conserva.
  setInterval(function () {
    if (!D || document.hidden) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    var hj = S.$('#hoja'); if (hj && hj.open) return;
    load();
  }, 60000);
  ['click', 'input', 'keydown'].forEach(function (t) { document.addEventListener(t, function () { lastAct = Date.now(); }, true); });
  document.addEventListener('input', function (ev) {   // 2.3.0: el enlace del grupo se guarda en este navegador y llena las invitaciones
    var li = ev.target; if (!li || li.id !== 'linkGrupo') return;
    S.LS.set('sintonia_link_' + li.dataset.gid, li.value.trim());
    S.$$('[data-invita]').forEach(function (b) { b.href = S.wa(b.dataset.wa, invitaTxt(b.dataset.nom, li.value.trim())); });
    clearTimeout(tLink); tLink = setTimeout(function () { if (D) redibujar(function () { renderSiguiente(); renderGlist(); }); }, 700);   // 2.4.0: pegar el enlace avanza el recorrido
  });
  var tLink = null;
  // 2.4.0: copiar (texto fijo o de un cuadro), abrir WhatsApp con el texto editado y «Copiar y marcar enviado», en cualquier pantalla
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-cp],[data-cp-ta],[data-wa-ta]'); if (!b) return;
    if (b.dataset.cp !== undefined) S.copy(b.dataset.cp);
    else if (b.dataset.cpTa) { var t = document.getElementById(b.dataset.cpTa); if (t) S.copy(t.value); }
    if (b.dataset.waTa) { var t2 = document.getElementById(b.dataset.waTa); if (t2) window.open(S.wa(b.dataset.wa, t2.value), '_blank', 'noopener'); }
    if (b.dataset.cpm) marcar(b.dataset.cpm, b);
  });
  // 2.5.0 · Atajos de teclado (no actúan mientras escribes)
  document.addEventListener('keydown', function (ev) {
    if (!D || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return; if (S.$('#hoja') && S.$('#hoja').open) return;
    var k = ev.key.toLowerCase(), sg = S.$('#siguiente'), b = null;
    if (k === 'c') b = S.$('[data-cpm]', sg) || S.$('[data-marca]', sg) || S.$('[data-cp-ta]', sg);
    else if (k === 'n') b = S.$('#irPaso', sg) || S.$('#todosLlegaron', sg) || S.$('#todosCasa', sg);
    else if (k === 'm') b = S.$('a[href*="google.com/maps"]', sg);
    else if (k === '?' || (k === '/' && ev.shiftKey)) { ev.preventDefault(); return verAtajos(); }
    if (b) { ev.preventDefault(); b.focus({ preventScroll: true }); b.click(); }
  });
  function verAtajos() {
    var d = S.$('#hoja'); if (!d || typeof d.showModal !== 'function') return;
    d.innerHTML = '<div class="s-sheet c-ayuda" role="document"><small>Atajos de teclado</small><h2>Opera sin soltar el teclado</h2>' +
      '<dl><dt><kbd>C</kbd></dt><dd>Copia el siguiente mensaje de «Lo que toca ahora» y lo marca como enviado</dd><dt><kbd>N</kbd></dt><dd>Hace la acción del paso (cerrar reclutamiento, crear plan, «Llegaron todos»…)</dd>' +
      '<dt><kbd>M</kbd></dt><dd>Abre el mapa del lugar para revisarlo antes de enviarlo</dd><dt><kbd>?</kbd></dt><dd>Muestra esta ayuda</dd><dt><kbd>Tab</kbd></dt><dd>Recorre los botones; Enter los activa</dd></dl>' +
      '<p class="tiny" style="margin-top:12px">Los atajos no actúan mientras escribes en un campo.</p><div class="s-actions"><button type="button" class="s-button" id="hojaNo">Listo</button></div></div>';
    S.$('#hojaNo', d).onclick = function () { d.close(); }; d.showModal(); S.$('#hojaNo', d).focus();
  }
  S.$('#verAtajos').onclick = verAtajos;
  /** 2.5.0 · Después de redibujar, si el foco quedó en el vacío, vuelve a la acción del paso actual (teclado y lectores de pantalla no pierden el lugar). */
  function devolverFoco() {
    var a = document.activeElement; if (a && a !== document.body && document.contains(a)) return;
    if (Date.now() - lastAct > 3000) return;   // solo justo después de una acción de la persona
    var b = S.$('#siguiente [data-cpm]') || S.$('#siguiente #irPaso') || S.$('#siguiente .acciones button') || S.$('#siguiente [data-marca]');
    if (b) b.focus({ preventScroll: true });
  }
  function act(btn, payload, okMsg) {
    return S.busy(btn, function () { return S.post(Object.assign({ key: key }, payload)); }).then(function (r) {
      if (!r || !r.ok) { S.toast(S.errMsg(r), true); return r; }
      if (okMsg) S.toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      return load().then(function () { return r; });
    });
  }

  /* ---------- 2.4.0 · Lo escrito sin guardar no se pierde al redibujar (prueba 14/11: el cierre se borraba al cambiar de pestaña) ----------
   * Cada campo con data-keep se guarda antes de redibujar y se repone después, por plan (o por grupo si no hay plan). */
  var scopeDom = '';
  function guardarForm() {
    if (!scopeDom) return;
    S.$$('[data-keep]').forEach(function (x) {
      var k = scopeDom + '|' + x.dataset.keep;
      if (x.dataset.keep.indexOf('tpl|') === 0 && x.value === x.defaultValue) { delete formCache[k]; return; }   // un mensaje sin editar sigue su texto base (que puede cambiar)
      formCache[k] = x.value;
    });
  }
  function restaurarForm() {
    S.$$('[data-keep]').forEach(function (x) { var k = scopeDom + '|' + x.dataset.keep; if (k in formCache && x.value !== formCache[k]) { if (x.tagName === 'SELECT' && formCache[k] && !S.$('option[value="' + CSS.escape(formCache[k]) + '"]', x)) return; x.value = formCache[k]; } });
    trasRestaurar(); growAll();
  }
  function olvidarForm(pref) { Object.keys(formCache).forEach(function (k) { if (k.indexOf(scopeDom + '|' + (pref || '')) === 0) delete formCache[k]; }); }
  function redibujar(fn, olvidar) { guardarForm(); if (olvidar) olvidarForm(olvidar); fn(); restaurarForm(); devolverFoco(); }
  var trasRestaurar = function () {};
  function fv(k) { var v = formCache[(sel.plan || sel.grupo) + '|' + k]; return v === undefined ? '' : v; }
  function growAll() { S.$$('.tpl-text').forEach(function (ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; }); }

  /* ---------- Ayudas ---------- */
  function grupo(id) { return (D.grupos || []).filter(function (g) { return g.grupo_id === id; })[0]; }
  function plan(id) { return (D.planes || []).filter(function (p) { return p.plan_id === id; })[0]; }
  function planesDe(gid) { return (D.planes || []).filter(function (p) { return p.grupo_id === gid; }); }
  /* 2.3.0 · ayudas del test drive (13/11) */
  function aFecha(v) { if (!v) return null; var d = v instanceof Date ? v : new Date(String(v).replace(' ', 'T')); return isNaN(d) ? null : d; }
  function horaTxt(d) { return d ? d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', hour12: true }) : ''; }
  function salidaDe(v, min) { var d = aFecha(v); return d ? horaTxt(new Date(d.getTime() - (min || 60) * 6e4)) : ''; }   // traslado conservador en Cali: 1 h
  function corto(s, n) { s = String(s || '').trim(); n = n || 30; if (s.length <= n) return s; var c = s.slice(0, n); var k = c.lastIndexOf(' '); c = (k > 12 ? c.slice(0, k) : c).replace(/[ ,;:·—-]+$/, ''); return c.replace(/\s+(con|de|del|en|y|a|al|la|el|los|las|para|por|o)$/i, ''); }
  function linkGrupo(gid) { return S.LS.get('sintonia_link_' + gid) || ''; }
  function ingresoHecho(gid) { return !!S.LS.get('sintonia_ingreso_' + gid); }
  /* 2.4.0 · ayudas de la segunda prueba (14/11) */
  function grupoNom(g) { return g ? (g.nombre || (g.tipo_grupo + ' · ' + String(g.grupo_id).slice(-6))) : ''; }
  var DIAS = { entre_semana: 'entre semana', viernes: 'viernes', sabado: 'sábado', domingo: 'domingo' }, FRANJAS = { manana: 'mañana', tarde: 'tarde', noche: 'noche' };
  function dispoDe(g) {
    var t = String((g && g.disponibilidad) || ''), m = t.match(/dias:\s*([^·]*)/), f = t.match(/franjas:\s*(.*)$/);
    var l = function (x, M) { return x ? x[1].split(',').map(function (s) { return s.trim(); }).filter(Boolean).map(function (s) { return M[s] || s.replace(/_/g, ' '); }) : []; };
    return { dias: l(m, DIAS), franjas: l(f, FRANJAS) };
  }
  function oList(a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' o ' + a[a.length - 1]; }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function diaTxt(g) { var d = dispoDe(g); if (!d.dias.length && !d.franjas.length) return ''; var dd = d.dias.map(function (x) { return x === 'entre semana' ? x : 'el ' + x; }); return (dd.length ? oList(dd) : '') + (d.franjas.length ? (dd.length ? ' en la ' : 'la ') + oList(d.franjas) : ''); }
  /** 2.5.0 (QA 14/11): los enlaces de ubicación no abrían el lugar. Ahora se busca por nombre y dirección (Google Maps abre la ficha del lugar);
   *  las coordenadas son respaldo y solo valen si caen en Cali. Una hoja en español puede leer «3.4516» como 34516: se corrige si es posible. */
  function coordCali(v, min, max) {
    var n = Number(String(v === undefined || v === null ? '' : v).trim().replace(/\s/g, '').replace(',', '.'));
    if (!isFinite(n) || n === 0) return null;
    for (var k = 0; k < 8 && (n < min || n > max) && Math.abs(n) > Math.max(Math.abs(min), Math.abs(max)); k++) n = n / 10;
    return n >= min && n <= max ? Math.round(n * 1e6) / 1e6 : null;
  }
  function ubicacionDe(s) {
    if (!s) return { ok: false };
    var la = coordCali(s.latitud, 3.2, 3.6), lo = coordCali(s.longitud, -76.7, -76.3), dir = String(s.direccion || '').trim(), nom = String(s.nombre || '').trim();
    if (nom || dir) return { ok: true, q: [nom, dir, 'Cali, Valle del Cauca'].filter(Boolean).join(', '), coords: la !== null && lo !== null };
    if (la !== null && lo !== null) return { ok: true, q: la + ',' + lo, coords: true };
    return { ok: false };
  }
  function mapaDe(s) { var u = ubicacionDe(s); return u.ok ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(u.q) : ''; }
  /** un dato vacío nunca reemplaza uno bueno al combinar la parada con el inventario */
  function mezcla(a, b) { var o = Object.assign({}, a || {}); Object.keys(b || {}).forEach(function (k) { if (b[k] !== '' && b[k] !== null && b[k] !== undefined) o[k] = b[k]; }); return o; }
  function horasFranja(g) { var f = dispoDe(g).franjas[0] || 'tarde'; return f === 'mañana' ? ['9:00 a. m.', '10:00 a. m.', '11:00 a. m.'] : f === 'noche' ? ['7:00 p. m.', '8:00 p. m.', '9:00 p. m.'] : ['3:00 p. m.', '4:00 p. m.', '5:00 p. m.']; }
  function poll(q, ops, multi) { return { q: q, ops: ops, multi: !!multi }; }
  function porPersona(x) { x = String(x || ''); return x ? x + (/por persona/i.test(x) ? '' : ' por persona') : ''; }
  function txtPulso(nom, l) { return (nom ? nom + ', ¿c' : '¿C') + 'ómo te fue en el plan? Cuéntanos en 4 minutos: ' + l + '\nTus respuestas son privadas.'; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function horaOpts(val) {
    var h = '<option value="">Elige la hora…</option>', hay = false;
    for (var m = 6 * 60; m < 24 * 60; m += 15) { var hh = pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); if (hh === val) hay = true; h += '<option value="' + hh + '"' + (hh === val ? ' selected' : '') + '>' + horaTxt(new Date(2000, 0, 1, Math.floor(m / 60), m % 60)) + '</option>'; }
    if (val && !hay) { var pp = val.split(':'); h += '<option value="' + val + '" selected>' + horaTxt(new Date(2000, 0, 1, +pp[0], +pp[1])) + '</option>'; }
    return h;
  }
  /** 2.4.0: día y hora en dos campos (la hora en una lista de 15 en 15 min). El navegador ya no rechaza una hora sin fecha. */
  function campoEncuentro(pref, iso) {
    var v = localDT(iso), f = v ? v.slice(0, 10) : hoyISO(), hh = v ? v.slice(11, 16) : '';
    return '<div class="row"><div class="field"><label for="fecha' + pref + '">Día del encuentro</label><input id="fecha' + pref + '" type="date" data-keep="fecha' + pref + '" value="' + f + '"></div>' +
      '<div class="field"><label for="hora' + pref + '">Hora del encuentro</label><select id="hora' + pref + '" data-keep="hora' + pref + '">' + horaOpts(hh) + '</select></div></div>';
  }
  function leerEncuentro(pref, el) { var f = S.$('#fecha' + pref, el), h = S.$('#hora' + pref, el); return f && h && f.value && h.value ? f.value + 'T' + h.value : ''; }
  function archivados() { try { return JSON.parse(S.LS.get('sintonia_archivados') || '[]'); } catch (x) { return []; } }

    S.$('#minGuardar', el).onclick = function () {
      var n = parseInt(S.$('#minN', el).value, 10); if (!(n > 0)) return S.toast('Escribe los minutos.', true);
      var rv = (D.sesiones_por_revisar || []).filter(function (x) { return x.plan_id === sel.plan; })[0] || (D.sesiones_por_revisar || [])[0];   // 2.2.2: completa una sesión que se cerró sola
      act(this, { action: 'operacion', plan_id: sel.plan, grupo_id: sel.grupo, experimento: (g || {}).experimento || vexp, actor: S.$('#minActor', el).value, minutos: n, causa: rv ? 'sesion' : S.$('#minCausa', el).value, nota: S.$('#minNota', el).value || (rv ? rv.sesion_id + ' (cierre automático)' : ''), sesion_id: rv ? rv.sesion_id : '' }, n + ' min registrados');
    };
  }

  /* ---------- Cambios entre plan 1 y plan 2 (regla I4) ----------
   * 2.0.5: una tarjeta por experimento, con su estado y un ejemplo, en lugar de un formulario con la condición en un menú. */
  var EJEMPLO_CAMBIO = {
    E1: 'Ej.: enviar la hora de salida según el tráfico 2 h antes del encuentro, porque en el plan 1 dos personas llegaron tarde.',
    E2: 'Ej.: que el motor mande un solo recordatorio de voto, porque en el plan 1 hubo que escribir a mano.'
  };
  function renderCambios() {
    var el = S.$('#tab-cambios'), cs = D.cambios || [];
    var h = '<div class="card soft small"><b>Qué es esto.</b> Entre el plan 1 y el plan 2 se permite <b>un solo cambio por condición</b>, y solo si el equipo lo decide al revisar el panel. No es obligatorio. ' +
      'Así, si el plan 2 sale distinto, sabemos qué lo cambió. Al registrarlo, los grupos piloto de esa condición pasan de v1 a v2. La medición (SEQ y SUS) no cuenta como cambio.</div><div class="grid two">';
    h += ['E1', 'E2'].map(function (k) {
      var c = cs.filter(function (x) { return x.experimento === k; }), ya = c.length > 0, u = c[c.length - 1];
      return '<div class="card cambio ' + EXP[k].clase + (k === vexp ? ' actual' : '') + '"><div class="actions" style="margin:0 0 8px;justify-content:space-between;flex-wrap:wrap">' + expChip(k) +
        '<span class="st ' + (ya ? 'llego' : 'sin') + '">' + (ya ? 'Cambio registrado' : 'Sin cambio todavía') + '</span></div>' +
        (ya ? '<p class="small" style="margin:0 0 6px"><b>' + e(u.version) + '</b> · ' + e(String(u.ts || '').slice(0, 10)) + '</p><p class="small" style="margin:0">' + e(u.descripcion) + '</p>' +
          (c.length > 1 ? '<p class="small" style="margin:8px 0 0;color:var(--danger)">Hay ' + c.length + ' cambios en este experimento: el protocolo permite uno. Explícalo en el informe.</p>' : '') :
          '<div class="field"><label for="cDesc' + k + '">Qué cambia y por qué</label><textarea id="cDesc' + k + '" maxlength="600" placeholder="' + e(EJEMPLO_CAMBIO[k]) + '"></textarea></div>' +
          '<div class="row"><div class="field"><label for="cVer' + k + '">Versión nueva</label><input id="cVer' + k + '" type="text" maxlength="10" value="v2"></div><div class="field"><label for="cPor' + k + '">Registrado por</label><input id="cPor' + k + '" type="text" maxlength="40"></div></div>' +
          '<div class="actions"><button class="btn btn-primary btn-sm" data-cambio="' + k + '" data-busy="Guardando…">Registrar el cambio de ' + EXP[k].corto + '</button></div>') + '</div>';
    }).join('') + '</div>';
    el.innerHTML = h;
    S.$$('[data-cambio]', el).forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.cambio, ver = S.$('#cVer' + k, el).value.trim(), d = S.$('#cDesc' + k, el).value.trim();
        if (!ver || !d) return S.toast('Escribe qué cambia y la versión.', true);
        S.dosPasos(b, '¿Registrar el único cambio permitido para ' + EXP[k].nombre + '? Los grupos piloto de ' + EXP[k].corto + ' pasan a ' + ver + '.', function () {
          act(b, { action: 'registrar_cambio', experimento: k, version: ver, descripcion: d, por: S.$('#cPor' + k, el).value }, function (r) { return r.alerta || 'Cambio registrado'; });
        });
      };
    });
  }

  function renderInventario() {
    var inv = D.inventario || [], pend = D.inventario_pendiente || [];
    S.$('#tab-inventario').innerHTML = '<div class="card"><h3>Inventario activo (' + inv.length + ')</h3><p class="small muted">Solo estos lugares pueden aparecer en un plan. Antes de cada fin de semana, confirma horarios y cierres.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Zona</th><th>Costo</th><th>Horario</th><th>Verificado</th></tr></thead><tbody>' +
      inv.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.categoria) + '</span></td><td>' + e(i.zona) + '</td><td>' + e(i.costo_aprox) + '</td><td>' + e(i.horario) + '</td><td class="tiny">' + e(String(i.verificado_el).slice(0, 10)) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><h3>Ronda de llamadas · por confirmar (' + pend.length + ')</h3><p class="small muted">Antes de cada fin de semana: llama, confirma que abrió tras el sismo, horario y costo, y cambia <b>estado</b> a <b>activo</b> en la hoja "inventario" (con la fecha en verificado_el). Los teléfonos marcados "sin verificar" vienen de la lista de Gemini.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Teléfono</th><th>Qué confirmar</th></tr></thead><tbody>' +
      pend.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.zona) + '</span></td><td class="small">' + e(i.telefono_para_llamar || '—') + '</td><td class="tiny">Horario: ' + e(i.horario) + '<br>Costo: ' + e(i.costo_aprox) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }

  /* ---------- 2.0.6 · Empezar el piloto real (backend 2.2.4: limpiar_registros) ----------
   * Borra los registros de los ensayos en la hoja. Conserva tokens, inventario y bitácora. Antes, el backend hace un respaldo sin contactos. */
  var HOJAS = { participantes: 'Personas inscritas', contactos: 'Nombres y WhatsApp', grupos: 'Grupos', linea_base_grupo: 'Línea base por grupo', linea_base: 'Línea base por persona',
    preferencias: 'Preferencias', planes: 'Planes', votos: 'Votos', eventos: 'Eventos', operacion: 'Minutos del mago', cambios: 'Cambios entre planes', sesiones: 'Sesiones del mago (in / off)', retro: 'Pulsos (retro)', wtp: 'Disposición a pagar', usabilidad: 'Usabilidad (SEQ + SUS)',
    alertas: 'Alertas (archivo)', revisiones: 'Revisiones (archivo)', suscripciones: 'Suscripciones a avisos', avisos: 'Avisos programados',
    tokens: 'Tokens de IA (costo)', inventario: 'Inventario de lugares', bitacora: 'Bitácora de reinicios' };
  var FRASE = 'EMPEZAR PILOTO', ultimoReinicio = null;
  function renderReinicio() {
    var el = S.$('#tab-reinicio'), reg = D.registros, cons = D.conservar_al_limpiar || ['tokens', 'inventario', 'bitacora'];
    if (!reg) { el.innerHTML = '<div class="card warn"><h3>Falta actualizar el backend</h3><p class="small">El backend en vivo todavía no tiene el reinicio. Pega <b>backend/Codigo_Piloto.gs</b> (2.2.4) en Apps Script → Implementar → Administrar implementaciones → editar → <b>Nueva versión</b>. La URL /exec no cambia.</p></div>'; return; }
    var conservarCambios = !!(S.$('#rc-cambios') && S.$('#rc-cambios').checked);
    var borrar = Object.keys(reg).filter(function (n) { return cons.indexOf(n) < 0 && !(conservarCambios && n === 'cambios'); });
    var total = borrar.reduce(function (s, n) { return s + (reg[n] || 0); }, 0);
    var pruebas = (D.grupos || []).filter(function (g) { return g.modo === 'prueba'; }).length, piloto = (D.grupos || []).filter(function (g) { return g.modo === 'piloto'; }).length;
    var fila = function (n) { return '<tr><td>' + e(HOJAS[n] || n) + '<br><span class="tiny muted">' + e(n) + '</span></td><td style="text-align:right">' + S.num(reg[n] || 0) + '</td></tr>'; };
    var h = '';
    if (ultimoReinicio) h += '<div class="card soft"><h3>✓ Listo: la hoja quedó en blanco</h3><p class="small">Se borraron ' + S.num(ultimoReinicio.total) + ' registros. ' +
      (ultimoReinicio.respaldo ? 'Respaldo (sin contactos) en tu Drive: <a href="' + e(ultimoReinicio.respaldo) + '" target="_blank" rel="noopener">abrir la hoja de respaldo ↗</a>.' : 'No había nada que respaldar.') +
      ' La consola quedó en modo <b>Piloto (cuenta)</b>. Ya pueden compartir los enlaces de inscripción reales.</p></div>';
    h += '<div class="card danger"><h3>Empezar el piloto real</h3>' +
      '<p class="small">Borra todo lo que dejaron los ensayos para que la semana de pruebas arranque en cero: grupos, personas, votos, eventos, minutos y pulsos. <b>Se conservan los tokens</b> (el costo de IA acumulado), el inventario y la bitácora. Antes de borrar, el backend copia las pestañas a una hoja de respaldo nueva en el Drive del dueño del script, <b>sin la pestaña de contactos</b>.</p>' +
      '<p class="small" style="margin:6px 0 0">Hoy hay <b>' + pruebas + '</b> grupo(s) en modo prueba y <b>' + piloto + '</b> en modo piloto. ' + (piloto ? '<b>Ojo:</b> los grupos en modo piloto también se borran.' : '') + '</p></div>' +
      '<div class="grid two"><div class="card"><h3>Se borra (' + S.num(total) + ' registros)</h3><div class="table-scroll"><table><thead><tr><th>Pestaña</th><th style="text-align:right">Filas</th></tr></thead><tbody>' + borrar.map(fila).join('') + '</tbody></table></div></div>' +
      '<div class="card soft"><h3>Se conserva</h3><div class="table-scroll"><table><thead><tr><th>Pestaña</th><th style="text-align:right">Filas</th></tr></thead><tbody>' + cons.concat(conservarCambios ? ['cambios'] : []).filter(function (n) { return n in reg; }).map(fila).join('') + '</tbody></table></div>' +
      '<label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="rc-cambios"' + (conservarCambios ? ' checked' : '') + '> <span>Conservar también <b>Cambios entre planes</b> (solo si ya registraron un cambio que vale para el piloto real).</span></label></div></div>' +
      '<div class="card"><h3>Antes de borrar</h3><ol class="pasos small"><li>El ensayo terminó y nadie está votando ni respondiendo un pulso.</li><li>El equipo sabe que se reinicia (los enlaces personales de los ensayos dejan de funcionar).</li><li>Si alguien quiere revisar algo del ensayo, que lo haga ahora o en el respaldo.</li></ol>' +
      '<div class="field" style="max-width:420px"><label for="rc-frase">Para confirmar, escribe <b>' + FRASE + '</b></label><input id="rc-frase" autocomplete="off" spellcheck="false" placeholder="' + FRASE + '"></div>' +
      '<div class="actions"><button class="btn btn-danger" type="button" id="rc-go" disabled data-busy="Respaldando y borrando…">Borrar los ensayos y empezar el piloto</button></div>' +
      '<p class="tiny muted">No se puede deshacer desde la consola; lo borrado queda solo en la hoja de respaldo.</p></div>';
    var bit = D.bitacora || [];
    if (bit.length) h += '<div class="card"><h3>Reinicios anteriores</h3><ul class="small">' + bit.slice().reverse().map(function (b) {
      var n = 0; try { var o = JSON.parse(b.detalle || '{}'); Object.keys(o).forEach(function (k) { n += Number(o[k]) || 0; }); } catch (x) {}
      return '<li>' + e(S.fecha(b.ts)) + ' · ' + S.num(n) + ' registros' + (b.respaldo_url ? ' · <a href="' + e(b.respaldo_url) + '" target="_blank" rel="noopener">respaldo ↗</a>' : '') + '</li>'; }).join('') + '</ul></div>';
    el.innerHTML = h;
    S.$('#rc-cambios', el).onchange = renderReinicio;
    var inp = S.$('#rc-frase', el), go = S.$('#rc-go', el);
    inp.oninput = function () { go.disabled = inp.value.trim().toUpperCase() !== FRASE || !total; };
    go.onclick = function () {
      S.busy(go, function () { return S.post({ action: 'limpiar_registros', key: key, confirmar: inp.value.trim(), conservar_cambios: conservarCambios, registrado_por: 'consola' }); }).then(function (r) {
        if (!r || !r.ok) { S.toast(S.errMsg(r), true); return; }
        try { Object.keys(window.localStorage).forEach(function (k) { if (/^sintonia_hechos_/.test(k)) S.LS.del(k); }); } catch (x) {}
        ultimoReinicio = r; filtro = 'piloto'; sel.grupo = ''; sel.plan = ''; borrador = [];
        S.toast('Hoja en blanco · ' + S.num(r.total) + ' registros borrados');
        return load();
      });
    };
  }

  load();
})();
</script>
</body>
</html>
