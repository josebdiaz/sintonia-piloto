<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sintonía · Consola del mago</title>
<link rel="stylesheet" href="assets/sintonia.css">
</head>
<body>
<main class="wrap wide">
  <header class="top">
    <a class="brand" href="mago.html"><span class="brand-mark" aria-hidden="true"></span>Consola del mago <span class="tag">E1 · E2</span></a>
    <div class="actions" style="margin:0">
      <a class="btn btn-ghost btn-sm" href="panel.html">Panel →</a>
      <button class="btn btn-ghost btn-sm" id="recargar" type="button">↻ Recargar</button>
      <button class="btn btn-ghost btn-sm" id="cfg" type="button" title="URL del backend">⚙ Backend</button>
      <button class="btn btn-ghost btn-sm" id="salir" type="button">Salir</button>
    </div>
  </header>

  <section id="gate" class="hidden">
    <form class="card" id="gateForm" style="max-width:420px">
      <h2>Entrar a la consola</h2>
      <p class="small muted">Solo el equipo. La clave se guarda en esta pestaña y se borra al cerrarla.</p>
      <div class="field"><label for="key">ADMIN_KEY</label><input id="key" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="entrar" data-busy="Verificando…">Entrar</button>
    </form>
  </section>

  <section id="consola" class="hidden">
    <p class="small muted" id="resumen"></p>
    <div id="expbar"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="grupos" aria-selected="true">1 · Grupos y quórum</button>
      <button role="tab" data-tab="planes">2 · Curaduría de planes</button>
      <button role="tab" data-tab="mensajes">3 · Mensajes</button>
      <button role="tab" data-tab="registro">4 · Eventos y minutos</button>
      <button role="tab" data-tab="cambios">Cambios W1 → W2</button>
      <button role="tab" data-tab="inventario">Inventario</button>
    </nav>
    <div id="tab-grupos" class="tab"></div>
    <div id="tab-planes" class="tab hidden"></div>
    <div id="tab-mensajes" class="tab hidden"></div>
    <div id="tab-registro" class="tab hidden"></div>
    <div id="tab-cambios" class="tab hidden"></div>
    <div id="tab-inventario" class="tab hidden"></div>
  </section>
</main>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var D = null, key = '', sel = { grupo: '', plan: '' }, borrador = [], filtro = 'piloto';
  var CAUSAS = [['coordinacion', 'Coordinar el plan'], ['redactar_mensaje', 'Redactar mensajes'], ['resolver_duda', 'Resolver una duda'], ['cambio_plan', 'Cambio de plan'], ['recordatorio', 'Recordatorios y checkpoints'], ['falla_tecnica', 'Falla técnica'], ['seguridad', 'Seguridad'], ['otro', 'Otro']];
  var ultimaCarga = null;
  var CAIDA = [['trafico', 'Tráfico'], ['lluvia', 'Lluvia'], ['agenda', 'Agenda / no cuadró'], ['costo', 'Costo'], ['desinteres', 'Desinterés'], ['imprevisto', 'Imprevisto'], ['otro', 'Otro']];
  var e = S.esc;

  /* ---------- Acceso ---------- */
  function gate(on) { S.show('#gate', on); S.show('#consola', !on); }
  S.$('#gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); S.SS.set('sintonia_admin_key', S.$('#key').value.trim()); S.busy(S.$('#entrar'), load); });
  S.$('#salir').onclick = function () { S.forgetKey(); location.reload(); };
  S.$('#cfg').onclick = S.configBackend;
  S.$('#recargar').onclick = function () { S.busy(this, load); };

  function load() {
    key = S.adminKey(false);
    if (!key) { gate(true); return Promise.resolve(); }
    return S.get({ view: 'mago', key: key }).then(function (r) {
      if (!r || !r.ok) { if (r && r.error === 'no_autorizado') { S.forgetKey(); gate(true); } S.toast(S.errMsg(r), true); return; }
      D = r; ultimaCarga = new Date(); gate(false); renderAll();
    });
  }
  // 2.0.4 (QA 5/10): las inscripciones nuevas aparecen solas. Recarga cada 60 s solo en la pestaña 1, con la consola visible y sin un campo en edición.
  setInterval(function () {
    if (!D || document.hidden || S.$('#tab-grupos').classList.contains('hidden')) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    load();
  }, 60000);
  function act(btn, payload, okMsg) {
    return S.busy(btn, function () { return S.post(Object.assign({ key: key }, payload)); }).then(function (r) {
      if (!r || !r.ok) { S.toast(S.errMsg(r), true); return r; }
      if (okMsg) S.toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      return load().then(function () { return r; });
    });
  }

  /* ---------- Ayudas ---------- */
  function grupo(id) { return (D.grupos || []).filter(function (g) { return g.grupo_id === id; })[0]; }
  function plan(id) { return (D.planes || []).filter(function (p) { return p.plan_id === id; })[0]; }
  function planesDe(gid) { return (D.planes || []).filter(function (p) { return p.grupo_id === gid; }); }
  function nombre(gid, pid) { var g = grupo(gid); var m = g && g.miembros.filter(function (x) { return x.pid === pid; })[0]; return m ? m.nombre || pid : pid; }
  function badge(t) { return '<span class="badge ' + e(t) + '">' + e(t) + '</span>'; }
  function opts(list, val) { return list.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + e(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + e(o[1]) + '</option>'; }).join(''); }
  function grupoLabel(g) { return g.tipo_grupo + ' · ' + g.experimento + ' · ' + g.grupo_id.slice(-6) + (g.modo === 'prueba' ? ' (prueba)' : ''); }
  function linkPlan(pid) { return S.link('plan.html', { pid: pid }); }
  function linkRetro(pid, planId) { return S.link('retro.html', { pid: pid, plan_id: planId }); }
  function organizador(g) { return (g.miembros || []).filter(function (m) { return m.rol === 'organizador'; })[0]; }
  /** 2.0.4 (QA 5/10): "Abrir chat" deja escrito el primer mensaje según el estado del grupo y el rol de la persona. */
  function primerMensaje(g, m) {
    var org = organizador(g), n = g.miembros.length, inv = Number(g.n_invitados) || n, esOrg = m.rol === 'organizador';
    var hola = 'Hola ' + (m.nombre || '') + ' 👋 Soy Sintonía, el quinto amigo que ayuda a que el plan sí se dé.';
    if (g.estado === 'reclutando') return esOrg
      ? hola + ' Ya aceptaron ' + n + ' de ' + inv + ' personas de tu parche. Cuando estén todas, armo el grupo del plan por aquí. Si alguien no ha visto la invitación, este es el enlace: ' + S.link('unirse.html', { inv: g.codigo_invitacion })
      : hola + ' Ya quedaste en el parche de ' + (org ? org.nombre : 'tu grupo') + '. Cuando acepten todos, te escribimos para armar el plan.';
    if (g.experimento === 'E2') return '';   // E2: el mago no escribe a los miembros (protocolo §4); cada persona tiene su enlace desde unirse.html
    return esOrg
      ? hola + ' ¡Ya aceptaron las ' + n + ' personas de tu parche! En unos minutos creo el grupo del plan por aquí con todos. En este piloto una persona del equipo revisa lo que propongo.'
      : hola + ' Ya aceptaron todos en el parche de ' + (org ? org.nombre : 'tu grupo') + '. En unos minutos te agrego al grupo del plan por aquí. Si prefieres no seguir, responde SALIR.';
  }
  function localDT(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return ''; var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  /* ---------- 2.0.5 · Experimento en operación ----------
   * Desde el primer momento la consola trabaja sobre UNA condición: E1 (WhatsApp + mago) o E2 (web app).
   * Todo lo que se ve (grupos, planes, mensajes, eventos) se filtra por esa condición y cada pantalla dice qué hace el mago en ella. */
  var EXP = {
    E1: { nombre: 'E1 · WhatsApp + mago', corto: 'WhatsApp + mago', clase: 'e1',
      prueba: 'Si coordinar dentro de un grupo de WhatsApp, con una persona detrás del número Sintonía, mueve más gente del «me apunto» a llegar.',
      grupo: 'Vota, confirma y avisa que llegó escribiendo en el grupo de WhatsApp del plan.',
      mago: 'Crea el grupo de WhatsApp, envía cada mensaje y registra aquí votos, confirmaciones y llegadas.',
      mide: 'Llegaron / invitadas, horas hasta cerrar, vetos y minutos del mago por plan.',
      pasos: [['grupos', 'Cuando acepten todos: cerrar reclutamiento, abrir el chat y crear el grupo de WhatsApp'], ['mensajes', 'Enviar /ingreso'], ['planes', 'Crear el plan, pedir opciones a Gemini y publicar'], ['mensajes', 'Enviar /opciones'], ['planes', 'Registrar votos y cerrar con día y hora'], ['mensajes', 'Enviar /confirmado, la hora de salida y el checkpoint'], ['registro', 'Registrar quién se apuntó, quién llegó y quién está en casa'], ['planes', 'Enviar el pulso y, para W2, crear la ronda 2 en el mismo grupo']] },
    E2: { nombre: 'E2 · Web app', corto: 'Web app', clase: 'e2',
      prueba: 'Si salirse de WhatsApp a una página web, donde cada persona vota y confirma con su enlace, ayuda o estorba.',
      grupo: 'Vota, confirma y marca «¡Llegué!» en su página personal (plan.html).',
      mago: 'Solo cura las opciones y cierra el plan. No escribe a los miembros; si a las 2 h faltan votos, avisa solo al organizador.',
      mide: 'Lo mismo que E1, con el registro automático de la página y los minutos del mago.',
      pasos: [['grupos', 'Cuando acepten todos: cerrar reclutamiento (cada persona ya tiene su enlace)'], ['planes', 'Crear el plan, pedir opciones a Gemini y publicar'], ['planes', 'Esperar los votos; a las 2 h, si faltan, avisar al organizador'], ['planes', 'Cerrar con día y hora'], ['registro', 'Revisar quién se apuntó y quién llegó (lo registra la página)'], ['planes', 'El pulso aparece solo en la página de cada persona; para W2, crear la ronda 2']] }
  };
  var RONDA = { 1: 'W1 · 10–11/10', 2: 'W2 · 17–18/10' };
  var vexp = S.LS.get('sintonia_mago_exp') === 'E2' ? 'E2' : 'E1';
  function expChip(k) { return '<span class="xp ' + EXP[k].clase + '">' + e(EXP[k].nombre) + '</span>'; }
  function rondaLabel(p) { return 'Ronda ' + p.ronda + (RONDA[p.ronda] ? ' · ' + RONDA[p.ronda] : ''); }
  function gruposVista() { return (D.grupos || []).filter(function (g) { return g.experimento === vexp && (filtro === 'todos' || g.modo === filtro); }); }
  function linkInscripcion() { return S.link('index.html', filtro === 'prueba' ? { exp: vexp, modo: 'prueba' } : { exp: vexp }); }
  function irA(tab) { var b = S.$('[data-tab="' + tab + '"]'); if (b) b.click(); }
  function renderExpbar() {
    var x = EXP[vexp], el = S.$('#expbar'), gs = gruposVista();
    var abierto = S.LS.get('sintonia_mago_guia_' + vexp) !== 'cerrada';
    el.innerHTML = '<div class="expbar ' + x.clase + '"><div class="row" style="align-items:flex-end;flex-wrap:wrap">' +
      '<div class="field" style="margin:0;flex:2 1 320px"><span class="label">¿Qué experimento estás operando?</span><div class="seg" role="radiogroup" aria-label="Experimento">' +
      ['E1', 'E2'].map(function (k) { return '<button type="button" role="radio" aria-checked="' + (k === vexp) + '" class="' + EXP[k].clase + '" data-exp="' + k + '">' + e(EXP[k].nombre) + '</button>'; }).join('') + '</div></div>' +
      '<div class="field" style="margin:0;flex:1 1 160px"><label for="filtro">Modo</label><select id="filtro">' + opts([['piloto', 'Piloto (cuenta)'], ['prueba', 'Prueba (no cuenta)'], ['todos', 'Todos']], filtro) + '</select></div></div>' +
      '<details id="guia"' + (abierto ? ' open' : '') + '><summary><b>Cómo funciona ' + e(x.nombre) + '</b> · ' + gs.length + ' grupo(s) en esta vista</summary>' +
      '<div class="grid two" style="margin-top:8px"><div class="small"><p style="margin:0 0 6px"><b>Qué se prueba.</b> ' + e(x.prueba) + '</p><p style="margin:0 0 6px"><b>El grupo.</b> ' + e(x.grupo) + '</p><p style="margin:0 0 6px"><b>El mago.</b> ' + e(x.mago) + '</p><p style="margin:0"><b>Se mide.</b> ' + e(x.mide) + '</p>' +
      '<p class="tiny muted" style="margin:8px 0 0">Ronda 1 = W1 (10–11/10) · Ronda 2 = W2 (17–18/10) · cada grupo se queda en su experimento en las dos rondas.</p>' +
      '<p class="small" style="margin:10px 0 4px"><b>Enlace para inscribir un grupo en ' + vexp + (filtro === 'prueba' ? ' (modo prueba)' : '') + ':</b></p><div class="linkbox">' + e(linkInscripcion()) + '</div><div class="actions" style="margin-top:6px"><button class="btn btn-ghost btn-sm" type="button" id="copiarInsc">Copiar enlace</button></div></div>' +
      '<ol class="pasos small">' + x.pasos.map(function (p) { return '<li><a href="#" class="linklike" data-ir="' + p[0] + '">' + e(p[1]) + '</a> <span class="tiny muted">(' + ({ grupos: 'pestaña 1', planes: 'pestaña 2', mensajes: 'pestaña 3', registro: 'pestaña 4' })[p[0]] + ')</span></li>'; }).join('') + '</ol></div></details></div>';
    S.$$('[data-exp]', el).forEach(function (b) { b.onclick = function () { vexp = b.dataset.exp; S.LS.set('sintonia_mago_exp', vexp); sel.grupo = ''; sel.plan = ''; borrador = []; dest = 'grupo'; renderAll(); }; });
    S.$('#filtro', el).onchange = function () { filtro = this.value; sel.grupo = ''; sel.plan = ''; renderAll(); };
    S.$('#guia', el).addEventListener('toggle', function () { S.LS.set('sintonia_mago_guia_' + vexp, this.open ? 'abierta' : 'cerrada'); });
    S.$$('[data-ir]', el).forEach(function (b) { b.onclick = function (ev) { ev.preventDefault(); irA(b.dataset.ir); }; });
    S.$('#copiarInsc', el).onclick = function () { S.copy(linkInscripcion()); };
  }

  function renderAll() {
    var todos = D.grupos || [], gs = gruposVista();
    S.$('#resumen').textContent = 'Total: ' + todos.filter(function (g) { return g.modo === 'piloto' && g.experimento === 'E1'; }).length + ' grupos piloto en E1 y ' + todos.filter(function (g) { return g.modo === 'piloto' && g.experimento === 'E2'; }).length + ' en E2 · ' +
      (D.inventario || []).length + ' lugares activos en el inventario' +
      (ultimaCarga ? ' · actualizado ' + String(ultimaCarga.getHours()).padStart(2, '0') + ':' + String(ultimaCarga.getMinutes()).padStart(2, '0') : '');
    if (!sel.grupo || !gs.some(function (g) { return g.grupo_id === sel.grupo; })) { var a = gs.filter(function (g) { return g.estado === 'activo'; })[0] || gs[0]; sel.grupo = a ? a.grupo_id : ''; }
    var ps = planesDe(sel.grupo); if (!sel.plan || !plan(sel.plan) || plan(sel.plan).grupo_id !== sel.grupo) sel.plan = ps.length ? ps[ps.length - 1].plan_id : '';
    renderExpbar(); renderGrupos(); renderPlanes(); renderMensajes(); renderRegistro(); renderCambios(); renderInventario();
  }

  /* ---------- Pestañas ---------- */
  S.$$('[data-tab]').forEach(function (b) {
    b.onclick = function () { S.$$('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); }); S.$$('.tab').forEach(function (t) { S.show(t, t.id === 'tab-' + b.dataset.tab); }); };
  });

  /* ---------- 1 · Grupos y quórum (I9) ---------- */
  function renderGrupos() {
    var el = S.$('#tab-grupos');
    var gs = gruposVista(), h = '';
    if (!gs.length) h += '<div class="card empty"><p class="muted">No hay grupos de ' + e(EXP[vexp].nombre) + ' en este modo. Para inscribir uno, comparte <b>index.html?exp=' + vexp + (filtro === 'prueba' ? '&amp;modo=prueba' : '') + '</b>.</p></div>';
    h += '<div class="grid two">' + gs.map(function (g) {
      var n = g.miembros.length, inv = Number(g.n_invitados) || 0, invLink = S.link('unirse.html', { inv: g.codigo_invitacion });
      var mm = g.miembros.map(function (m) {
        var personal = linkPlan(m.pid);
        return '<div class="member"><div class="who"><b>' + e(m.nombre || '—') + '</b> <span class="tiny muted">' + e(m.rol) + '</span><br><span class="tiny muted">+' + e(S.phone(m.whatsapp)) + '</span></div>' +
          (function () { var pm = primerMensaje(g, m); return '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' + e(S.wa(m.whatsapp, pm)) + '"' + (pm ? ' title="Abre WhatsApp con el primer mensaje escrito; revísalo antes de enviar">Abrir chat con mensaje' : '>Abrir chat') + '</a>'; })() +
          (personal ? '<button class="btn btn-ghost btn-sm" data-copy="' + e(personal) + '">' + (g.experimento === 'E2' ? 'Copiar su enlace' : 'Enlace web (contingencia)') + '</button>' : '') +
          '<button class="btn btn-danger btn-sm" data-revocar="' + e(m.pid) + '" data-nombre="' + e(m.nombre) + '" data-busy="Purgando…">Revocar y purgar</button></div>';
      }).join('');
      return '<div class="card"><div class="actions" style="margin:0 0 8px;justify-content:space-between"><h3 style="margin:0">' + e(g.tipo_grupo) + ' · ' + e(g.grupo_id.slice(-6)) + '</h3>' + expChip(g.experimento) + '<span>' + badge(g.estado) + ' ' + (g.modo === 'prueba' ? badge('prueba') : '') + ' <span class="badge">' + e(g.version || 'v1') + '</span></span></div>' +
        '<p class="small" style="margin:0">Quórum: <b>' + n + ' / ' + inv + '</b> consintieron' + (g.motivo ? ' · <span class="muted">' + e(g.motivo) + '</span>' : '') + '</p>' +
        '<div class="bar"><i style="width:' + (inv ? Math.min(100, Math.round(n / inv * 100)) : 0) + '%"></i></div>' +
        (g.estado === 'reclutando' ? '<div class="linkbox" style="margin-top:10px">' + e(invLink) + '</div><div class="actions"><button class="btn btn-ghost btn-sm" data-copy="' + e(invLink) + '">Copiar invitación</button>' +
          '<button class="btn btn-primary btn-sm" data-cerrar="' + e(g.grupo_id) + '" data-n="' + n + '" data-inv="' + inv + '" data-busy="Cerrando…">Cerrar reclutamiento</button></div>' : '') +
        (g.preferencias && g.preferencias.length ? '<details style="margin-top:10px"><summary class="small">Preferencias (' + g.preferencias.length + ')</summary><ul class="small">' + g.preferencias.map(function (p) { return '<li>' + e(p) + '</li>'; }).join('') + '</ul></details>' : '') +
        '<div style="margin-top:8px">' + (mm || '<p class="small muted">Sin miembros activos.</p>') + '</div>' +
        (g.experimento === 'E1' && g.estado === 'activo' && n ? '<div class="card soft small" style="margin:10px 0 0"><b>Crear el grupo del plan en WhatsApp.</b> Meta no deja crearlo automáticamente desde una cuenta sin verificar: créalo a mano desde el número Sintonía con estas ' + n + ' personas y envía <b>/ingreso</b> (pestaña 3).<div class="actions" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-copy="' + e(g.miembros.map(function (x) { return x.nombre + ' +' + S.phone(x.whatsapp); }).join('\n')) + '">Copiar nombres y números</button></div></div>' : '') +
        '</div>';
    }).join('') + '</div>';
    el.innerHTML = h;
    bindCopy(el);
    S.$$('[data-cerrar]', el).forEach(function (b) {
      b.onclick = function () {
        var n = Number(b.dataset.n), inv = Number(b.dataset.inv);
        var txt = n < inv ? 'Solo ' + n + ' de ' + inv + ' consintieron. Por la regla I9 el grupo quedará EXCLUIDO de las pruebas. ¿Cerrar igual?' : 'Consintieron ' + n + ' de ' + inv + '. El grupo pasa a ACTIVO. ¿Cerrar reclutamiento?';
        if (confirm(txt)) act(b, { action: 'cerrar_reclutamiento', grupo_id: b.dataset.cerrar }, function (r) { return 'Grupo ' + r.estado + ' (' + r.consentidos + '/' + r.invitados + ')'; });
      };
    });
    S.$$('[data-revocar]', el).forEach(function (b) {
      b.onclick = function () {
        if (!confirm('¿' + (b.dataset.nombre || 'Esta persona') + ' pidió retirarse? Se borran sus datos y el grupo queda EXCLUIDO (I9). No se puede deshacer.')) return;
        if (prompt('Escribe REVOCAR para confirmar') !== 'REVOCAR') return S.toast('Cancelado.');
        S.busy(b, function () { return S.post({ action: 'revocar', pid: b.dataset.revocar }); }).then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast('Datos suprimidos y grupo excluido.'); load(); });
      };
    });
  }
  function bindCopy(el) { S.$$('[data-copy]', el).forEach(function (b) { b.onclick = function () { S.copy(b.dataset.copy); }; }); }

  /* ---------- 2 · Curaduría de planes (humano en el loop) ---------- */
  function invOptions(val) { return '<option value="">—</option>' + (D.inventario || []).map(function (i) { return '<option value="' + e(i.id) + '"' + (i.id === val ? ' selected' : '') + '>' + e(i.id + ' · ' + i.nombre + ' (' + i.zona + ')') + '</option>'; }).join(''); }
  function invById(id) { return (D.inventario || []).filter(function (i) { return i.id === id; })[0]; }

  function renderPlanes() {
    var el = S.$('#tab-planes'), gs = gruposVista(), g = grupo(sel.grupo), p = plan(sel.plan);
    if (!gs.length) { el.innerHTML = '<div class="card empty"><p class="muted">No hay grupos de ' + e(EXP[vexp].nombre) + ' en este modo.</p></div>'; return; }
    var h = '<div class="card"><div class="row"><div class="field" style="margin:0"><label for="selG">Grupo</label><select id="selG">' + opts(gs.map(function (x) { return [x.grupo_id, grupoLabel(x) + ' · ' + x.estado]; }), sel.grupo) + '</select></div>' +
      '<div class="field" style="margin:0"><label for="selP">Plan</label><select id="selP">' + (planesDe(sel.grupo).length ? opts(planesDe(sel.grupo).map(function (x) { return [x.plan_id, rondaLabel(x) + ' · ' + x.estado]; }), sel.plan) : '<option value="">Sin planes</option>') + '</select></div></div>' +

    h += '<div class="card"><div class="row" style="align-items:flex-end;flex-wrap:wrap">' +
      '<div class="field" style="margin:0"><label for="dest">Para</label><select id="dest">' + opts([['grupo', 'Todo el grupo (pegar en el grupo del plan)']].concat(g ? g.miembros.map(function (m) { return [m.pid, m.nombre + ' (chat individual)']; }) : []), dest) + '</select></div>' +
      '<div class="field" style="margin:0"><label for="tono">Tono para Gemini</label><select id="tono">' + opts(['plan tranqui', 'parche animado', 'familiar y cálido'], S.LS.get('sintonia_mago_tono') || 'plan tranqui') + '</select></div>' +

        '<div class="actions" style="margin-top:6px">' +
        (d.persona ? '<a class="btn btn-primary btn-sm" data-abrir="' + i + '" target="_blank" rel="noopener" href="' + e(S.wa(d.persona.whatsapp, txt)) + '">Abrir chat con ' + e(d.persona.nombre) + '</a>' : '<button class="btn btn-primary btn-sm" data-tpl="' + i + '">Copiar</button>') +

  /* ---------- 4 · Eventos del chat y minutos humanos (I3) ----------
   * 2.0.5: el estado de cada persona se cambia con un menú (E1) o se lee de la página (E2); los mensajes del mago al grupo
   * quedan marcados como hechos con la hora. Los botones registran lo que ya pasó en el chat; no envían nada. */
  var ESTADOS = [['me_apunto', 'Se apuntó', 'apuntado'], ['no_puedo', 'No puede', 'nopuede'], ['checkpoint_llegada', 'Llegó', 'llego'], ['llego_casa', 'En casa', 'casa']];
  var MSG_GRUPO = [['recordatorio', 'Recordatorio de votación'], ['salida_sugerida', 'Hora de salida'], ['mensaje_mago', 'Otro mensaje']];
  function estadoPersona(st) {
    if (st.casa) return ['casa', 'En casa'];
    if (st.llego) return ['llego', 'Llegó'];
    if (st.apuntado === true) return ['apuntado', 'Se apuntó'];
    if (st.apuntado === false) return ['nopuede', 'No puede'];
    return ['sin', 'Sin respuesta'];
  }
  // Los mensajes al grupo se guardan en la hoja de eventos sin persona; la consola recuerda en este navegador cuándo se marcaron.
  function hechos(planId) { try { return JSON.parse(S.LS.get('sintonia_hechos_' + planId) || '{}'); } catch (x) { return {}; } }
  function marcarHecho(planId, tipo) { var h = hechos(planId); (h[tipo] = h[tipo] || []).push(new Date().toISOString()); S.LS.set('sintonia_hechos_' + planId, JSON.stringify(h)); }
  function hhmm(iso) { var d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function renderRegistro() {
    var el = S.$('#tab-registro'), p = plan(sel.plan), g = grupo(sel.grupo), e1 = vexp === 'E1';
    var h = '<div class="card"><div class="actions" style="margin:0 0 6px;justify-content:space-between;flex-wrap:wrap"><h3 style="margin:0">Estado de cada persona</h3>' + expChip(vexp) + '</div>' +
      '<p class="small muted" style="margin:0">' + (p ? e(rondaLabel(p)) + ' · ' + e(p.estado) + ' · ' + e(grupoLabel(g)) : 'Ningún plan seleccionado (elige uno en la pestaña 2).') + '</p>' +
      '<p class="small" style="margin:6px 0 0">' + (e1 ? 'En E1 tú registras lo que cada persona dijo en el grupo de WhatsApp. El menú <b>registra</b>; no le envía nada a nadie.' : 'En E2 cada persona marca su estado en su página; aquí solo se ve. No hace falta registrar nada.') + '</p>';
    if (p && g) {
      var est = p.estado_por_pid || {};
      h += '<div class="table-scroll" style="margin-top:10px"><table class="evtable"><thead><tr><th>Persona</th><th>Estado actual</th>' + (e1 ? '<th>Registrar</th>' : '') + '</tr></thead><tbody>' +
        g.miembros.map(function (m) {
          var es = estadoPersona(est[m.pid] || {});
          return '<tr><td><b>' + e(m.nombre) + '</b> <span class="tiny muted">' + e(m.rol) + '</span></td><td><span class="st ' + es[0] + '">' + es[1] + '</span></td>' +
            (e1 ? '<td><select class="estado-sel" data-estado="' + e(m.pid) + '" aria-label="Registrar estado de ' + e(m.nombre) + '"><option value="">Cambiar a…</option>' +
              ESTADOS.map(function (t) { return '<option value="' + t[0] + '"' + (t[2] === es[0] ? ' disabled' : '') + '>' + t[1] + (t[2] === es[0] ? ' (actual)' : '') + '</option>'; }).join('') + '</select></td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>';
      h += '<p class="tiny muted" style="margin-top:6px">Orden normal: <span class="st sin">sin respuesta</span> → <span class="st apuntado">se apuntó</span> → <span class="st llego">llegó</span> → <span class="st casa">en casa</span>. <span class="st nopuede">no puede</span> si avisa que no va.</p>';
    }
    h += '</div>';
    if (p && g && e1) {
      var hx = hechos(p.plan_id);
      h += '<div class="card"><h3>Mensajes del mago al grupo</h3><p class="small muted">Márcalo cuando ya lo enviaste. Queda en la hoja de eventos y aquí se ve la hora.</p><div class="msg-done">' +
        MSG_GRUPO.map(function (t) {
          var l = hx[t[0]] || [], ok = l.length > 0;
          return '<div class="msg-row' + (ok ? ' done' : '') + '"><span class="msg-name">' + (ok ? '✓ ' : '') + e(t[1]) + '</span><span class="tiny muted">' + (ok ? 'Hecho a las ' + hhmm(l[l.length - 1]) + (l.length > 1 ? ' · ' + l.length + ' veces' : '') : 'Pendiente') + '</span>' +
            '<button class="btn btn-sm ' + (ok ? 'btn-ghost' : 'btn-primary') + '" data-msg="' + t[0] + '" data-busy="Guardando…">' + (ok ? 'Marcar otra vez' : 'Marcar como enviado') + '</button></div>';
        }).join('') + '</div></div>';
    }
    h += '<div class="card"><h3>Minutos de trabajo humano</h3><p class="small muted">Cada bloque de trabajo con su causa. Es el costo humano del piloto (I3) y la línea base para decidir qué automatizar. En E2 también cuenta: curar opciones, cerrar el plan, avisar al organizador.</p>' +
      '<div class="row"><div class="field"><label for="minActor">Rol de quien trabajó</label><select id="minActor">' + opts([['mago', 'Mago (habla con el grupo)'], ['soporte', 'Soporte (planes e inventario)'], ['tecnico', 'Técnico (arreglar fallas)']]) + '</select></div><div class="field"><label for="minN">Minutos</label><input id="minN" type="number" inputmode="numeric" min="1" max="600"></div></div>' +

    el.innerHTML = h;
    S.$$('[data-estado]', el).forEach(function (s) {
      s.onchange = function () {

      b.onclick = function () {

          if (!r || !r.ok) return S.toast(S.errMsg(r), true);
          marcarHecho(sel.plan, b.dataset.msg); S.toast('Hecho: quedó registrado'); renderRegistro();
        });

    S.$('#minGuardar', el).onclick = function () {

    };
  }

  /* ---------- Cambios entre W1 y W2 (regla I4) ----------

      'Así, si W2 sale distinta a W1, sabemos qué la cambió. Al registrarlo, los grupos piloto de ese experimento pasan de v1 a v2 y el panel compara ambas versiones.</div><div class="grid two">';

          (c.length > 1 ? '<p class="small" style="margin:8px 0 0;color:var(--danger)">Hay ' + c.length + ' cambios en este experimento: el protocolo permite uno. Explícalo en el informe.</p>' : '') :
          '<div class="field"><label for="cDesc' + k + '">Qué cambia y por qué</label><textarea id="cDesc' + k + '" maxlength="600" placeholder="' + e(EJEMPLO_CAMBIO[k]) + '"></textarea></div>' +
          '<div class="row"><div class="field"><label for="cVer' + k + '">Versión nueva</label><input id="cVer' + k + '" type="text" maxlength="10" value="v2"></div><div class="field"><label for="cPor' + k + '">Registrado por</label><input id="cPor' + k + '" type="text" maxlength="40"></div></div>' +

      };
    });

  function renderInventario() {
    var inv = D.inventario || [], pend = D.inventario_pendiente || [];
    S.$('#tab-inventario').innerHTML = '<div class="card"><h3>Inventario activo (' + inv.length + ')</h3><p class="small muted">Solo estos lugares pueden aparecer en un plan. Antes de cada fin de semana, confirma horarios y cierres.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Zona</th><th>Costo</th><th>Horario</th><th>Verificado</th></tr></thead><tbody>' +
      inv.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.categoria) + '</span></td><td>' + e(i.zona) + '</td><td>' + e(i.costo_aprox) + '</td><td>' + e(i.horario) + '</td><td class="tiny">' + e(String(i.verificado_el).slice(0, 10)) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><h3>Ronda de llamadas · por confirmar (' + pend.length + ')</h3><p class="small muted">Antes de cada fin de semana: llama, confirma que abrió tras el sismo, horario y costo, y cambia <b>estado</b> a <b>activo</b> en la hoja "inventario" (con la fecha en verificado_el). Los teléfonos marcados "sin verificar" vienen de la lista de Gemini.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Teléfono</th><th>Qué confirmar</th></tr></thead><tbody>' +
      pend.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.zona) + '</span></td><td class="small">' + e(i.telefono_para_llamar || '—') + '</td><td class="tiny">Horario: ' + e(i.horario) + '<br>Costo: ' + e(i.costo_aprox) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }

  load();
})();
</script>
