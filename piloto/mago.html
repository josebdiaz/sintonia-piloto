<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sintonía · Consola del mago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/sintonia.css">
<link rel="stylesheet" href="assets/ds3.css">
</head>
<body>
<main class="wrap wide">
  <header class="top">
    <a class="brand" href="mago.html"><span class="brand-mark" aria-hidden="true"></span>Consola del mago <span class="tag">E1 · E1.5</span></a>
    <div class="actions" style="margin:0">
      <a class="btn btn-ghost btn-sm" href="investigadores.html" title="Todas las vistas, por fase">Mapa</a>
      <a class="btn btn-ghost btn-sm" href="panel.html">Panel →</a>
      <button class="btn btn-ghost btn-sm" id="recargar" type="button">↻ Recargar</button>
      <button class="btn btn-ghost btn-sm" id="cfg" type="button" title="URL del backend">⚙ Backend</button>
      <button class="btn btn-ghost btn-sm" id="salir" type="button">Salir</button>
    </div>
  </header>

  <section id="gate" class="hidden">
    <form class="card" id="gateForm" style="max-width:420px">
      <h2>Entrar a la consola</h2>
      <p class="small muted">Solo el equipo. La clave se guarda en esta pestaña y se borra al cerrarla.</p>
      <div class="field"><label for="key">ADMIN_KEY</label><input id="key" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="entrar" data-busy="Verificando…">Entrar</button>
    </form>
  </section>

  <div class="mago-tira" id="magoTira" hidden role="status"></div>
  <section id="consola" class="hidden">
    <p class="small muted" id="resumen"></p>
    <div class="consola-top"><div id="expbar"></div><div id="modobox"></div><div id="magobar"></div></div>
    <div class="consola-mid"><div id="glist"></div><div id="siguiente"></div></div>
    <nav class="s-tabs" role="tablist" aria-label="Operación">
      <button role="tab" data-tab="grupos" aria-selected="true">Grupo</button>
      <button role="tab" data-tab="planes">Plan</button>
      <button role="tab" data-tab="mensajes">Mensajes</button>
      <button role="tab" data-tab="registro">Llegadas y tiempo</button>
      <details class="ajustes"><summary>Ajustes ▾</summary><div class="menu">
        <button role="tab" data-tab="inventario">Inventario</button>
        <button role="tab" data-tab="cambios">Cambios entre planes (I4)</button>
        <button role="tab" data-tab="reinicio">⟲ Empezar piloto real</button>
      </div></details>
    </nav>
    <div id="tab-grupos" class="tab"></div>
    <div id="tab-planes" class="tab hidden"></div>
    <div id="tab-mensajes" class="tab hidden"></div>
    <div id="tab-registro" class="tab hidden"></div>
    <div id="tab-cambios" class="tab hidden"></div>
    <div id="tab-inventario" class="tab hidden"></div>
    <div id="tab-reinicio" class="tab hidden"></div>
  </section>
</main>
<dialog class="hoja" id="hoja" aria-label="Confirmar"></dialog>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var D = null, key = '', sel = { grupo: '', plan: '' }, borrador = [], filtro = 'piloto';
  var CAUSAS = [['coordinacion', 'Coordinar el plan'], ['redactar_mensaje', 'Redactar mensajes'], ['resolver_duda', 'Resolver una duda'], ['cambio_plan', 'Cambio de plan'], ['recordatorio', 'Recordatorios y checkpoints'], ['falla_tecnica', 'Falla técnica'], ['seguridad', 'Seguridad'], ['otro', 'Otro']];
  var ultimaCarga = null, hashUsado = false;   // 2.0.6: mago.html#reinicio (o #planes, #cambios…) abre esa pestaña
  var CAIDA = [['trafico', 'Tráfico'], ['lluvia', 'Lluvia'], ['agenda', 'Agenda / no cuadró'], ['costo', 'Costo'], ['desinteres', 'Desinterés'], ['imprevisto', 'Imprevisto'], ['otro', 'Otro']];
  var e = S.esc;

  /* ---------- Acceso ---------- */
  function gate(on) { S.show('#gate', on); S.show('#consola', !on); }
  S.$('#gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); S.SS.set('sintonia_admin_key', S.$('#key').value.trim()); S.busy(S.$('#entrar'), load); });
  S.$('#salir').onclick = function () { S.forgetKey(); location.reload(); };
  S.$('#cfg').onclick = S.configBackend;
  S.$('#recargar').onclick = function () { S.busy(this, load); };

  function load() {
    key = S.adminKey(false);
    if (!key) { gate(true); return Promise.resolve(); }
    return S.get({ view: 'mago', key: key }).then(function (r) {
      if (!r || !r.ok) { if (r && r.error === 'no_autorizado') { S.forgetKey(); gate(true); } S.toast(S.errMsg(r), true); return; }
      D = r; ultimaCarga = new Date(); gate(false); renderAll();
    });
  }
  // 2.0.4 (QA 5/10): las inscripciones nuevas aparecen solas. Recarga cada 60 s solo en la pestaña 1, con la consola visible y sin un campo en edición.
  setInterval(function () {
    if (!D || document.hidden || S.$('#tab-grupos').classList.contains('hidden')) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    load();
  }, 60000);
  function act(btn, payload, okMsg) {
    return S.busy(btn, function () { return S.post(Object.assign({ key: key }, payload)); }).then(function (r) {
      if (!r || !r.ok) { S.toast(S.errMsg(r), true); return r; }
      if (okMsg) S.toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      return load().then(function () { return r; });
    });
  }

  /* ---------- Ayudas ---------- */
  function grupo(id) { return (D.grupos || []).filter(function (g) { return g.grupo_id === id; })[0]; }
  function plan(id) { return (D.planes || []).filter(function (p) { return p.plan_id === id; })[0]; }
  function planesDe(gid) { return (D.planes || []).filter(function (p) { return p.grupo_id === gid; }); }
  function nombre(gid, pid) { var g = grupo(gid); var m = g && g.miembros.filter(function (x) { return x.pid === pid; })[0]; return m ? m.nombre || pid : pid; }
  function badge(t) { return '<span class="badge ' + e(t) + '">' + e(t) + '</span>'; }
  function opts(list, val) { return list.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + e(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + e(o[1]) + '</option>'; }).join(''); }
  function grupoLabel(g) { return g.tipo_grupo + ' · ' + g.experimento + ' · ' + g.grupo_id.slice(-6) + (g.modo === 'prueba' ? ' (prueba)' : ''); }
  function linkPlan(pid) { return S.link('plan.html', { pid: pid }); }
  function linkRetro(pid, planId) { return S.link('retro.html', { pid: pid, plan_id: planId }); }
  // texto único (E1 y E1.5) para pedir la usabilidad a quien respondió el pulso sin esa parte
  function txtUsab(nom, l) { return (nom ? nom + ', g' : 'G') + 'racias por contarnos cómo les fue 🙌 Nos faltó una parte: 2 minutos sobre qué tan fácil fue usar Sintonía en esa salida. Es voluntario y tus respuestas son privadas: ' + l; }
  function organizador(g) { return (g.miembros || []).filter(function (m) { return m.rol === 'organizador'; })[0]; }
  /** 2.0.4 (QA 5/10): "Abrir chat" deja escrito el primer mensaje según el estado del grupo y el rol de la persona. */
  function primerMensaje(g, m) {
    var org = organizador(g), n = g.miembros.length, inv = Number(g.n_invitados) || n, esOrg = m.rol === 'organizador';
    var hola = 'Hola ' + (m.nombre || '') + ' 👋 Soy Sintonía, el quinto amigo que ayuda a que el plan sí se dé.';
    if (g.estado === 'reclutando') return esOrg
      ? hola + ' Ya aceptaron ' + n + ' de ' + inv + ' personas de tu parche. Cuando estén todas, armo el grupo del plan por aquí. Si alguien no ha visto la invitación, este es el enlace: ' + S.link('unirse.html', { inv: g.codigo_invitacion })
      : hola + ' Ya quedaste en el parche de ' + (org ? org.nombre : 'tu grupo') + '. Cuando acepten todos, te escribimos para armar el plan.';
    return esOrg
      ? hola + ' ¡Ya aceptaron las ' + n + ' personas de tu parche! En unos minutos creo el grupo del plan por aquí con todos. En este piloto una persona del equipo revisa lo que propongo.'
      : hola + ' Ya aceptaron todos en el parche de ' + (org ? org.nombre : 'tu grupo') + '. En unos minutos te agrego al grupo del plan por aquí. Si prefieres no seguir, responde SALIR.';
  }
  function localDT(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return ''; var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  /* ---------- 2.1.0 · Experimento en operación (Sync P7c) ----------
   * Dos condiciones en paralelo, las dos en WhatsApp: E1 (mago) y E1.5 (automatizado con n8n). E1.5 usa el valor interno 'E2'.
   * Cada grupo hace 2 planes en su condición. Todo lo que se ve se filtra por la condición elegida arriba. */
  var EXP = {
    E1: { nombre: 'E1 · WhatsApp + mago', corto: 'WhatsApp + mago', clase: 'e1',
      prueba: 'Si coordinar dentro de un grupo de WhatsApp, con una persona detrás del número Sintonía, mueve más gente del «me apunto» a llegar.',
      grupo: 'Vota, confirma y avisa que llegó escribiendo en el grupo de WhatsApp del plan.',
      mago: 'Abre «Mago in» al empezar, crea el grupo de WhatsApp, envía cada mensaje y registra aquí votos, confirmaciones y llegadas. «Mago off» al terminar: los minutos se calculan solos.',
      mide: 'SEQ por momento y SUS (pulso), llegaron / invitadas, minutos humanos por plan (mago in/off) y si repetirían con el grupo (Nivel 2).',
      pasos: [['grupos', 'Mago in. Cuando acepten todos: cerrar reclutamiento, abrir el chat y crear el grupo de WhatsApp'], ['mensajes', 'Enviar /ingreso'], ['planes', 'Crear el plan 1, pedir opciones a Gemini y publicar'], ['mensajes', 'Enviar /opciones'], ['planes', 'Registrar votos y cerrar con día y hora'], ['mensajes', 'Enviar /confirmado, la hora de salida y el checkpoint'], ['registro', 'Registrar quién se apuntó, quién llegó y quién está en casa'], ['planes', 'Enviar el pulso y crear el plan 2 en el mismo grupo. Mago off']] },
    E2: { nombre: 'E1.5 · WhatsApp automatizado', corto: 'WhatsApp automatizado', clase: 'e2',
      prueba: 'Si el mismo recorrido en WhatsApp, operado por un sistema automatizado (n8n) con revisión humana, logra lo mismo con menos trabajo humano.',
      grupo: 'Lo mismo que en E1: vota, confirma y avisa que llegó en el grupo de WhatsApp del plan.',
      mago: 'El motor envía los mensajes y registra votos y llegadas. La persona del equipo abre «Mago in» mientras revisa lo que manda el motor, y registra a mano aquí solo si el motor falla.',
      mide: 'Lo mismo que E1. La diferencia que importa: minutos humanos por plan frente a E1.',
      pasos: [['grupos', 'Mago in. Cuando acepten todos: cerrar reclutamiento y crear el grupo de WhatsApp'], ['planes', 'Crear el plan 1 (el motor pide las opciones y las publica)'], ['planes', 'Revisar que los votos lleguen; si el motor falla, registrarlos a mano'], ['planes', 'Revisar el cierre con día y hora'], ['registro', 'Revisar quién se apuntó y quién llegó'], ['planes', 'Revisar el pulso y crear el plan 2 en el mismo grupo. Mago off']] }
  };
  var vexp = S.LS.get('sintonia_mago_exp') === 'E2' ? 'E2' : 'E1';
  function expChip(k) { return '<span class="xp ' + EXP[k].clase + '">' + e(EXP[k].nombre) + '</span>'; }
  function rondaLabel(p) { return 'Plan ' + p.ronda + (Number(p.ronda) > 2 ? ' (extra)' : ''); }
  function gruposVista() { return (D.grupos || []).filter(function (g) { return g.experimento === vexp && (filtro === 'todos' || g.modo === filtro); }); }
  function linkInscripcion() { return S.link('index.html', filtro === 'prueba' ? { exp: vexp, modo: 'prueba' } : { exp: vexp }); }
  function irA(tab, q) {   // 2.2.0: abre la pestaña y, si se indica, lleva al elemento y lo resalta
    var b = S.$('[data-tab="' + tab + '"]'); if (b) b.click();
    if (!q) return;
    setTimeout(function () { var t = S.$('#tab-' + tab + ' ' + q) || S.$(q); if (!t) return; t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.remove('resalta'); void t.offsetWidth; t.classList.add('resalta'); }, 60);
  }
  /* ---------- 2.2.0 · Barra superior con componentes DS 3.0 ----------
   * Selector de banda (E1 / E1.5) · Interruptor de palanca (modo prueba) · Presione para hablar + Display de señal (mago in / mago off). */
  function renderExpbar() {
    var el = S.$('#expbar');
    el.innerHTML = '<div class="s-band" role="radiogroup" aria-label="Condición que estás operando">' +
      ['E1', 'E2'].map(function (k) { return '<button type="button" role="radio" aria-checked="' + (k === vexp) + '" data-exp="' + k + '"><b>' + (k === 'E1' ? 'E1' : 'E1.5') + '</b><small>' + e(EXP[k].corto) + '</small></button>'; }).join('') + '</div>';
    var on = filtro === 'prueba';
    S.$('#modobox').innerHTML = '<button type="button" class="modo-ctl" role="switch" id="modoPrueba" aria-checked="' + on + '" aria-label="Modo prueba"><span class="modo-txt"><b>Modo prueba</b><small>' + (on ? 'Activo: lo que hagas no cuenta en el panel' : 'Operando el piloto real') + '</small></span>' +
      '<span class="modo-sw" aria-hidden="true"><i></i></span><span class="modo-val">' + (on ? 'SÍ' : 'NO') + '</span></button>';
    S.$$('[data-exp]', el).forEach(function (b) { b.onclick = function () { vexp = b.dataset.exp; S.LS.set('sintonia_mago_exp', vexp); sel.grupo = ''; sel.plan = ''; borrador = []; dest = 'grupo'; renderAll(); }; });
    S.$('#modoPrueba').onclick = function () { filtro = filtro === 'prueba' ? 'piloto' : 'prueba'; sel.grupo = ''; sel.plan = ''; renderAll(); };
  }
  function linkInscripcionHtml() {
    return '<details class="small" style="margin-top:10px"><summary><b>Inscribir un grupo nuevo en ' + e(EXP[vexp].corto) + (filtro === 'prueba' ? ' (modo prueba)' : '') + '</b></summary><div class="s-invite" style="margin-top:8px"><code>' + e(linkInscripcion()) + '</code><div class="actions" style="margin:0"><button class="btn btn-ghost btn-sm" type="button" id="copiarInsc">Copiar enlace</button></div></div></details>';
  }

  /* ---------- 2.2.0 · Lista de grupos (Lista + Fila de sintonía + Luz piloto) ---------- */
  function senal(g, p) {   // estado del grupo en el lenguaje de la Luz piloto
    if (g.estado === 'excluido') return ['off', 'Desestimado'];
    if (g.estado === 'reclutando') return ['searching', 'Reclutando'];
    if (!p) return ['live', 'Sin plan'];
    if (p.estado === 'votando') return ['live', 'Votación'];
    if (p.estado === 'cerrado') return ['fixed', 'Fijado'];
    if (p.estado === 'caido') return ['off', 'Caído'];
    return ['searching', 'Preparando'];
  }
  function renderGlist() {
    var el = S.$('#glist'), gs = gruposVista();
    var h = (filtro === 'prueba' ? '<div class="s-banner" data-type="progress" style="margin-bottom:10px"><span><strong>Modo prueba activo</strong>Estás viendo y creando grupos de prueba: no cuentan en el panel.</span></div>' : '') +
      '<p class="s-eyebrow" style="margin:0 0 8px">Grupos · ' + e(EXP[vexp].corto) + (filtro === 'prueba' ? ' · prueba' : '') + '</p>';
    if (!gs.length) h += '<div class="s-empty"><strong>Todavía no hay grupos aquí</strong><p class="small muted" style="margin:0">Comparte el enlace de inscripción con un organizador.</p></div>';
    else h += '<div class="s-list">' + gs.map(function (g) {
      var ps = planesDe(g.grupo_id), p = ps[ps.length - 1], s = senal(g, p), n = g.miembros.length, inv = Number(g.n_invitados) || 0;
      return '<button type="button" class="s-tuning-row" data-state="' + s[0] + '" data-g="' + e(g.grupo_id) + '"' + (g.grupo_id === sel.grupo ? ' aria-current="true"' : '') + '><span><strong>' + e(g.tipo_grupo) + ' · ' + e(g.grupo_id.slice(-6)) + '</strong><small>' + e(pendienteDe(g)) + '</small></span><span class="s-pilot" data-state="' + s[0] + '">' + e(s[1]) + '</span><span class="chev" aria-hidden="true">›</span></button>';
    }).join('') + '</div>';
    el.innerHTML = h + linkInscripcionHtml();
    S.$$('[data-g]', el).forEach(function (b) { b.onclick = function () { sel.grupo = b.dataset.g; var ps = planesDe(sel.grupo); sel.plan = ps.length ? ps[ps.length - 1].plan_id : ''; borrador = []; renderAll(); moverSesion(); }; });
    S.$('#copiarInsc', el).onclick = function () { S.copy(linkInscripcion()); };
  }

  /* ---------- 2.2.0 · Lo que toca ahora (Próxima sintonía) + recorrido (Lista del plan) ----------
   * Se calcula con el estado del grupo y de sus planes. Cada paso dice dónde se hace y un botón lleva ahí. */
  function pasosDe(g) {
    var e15 = g.experimento === 'E2', ps = planesDe(g.grupo_id), n = g.miembros.length, inv = Number(g.n_invitados) || 0, ahora = Date.now();
    var L = [];
    function add(grupoPaso, txt, hecho, accion) { L.push({ grupo: grupoPaso, txt: txt, hecho: !!hecho, accion: accion }); }
    function env(p, tipo) { return !!(p && p.mensajes && (p.mensajes[tipo] || []).length); }
    add('Grupo', g.estado === 'reclutando' && n < inv ? 'Esperar que acepten todos (' + n + ' de ' + inv + ')' : 'Cerrar el reclutamiento', g.estado !== 'reclutando',
      g.estado === 'reclutando' && n < inv ? { t: 'Ver la invitación', tab: 'grupos', q: '[data-cerrar]', ayuda: 'Si a las 24 h falta alguien, «Abrir chat con mensaje» le escribe al organizador.' } : { t: 'Ir a cerrar el reclutamiento', tab: 'grupos', q: '[data-cerrar]', ayuda: 'Aceptaron todos: cierra el reclutamiento para activar el grupo.' });
    // 2.2.2 (QA N1): crear el grupo de WhatsApp, /ingreso y el plan 1 son un solo paso; se completa al crear el plan 1
    var p1 = ps.filter(function (x) { return Number(x.ronda) === 1; }).pop();
    add('Grupo', e15 ? 'Crear el grupo de WhatsApp y el plan 1' : 'Crear el grupo de WhatsApp, enviar /ingreso y crear el plan 1', !!p1,
      { t: 'Ver nombres y números', tab: 'grupos', q: '#crearGrupoWA', t2: 'Crear el plan 1', tab2: 'planes', q2: '#crearPlan', ayuda: 'Meta no deja crearlo automático: créalo a mano desde el número Sintonía' + (e15 ? '; el motor envía /ingreso.' : ' y envía /ingreso (pestaña Mensajes).') + ' Luego crea el plan 1.' });
    [1, 2].forEach(function (r) {
      var p = ps.filter(function (x) { return Number(x.ronda) === r; }).pop(), caido = p && p.estado === 'caido', cerr = p && (p.estado === 'cerrado' || caido);
      var he = p && p.hora_encuentro ? new Date(p.hora_encuentro).getTime() : null, paso = he && ahora > he;
      var faltanV = p ? g.miembros.filter(function (m) { return (p.votos_por_pid || {})[m.pid] === undefined; }).length : 0;
      var est = (p && p.estado_por_pid) || {}, llegaron = g.miembros.filter(function (m) { return (est[m.pid] || {}).llego; }).length;
      var faltanP = p ? g.miembros.filter(function (m) { return (p.retro_pids || []).indexOf(m.pid) < 0; }).length : n;
      var G = 'Plan ' + r;
      if (r === 2) add(G, 'Crear el plan 2 en el mismo grupo', !!p, { t: 'Ir a crear el plan 2', tab: 'planes', q: '#siguienteRonda', ayuda: 'Con el plan 1 cerrado y el pulso enviado, en el mismo grupo de WhatsApp.' });
      add(G, e15 ? 'El motor propone y publica las opciones' : 'Pedir opciones a Gemini, revisar y publicar', p && p.estado !== 'borrador' && p.estado !== 'en_revision', { t: 'Ir a las opciones', tab: 'planes', q: '#pedirIA', ayuda: 'Solo lugares del inventario activo; una persona revisa antes de publicar.' });
      // 2.2.2 (QA N2): /opciones se marca como enviado; hasta entonces es el paso actual
      if (!e15) add(G, 'Enviar /opciones al grupo', cerr || env(p, 'msg_opciones'), { t: 'Ir a /opciones', tab: 'mensajes', q: '[data-marca="msg_opciones"]', ayuda: 'Cópialo en el grupo de WhatsApp y márcalo como enviado.' });
      add(G, (e15 ? 'Revisar votos' : 'Registrar votos') + (p && p.estado === 'votando' ? (faltanV ? ' (faltan ' + faltanV + ')' : ' (ya votaron todos)') : '') + ' y cerrar con día y hora', cerr,
        { t: faltanV ? (e15 ? 'Ver los votos' : 'Registrar votos') : 'Cerrar el plan', tab: 'planes', q: faltanV ? '[data-votopid]' : '#cerrarPlan', ayuda: faltanV ? (e15 ? 'Si el motor falla, regístralos a mano.' : 'Registra aquí lo que cada persona votó en el chat.') : 'Pon el día y la hora del encuentro y la salida sugerida.' });
      if (!e15 && !caido) add(G, 'Enviar /confirmado al grupo', env(p, 'msg_confirmado') || (paso && llegaron > 0), { t: 'Ir a /confirmado', tab: 'mensajes', q: '[data-marca="msg_confirmado"]', ayuda: 'Lugar, hora, salida y presupuesto. Márcalo como enviado; 2 h antes envía /salida.' });
      add(G, caido ? 'Plan caído (' + (p.causa_caida || 'sin causa') + ')' : 'Registrar llegadas y «en casa» (' + llegaron + ' de ' + n + ')', caido || (paso && (llegaron >= n || ahora > he + 8 * 36e5)),

        S.busy(b, function () { return S.post({ action: 'evento', key: key, plan_id: sel.plan, grupo_id: sel.grupo, pid: '', tipo: b.dataset.msg, canal: (g || {}).experimento || vexp }); }).then(function (r) {
          if (!r || !r.ok) return S.toast(S.errMsg(r), true);
          marcarHecho(sel.plan, b.dataset.msg); S.toast('Hecho: quedó registrado'); renderRegistro();
        });
      };
    });
    S.$('#minGuardar', el).onclick = function () {
      var n = parseInt(S.$('#minN', el).value, 10); if (!(n > 0)) return S.toast('Escribe los minutos.', true);
      var rv = (D.sesiones_por_revisar || []).filter(function (x) { return x.plan_id === sel.plan; })[0] || (D.sesiones_por_revisar || [])[0];   // 2.2.2: completa una sesión que se cerró sola
      act(this, { action: 'operacion', plan_id: sel.plan, grupo_id: sel.grupo, experimento: (g || {}).experimento || vexp, actor: S.$('#minActor', el).value, minutos: n, causa: rv ? 'sesion' : S.$('#minCausa', el).value, nota: S.$('#minNota', el).value || (rv ? rv.sesion_id + ' (cierre automático)' : ''), sesion_id: rv ? rv.sesion_id : '' }, n + ' min registrados');
    };
  }

  /* ---------- Cambios entre plan 1 y plan 2 (regla I4) ----------
   * 2.0.5: una tarjeta por experimento, con su estado y un ejemplo, en lugar de un formulario con la condición en un menú. */
  var EJEMPLO_CAMBIO = {
    E1: 'Ej.: enviar la hora de salida según el tráfico 2 h antes del encuentro, porque en el plan 1 dos personas llegaron tarde.',
    E2: 'Ej.: que el motor mande un solo recordatorio de voto, porque en el plan 1 hubo que escribir a mano.'
  };
  function renderCambios() {
    var el = S.$('#tab-cambios'), cs = D.cambios || [];
    var h = '<div class="card soft small"><b>Qué es esto.</b> Entre el plan 1 y el plan 2 se permite <b>un solo cambio por condición</b>, y solo si el equipo lo decide al revisar el panel. No es obligatorio. ' +
      'Así, si el plan 2 sale distinto, sabemos qué lo cambió. Al registrarlo, los grupos piloto de esa condición pasan de v1 a v2. La medición (SEQ y SUS) no cuenta como cambio.</div><div class="grid two">';
    h += ['E1', 'E2'].map(function (k) {
      var c = cs.filter(function (x) { return x.experimento === k; }), ya = c.length > 0, u = c[c.length - 1];
      return '<div class="card cambio ' + EXP[k].clase + (k === vexp ? ' actual' : '') + '"><div class="actions" style="margin:0 0 8px;justify-content:space-between;flex-wrap:wrap">' + expChip(k) +
        '<span class="st ' + (ya ? 'llego' : 'sin') + '">' + (ya ? 'Cambio registrado' : 'Sin cambio todavía') + '</span></div>' +
        (ya ? '<p class="small" style="margin:0 0 6px"><b>' + e(u.version) + '</b> · ' + e(String(u.ts || '').slice(0, 10)) + '</p><p class="small" style="margin:0">' + e(u.descripcion) + '</p>' +
          (c.length > 1 ? '<p class="small" style="margin:8px 0 0;color:var(--danger)">Hay ' + c.length + ' cambios en este experimento: el protocolo permite uno. Explícalo en el informe.</p>' : '') :
          '<div class="field"><label for="cDesc' + k + '">Qué cambia y por qué</label><textarea id="cDesc' + k + '" maxlength="600" placeholder="' + e(EJEMPLO_CAMBIO[k]) + '"></textarea></div>' +
          '<div class="row"><div class="field"><label for="cVer' + k + '">Versión nueva</label><input id="cVer' + k + '" type="text" maxlength="10" value="v2"></div><div class="field"><label for="cPor' + k + '">Registrado por</label><input id="cPor' + k + '" type="text" maxlength="40"></div></div>' +
          '<div class="actions"><button class="btn btn-primary btn-sm" data-cambio="' + k + '" data-busy="Guardando…">Registrar el cambio de ' + EXP[k].corto + '</button></div>') + '</div>';
    }).join('') + '</div>';
    el.innerHTML = h;
    S.$$('[data-cambio]', el).forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.cambio, ver = S.$('#cVer' + k, el).value.trim(), d = S.$('#cDesc' + k, el).value.trim();
        if (!ver || !d) return S.toast('Escribe qué cambia y la versión.', true);
        S.dosPasos(b, '¿Registrar el único cambio permitido para ' + EXP[k].nombre + '? Los grupos piloto de ' + EXP[k].corto + ' pasan a ' + ver + '.', function () {
          act(b, { action: 'registrar_cambio', experimento: k, version: ver, descripcion: d, por: S.$('#cPor' + k, el).value }, function (r) { return r.alerta || 'Cambio registrado'; });
        });
      };
    });
  }

  function renderInventario() {
    var inv = D.inventario || [], pend = D.inventario_pendiente || [];
    S.$('#tab-inventario').innerHTML = '<div class="card"><h3>Inventario activo (' + inv.length + ')</h3><p class="small muted">Solo estos lugares pueden aparecer en un plan. Antes de cada fin de semana, confirma horarios y cierres.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Zona</th><th>Costo</th><th>Horario</th><th>Verificado</th></tr></thead><tbody>' +
      inv.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.categoria) + '</span></td><td>' + e(i.zona) + '</td><td>' + e(i.costo_aprox) + '</td><td>' + e(i.horario) + '</td><td class="tiny">' + e(String(i.verificado_el).slice(0, 10)) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><h3>Ronda de llamadas · por confirmar (' + pend.length + ')</h3><p class="small muted">Antes de cada fin de semana: llama, confirma que abrió tras el sismo, horario y costo, y cambia <b>estado</b> a <b>activo</b> en la hoja "inventario" (con la fecha en verificado_el). Los teléfonos marcados "sin verificar" vienen de la lista de Gemini.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Teléfono</th><th>Qué confirmar</th></tr></thead><tbody>' +
      pend.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.zona) + '</span></td><td class="small">' + e(i.telefono_para_llamar || '—') + '</td><td class="tiny">Horario: ' + e(i.horario) + '<br>Costo: ' + e(i.costo_aprox) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }

  /* ---------- 2.0.6 · Empezar el piloto real (backend 2.2.4: limpiar_registros) ----------
   * Borra los registros de los ensayos en la hoja. Conserva tokens, inventario y bitácora. Antes, el backend hace un respaldo sin contactos. */
  var HOJAS = { participantes: 'Personas inscritas', contactos: 'Nombres y WhatsApp', grupos: 'Grupos', linea_base_grupo: 'Línea base por grupo', linea_base: 'Línea base por persona',
    preferencias: 'Preferencias', planes: 'Planes', votos: 'Votos', eventos: 'Eventos', operacion: 'Minutos del mago', cambios: 'Cambios entre planes', sesiones: 'Sesiones del mago (in / off)', retro: 'Pulsos (retro)', wtp: 'Disposición a pagar', usabilidad: 'Usabilidad (SEQ + SUS)',
    alertas: 'Alertas (archivo)', revisiones: 'Revisiones (archivo)', suscripciones: 'Suscripciones a avisos', avisos: 'Avisos programados',
    tokens: 'Tokens de IA (costo)', inventario: 'Inventario de lugares', bitacora: 'Bitácora de reinicios' };
  var FRASE = 'EMPEZAR PILOTO', ultimoReinicio = null;
  function renderReinicio() {
    var el = S.$('#tab-reinicio'), reg = D.registros, cons = D.conservar_al_limpiar || ['tokens', 'inventario', 'bitacora'];
    if (!reg) { el.innerHTML = '<div class="card warn"><h3>Falta actualizar el backend</h3><p class="small">El backend en vivo todavía no tiene el reinicio. Pega <b>backend/Codigo_Piloto.gs</b> (2.2.4) en Apps Script → Implementar → Administrar implementaciones → editar → <b>Nueva versión</b>. La URL /exec no cambia.</p></div>'; return; }
    var conservarCambios = !!(S.$('#rc-cambios') && S.$('#rc-cambios').checked);
    var borrar = Object.keys(reg).filter(function (n) { return cons.indexOf(n) < 0 && !(conservarCambios && n === 'cambios'); });
    var total = borrar.reduce(function (s, n) { return s + (reg[n] || 0); }, 0);
    var pruebas = (D.grupos || []).filter(function (g) { return g.modo === 'prueba'; }).length, piloto = (D.grupos || []).filter(function (g) { return g.modo === 'piloto'; }).length;
    var fila = function (n) { return '<tr><td>' + e(HOJAS[n] || n) + '<br><span class="tiny muted">' + e(n) + '</span></td><td style="text-align:right">' + S.num(reg[n] || 0) + '</td></tr>'; };
    var h = '';
    if (ultimoReinicio) h += '<div class="card soft"><h3>✓ Listo: la hoja quedó en blanco</h3><p class="small">Se borraron ' + S.num(ultimoReinicio.total) + ' registros. ' +
      (ultimoReinicio.respaldo ? 'Respaldo (sin contactos) en tu Drive: <a href="' + e(ultimoReinicio.respaldo) + '" target="_blank" rel="noopener">abrir la hoja de respaldo ↗</a>.' : 'No había nada que respaldar.') +
      ' La consola quedó en modo <b>Piloto (cuenta)</b>. Ya pueden compartir los enlaces de inscripción reales.</p></div>';
    h += '<div class="card danger"><h3>Empezar el piloto real</h3>' +
      '<p class="small">Borra todo lo que dejaron los ensayos para que la semana de pruebas arranque en cero: grupos, personas, votos, eventos, minutos y pulsos. <b>Se conservan los tokens</b> (el costo de IA acumulado), el inventario y la bitácora. Antes de borrar, el backend copia las pestañas a una hoja de respaldo nueva en el Drive del dueño del script, <b>sin la pestaña de contactos</b>.</p>' +
      '<p class="small" style="margin:6px 0 0">Hoy hay <b>' + pruebas + '</b> grupo(s) en modo prueba y <b>' + piloto + '</b> en modo piloto. ' + (piloto ? '<b>Ojo:</b> los grupos en modo piloto también se borran.' : '') + '</p></div>' +
      '<div class="grid two"><div class="card"><h3>Se borra (' + S.num(total) + ' registros)</h3><div class="table-scroll"><table><thead><tr><th>Pestaña</th><th style="text-align:right">Filas</th></tr></thead><tbody>' + borrar.map(fila).join('') + '</tbody></table></div></div>' +
      '<div class="card soft"><h3>Se conserva</h3><div class="table-scroll"><table><thead><tr><th>Pestaña</th><th style="text-align:right">Filas</th></tr></thead><tbody>' + cons.concat(conservarCambios ? ['cambios'] : []).filter(function (n) { return n in reg; }).map(fila).join('') + '</tbody></table></div>' +
      '<label class="small" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="rc-cambios"' + (conservarCambios ? ' checked' : '') + '> <span>Conservar también <b>Cambios entre planes</b> (solo si ya registraron un cambio que vale para el piloto real).</span></label></div></div>' +
      '<div class="card"><h3>Antes de borrar</h3><ol class="pasos small"><li>El ensayo terminó y nadie está votando ni respondiendo un pulso.</li><li>El equipo sabe que se reinicia (los enlaces personales de los ensayos dejan de funcionar).</li><li>Si alguien quiere revisar algo del ensayo, que lo haga ahora o en el respaldo.</li></ol>' +
      '<div class="field" style="max-width:420px"><label for="rc-frase">Para confirmar, escribe <b>' + FRASE + '</b></label><input id="rc-frase" autocomplete="off" spellcheck="false" placeholder="' + FRASE + '"></div>' +
      '<div class="actions"><button class="btn btn-danger" type="button" id="rc-go" disabled data-busy="Respaldando y borrando…">Borrar los ensayos y empezar el piloto</button></div>' +
      '<p class="tiny muted">No se puede deshacer desde la consola; lo borrado queda solo en la hoja de respaldo.</p></div>';
    var bit = D.bitacora || [];
    if (bit.length) h += '<div class="card"><h3>Reinicios anteriores</h3><ul class="small">' + bit.slice().reverse().map(function (b) {
      var n = 0; try { var o = JSON.parse(b.detalle || '{}'); Object.keys(o).forEach(function (k) { n += Number(o[k]) || 0; }); } catch (x) {}
      return '<li>' + e(S.fecha(b.ts)) + ' · ' + S.num(n) + ' registros' + (b.respaldo_url ? ' · <a href="' + e(b.respaldo_url) + '" target="_blank" rel="noopener">respaldo ↗</a>' : '') + '</li>'; }).join('') + '</ul></div>';
    el.innerHTML = h;
    S.$('#rc-cambios', el).onchange = renderReinicio;
    var inp = S.$('#rc-frase', el), go = S.$('#rc-go', el);
    inp.oninput = function () { go.disabled = inp.value.trim().toUpperCase() !== FRASE || !total; };
    go.onclick = function () {
      S.busy(go, function () { return S.post({ action: 'limpiar_registros', key: key, confirmar: inp.value.trim(), conservar_cambios: conservarCambios, registrado_por: 'consola' }); }).then(function (r) {
        if (!r || !r.ok) { S.toast(S.errMsg(r), true); return; }
        try { Object.keys(window.localStorage).forEach(function (k) { if (/^sintonia_hechos_/.test(k)) S.LS.del(k); }); } catch (x) {}
        ultimoReinicio = r; filtro = 'piloto'; sel.grupo = ''; sel.plan = ''; borrador = [];
        S.toast('Hoja en blanco · ' + S.num(r.total) + ' registros borrados');
        return load();
      });
    };
  }

  load();
})();
</script>
</body>
</html>
