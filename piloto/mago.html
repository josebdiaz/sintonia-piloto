<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sintonía · Consola del mago M2</title>
<link rel="stylesheet" href="assets/sintonia.css">
</head>
<body>
<main class="wrap wide">
  <header class="top">
    <a class="brand" href="mago.html"><span class="brand-mark" aria-hidden="true"></span>Consola del mago <span class="tag">M2</span></a>
    <div class="actions" style="margin:0">
      <button class="btn btn-ghost btn-sm" id="recargar" type="button">↻ Recargar</button>
      <button class="btn btn-ghost btn-sm" id="cfg" type="button" title="URL del backend">⚙ Backend</button>
      <button class="btn btn-ghost btn-sm" id="salir" type="button">Salir</button>
    </div>
  </header>

  <section id="gate" class="hidden">
    <form class="card" id="gateForm" style="max-width:420px">
      <h2>Entrar a la consola</h2>
      <p class="small muted">Solo el equipo. La clave se guarda en esta pestaña y se borra al cerrarla.</p>
      <div class="field"><label for="key">ADMIN_KEY</label><input id="key" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="entrar" data-busy="Verificando…">Entrar</button>
    </form>
  </section>

  <section id="consola" class="hidden">
    <p class="small muted" id="resumen"></p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="grupos" aria-selected="true">1 · Grupos y quórum</button>
      <button role="tab" data-tab="planes">2 · Curaduría de planes</button>
      <button role="tab" data-tab="mensajes">3 · Mensajes</button>
      <button role="tab" data-tab="registro">4 · Eventos y minutos</button>
      <button role="tab" data-tab="cambios">Cambios (I4)</button>
      <button role="tab" data-tab="inventario">Inventario</button>
    </nav>
    <div id="tab-grupos" class="tab"></div>
    <div id="tab-planes" class="tab hidden"></div>
    <div id="tab-mensajes" class="tab hidden"></div>
    <div id="tab-registro" class="tab hidden"></div>
    <div id="tab-cambios" class="tab hidden"></div>
    <div id="tab-inventario" class="tab hidden"></div>
  </section>
</main>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var D = null, key = '', sel = { grupo: '', plan: '' }, borrador = [], filtro = 'piloto';
  var CAUSAS = ['coordinacion', 'redactar_mensaje', 'resolver_duda', 'cambio_plan', 'recordatorio', 'falla_tecnica', 'seguridad', 'otro'];
  var CAIDA = [['trafico', 'Tráfico'], ['lluvia', 'Lluvia'], ['agenda', 'Agenda / no cuadró'], ['costo', 'Costo'], ['desinteres', 'Desinterés'], ['imprevisto', 'Imprevisto'], ['otro', 'Otro']];
  var e = S.esc;

  /* ---------- Acceso ---------- */
  function gate(on) { S.show('#gate', on); S.show('#consola', !on); }
  S.$('#gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); S.SS.set('sintonia_admin_key', S.$('#key').value.trim()); S.busy(S.$('#entrar'), load); });
  S.$('#salir').onclick = function () { S.forgetKey(); location.reload(); };
  S.$('#cfg').onclick = S.configBackend;
  S.$('#recargar').onclick = function () { S.busy(this, load); };

  function load() {
    key = S.adminKey(false);
    if (!key) { gate(true); return Promise.resolve(); }
    return S.get({ view: 'mago', key: key }).then(function (r) {
      if (!r || !r.ok) { if (r && r.error === 'no_autorizado') { S.forgetKey(); gate(true); } S.toast(S.errMsg(r), true); return; }
      D = r; gate(false); renderAll();
    });
  }
  function act(btn, payload, okMsg) {
    return S.busy(btn, function () { return S.post(Object.assign({ key: key }, payload)); }).then(function (r) {
      if (!r || !r.ok) { S.toast(S.errMsg(r), true); return r; }
      if (okMsg) S.toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
      return load().then(function () { return r; });
    });
  }

  /* ---------- Ayudas ---------- */
  function grupo(id) { return (D.grupos || []).filter(function (g) { return g.grupo_id === id; })[0]; }
  function plan(id) { return (D.planes || []).filter(function (p) { return p.plan_id === id; })[0]; }
  function planesDe(gid) { return (D.planes || []).filter(function (p) { return p.grupo_id === gid; }); }
  function nombre(gid, pid) { var g = grupo(gid); var m = g && g.miembros.filter(function (x) { return x.pid === pid; })[0]; return m ? m.nombre || pid : pid; }
  function badge(t) { return '<span class="badge ' + e(t) + '">' + e(t) + '</span>'; }
  function opts(list, val) { return list.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + e(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + e(o[1]) + '</option>'; }).join(''); }
  function grupoLabel(g) { return g.tipo_grupo + ' · ' + g.experimento + ' · ' + g.grupo_id.slice(-6) + (g.modo === 'prueba' ? ' (prueba)' : ''); }
  function linkPlan(pid) { return S.link('plan.html', { pid: pid }); }
  function linkRetro(pid, planId) { return S.link('retro.html', { pid: pid, plan_id: planId }); }
  function localDT(v) { if (!v) return ''; var d = new Date(v); if (isNaN(d)) return ''; var p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  function renderAll() {
    var gs = D.grupos || [];
    S.$('#resumen').textContent = gs.filter(function (g) { return g.modo === 'piloto'; }).length + ' grupos piloto · ' + gs.filter(function (g) { return g.estado === 'activo'; }).length + ' activos · ' +
      (D.planes || []).length + ' planes · ' + (D.inventario || []).length + ' lugares activos en el inventario';
    if (!sel.grupo || !grupo(sel.grupo)) { var a = gs.filter(function (g) { return g.estado === 'activo'; })[0] || gs[0]; sel.grupo = a ? a.grupo_id : ''; }
    var ps = planesDe(sel.grupo); if (!sel.plan || !plan(sel.plan) || plan(sel.plan).grupo_id !== sel.grupo) sel.plan = ps.length ? ps[ps.length - 1].plan_id : '';
    renderGrupos(); renderPlanes(); renderMensajes(); renderRegistro(); renderCambios(); renderInventario();
  }

  /* ---------- Pestañas ---------- */
  S.$$('[data-tab]').forEach(function (b) {
    b.onclick = function () { S.$$('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); }); S.$$('.tab').forEach(function (t) { S.show(t, t.id === 'tab-' + b.dataset.tab); }); };
  });

  /* ---------- 1 · Grupos y quórum (I9) ---------- */
  function renderGrupos() {
    var el = S.$('#tab-grupos');
    var gs = (D.grupos || []).filter(function (g) { return filtro === 'todos' || g.modo === filtro; });
    var h = '<div class="actions" style="margin-top:6px">Ver: <select id="filtro" style="width:auto;min-height:36px">' + opts([['piloto', 'Piloto'], ['prueba', 'Prueba'], ['todos', 'Todos']], filtro) + '</select></div>';
    if (!gs.length) h += '<div class="card empty"><p class="muted">No hay grupos todavía. Comparte la landing: <b>index.html?exp=E1</b> o <b>?exp=E2</b>.</p></div>';
    h += '<div class="grid two">' + gs.map(function (g) {
      var n = g.miembros.length, inv = Number(g.n_invitados) || 0, invLink = S.link('unirse.html', { inv: g.codigo_invitacion });
      var mm = g.miembros.map(function (m) {
        var personal = linkPlan(m.pid);
        return '<div class="member"><div class="who"><b>' + e(m.nombre || '—') + '</b> <span class="tiny muted">' + e(m.rol) + '</span><br><span class="tiny muted">+' + e(S.phone(m.whatsapp)) + '</span></div>' +
          '<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' + e(S.wa(m.whatsapp)) + '">Abrir chat</a>' +
          (personal ? '<button class="btn btn-ghost btn-sm" data-copy="' + e(personal) + '">' + (g.experimento === 'E2' ? 'Copiar su enlace' : 'Enlace web (contingencia)') + '</button>' : '') +
          '<button class="btn btn-danger btn-sm" data-revocar="' + e(m.pid) + '" data-nombre="' + e(m.nombre) + '" data-busy="Purgando…">Revocar y purgar</button></div>';
      }).join('');
      return '<div class="card"><div class="actions" style="margin:0 0 8px;justify-content:space-between"><h3 style="margin:0">' + e(g.tipo_grupo) + ' · ' + e(g.experimento) + '</h3><span>' + badge(g.estado) + ' ' + (g.modo === 'prueba' ? badge('prueba') : '') + ' <span class="badge">' + e(g.version || 'v1') + '</span></span></div>' +
        '<p class="small" style="margin:0">Quórum: <b>' + n + ' / ' + inv + '</b> consintieron' + (g.motivo ? ' · <span class="muted">' + e(g.motivo) + '</span>' : '') + '</p>' +
        '<div class="bar"><i style="width:' + (inv ? Math.min(100, Math.round(n / inv * 100)) : 0) + '%"></i></div>' +
        (g.estado === 'reclutando' ? '<div class="linkbox" style="margin-top:10px">' + e(invLink) + '</div><div class="actions"><button class="btn btn-ghost btn-sm" data-copy="' + e(invLink) + '">Copiar invitación</button>' +
          '<button class="btn btn-primary btn-sm" data-cerrar="' + e(g.grupo_id) + '" data-n="' + n + '" data-inv="' + inv + '" data-busy="Cerrando…">Cerrar reclutamiento</button></div>' : '') +
        (g.preferencias && g.preferencias.length ? '<details style="margin-top:10px"><summary class="small">Preferencias (' + g.preferencias.length + ')</summary><ul class="small">' + g.preferencias.map(function (p) { return '<li>' + e(p) + '</li>'; }).join('') + '</ul></details>' : '') +
        '<div style="margin-top:8px">' + (mm || '<p class="small muted">Sin miembros activos.</p>') + '</div></div>';
    }).join('') + '</div>';
    el.innerHTML = h;
    S.$('#filtro', el).onchange = function () { filtro = this.value; renderGrupos(); };
    bindCopy(el);
    S.$$('[data-cerrar]', el).forEach(function (b) {
      b.onclick = function () {
        var n = Number(b.dataset.n), inv = Number(b.dataset.inv);
        var txt = n < inv ? 'Solo ' + n + ' de ' + inv + ' consintieron. Por la regla I9 el grupo quedará EXCLUIDO de las pruebas. ¿Cerrar igual?' : 'Consintieron ' + n + ' de ' + inv + '. El grupo pasa a ACTIVO. ¿Cerrar reclutamiento?';
        if (confirm(txt)) act(b, { action: 'cerrar_reclutamiento', grupo_id: b.dataset.cerrar }, function (r) { return 'Grupo ' + r.estado + ' (' + r.consentidos + '/' + r.invitados + ')'; });
      };
    });
    S.$$('[data-revocar]', el).forEach(function (b) {
      b.onclick = function () {
        if (!confirm('¿' + (b.dataset.nombre || 'Esta persona') + ' pidió retirarse? Se borran sus datos y el grupo queda EXCLUIDO (I9). No se puede deshacer.')) return;
        if (prompt('Escribe REVOCAR para confirmar') !== 'REVOCAR') return S.toast('Cancelado.');
        S.busy(b, function () { return S.post({ action: 'revocar', pid: b.dataset.revocar }); }).then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast('Datos suprimidos y grupo excluido.'); load(); });
      };
    });
  }
  function bindCopy(el) { S.$$('[data-copy]', el).forEach(function (b) { b.onclick = function () { S.copy(b.dataset.copy); }; }); }

  /* ---------- 2 · Curaduría de planes (humano en el loop) ---------- */
  function invOptions(val) { return '<option value="">—</option>' + (D.inventario || []).map(function (i) { return '<option value="' + e(i.id) + '"' + (i.id === val ? ' selected' : '') + '>' + e(i.id + ' · ' + i.nombre + ' (' + i.zona + ')') + '</option>'; }).join(''); }
  function invById(id) { return (D.inventario || []).filter(function (i) { return i.id === id; })[0]; }

  function renderPlanes() {
    var el = S.$('#tab-planes'), gs = D.grupos || [], g = grupo(sel.grupo), p = plan(sel.plan);
    var h = '<div class="card"><div class="row"><div class="field" style="margin:0"><label for="selG">Grupo</label><select id="selG">' + opts(gs.map(function (x) { return [x.grupo_id, grupoLabel(x) + ' · ' + x.estado]; }), sel.grupo) + '</select></div>' +
      '<div class="field" style="margin:0"><label for="selP">Plan</label><select id="selP">' + (planesDe(sel.grupo).length ? opts(planesDe(sel.grupo).map(function (x) { return [x.plan_id, 'Ronda ' + x.ronda + ' · ' + x.estado]; }), sel.plan) : '<option value="">Sin planes</option>') + '</select></div></div>' +
      '<div class="actions">' + (g && g.estado === 'activo' ? '<button class="btn btn-primary btn-sm" id="crearPlan" data-busy="Creando…">+ Crear plan</button>' : '<span class="small muted">Solo se crean planes en grupos activos.</span>') + '</div></div>';
    if (p) h += planCard(g, p);
    el.innerHTML = h;
    S.$('#selG', el).onchange = function () { sel.grupo = this.value; sel.plan = ''; borrador = []; renderAll(); };
    if (S.$('#selP', el)) S.$('#selP', el).onchange = function () { sel.plan = this.value; borrador = []; renderAll(); };
    if (S.$('#crearPlan', el)) S.$('#crearPlan', el).onclick = function () { act(this, { action: 'crear_plan', grupo_id: sel.grupo }, 'Plan creado').then(function (r) { if (r && r.ok) { sel.plan = r.plan_id; borrador = []; renderAll(); } }); };
    if (p) bindPlan(el, g, p);
  }

  function planCard(g, p) {
    var ops = []; try { ops = JSON.parse(p.opciones_json || '[]'); } catch (x) {}
    var h = '<div class="card"><div class="actions" style="margin:0 0 6px;justify-content:space-between"><h3 style="margin:0">Ronda ' + e(p.ronda) + ' · ' + e(p.experimento) + '</h3><span>' + badge(p.estado) + ' <span class="badge">' + e(p.version) + '</span></span></div>';
    if (p.estado === 'borrador' || p.estado === 'en_revision') {
      if (!borrador.length && ops.length) borrador = ops.map(function (o) { return { titulo: o.titulo, hora_salida: o.hora_salida, presupuesto_aprox: o.presupuesto_aprox, por_que: o.por_que, ids: (o.paradas || []).map(function (s) { return s.id; }) }; });
      h += '<div class="field"><label for="restr">Restricciones del plan para Gemini</label><textarea id="restr" maxlength="600" placeholder="Ej.: sábado 10/10 en la tarde, máx. $40.000, sur u oeste, alguien en muletas."></textarea></div>' +
        '<div class="actions"><button class="btn btn-honey btn-sm" id="pedirIA" data-busy="Gemini pensando…">✨ Pedir opciones a Gemini</button><button class="btn btn-ghost btn-sm" id="addOp">+ Opción manual</button></div>' +
        '<p class="tiny muted">Gemini solo puede usar lugares activos del inventario (I6). Puedes editar títulos, hora de salida, presupuesto y el porqué. Si un horario o costo del inventario está mal, corrígelo en la hoja "inventario" y vuelve a cargar.</p>';
      h += borrador.map(function (o, i) {
        return '<div class="option" data-op="' + i + '"><div class="actions" style="margin:0;justify-content:space-between"><b>Opción ' + (i + 1) + '</b><button class="btn btn-ghost btn-sm" data-quitar="' + i + '">Quitar</button></div>' +
          '<div class="field"><label>Título</label><input type="text" data-f="titulo" maxlength="80" value="' + e(o.titulo) + '"></div>' +
          '<div class="row"><div class="field"><label>Parada 1</label><select data-f="id0">' + invOptions(o.ids[0]) + '</select></div><div class="field"><label>Parada 2 (opcional)</label><select data-f="id1">' + invOptions(o.ids[1]) + '</select></div></div>' +
          '<div class="row"><div class="field"><label>Salida sugerida</label><input type="text" data-f="hora_salida" maxlength="40" value="' + e(o.hora_salida) + '"></div><div class="field"><label>Presupuesto aprox.</label><input type="text" data-f="presupuesto_aprox" maxlength="40" value="' + e(o.presupuesto_aprox) + '"></div></div>' +
          '<div class="field"><label>Por qué le sirve al grupo</label><textarea data-f="por_que" maxlength="200" style="min-height:60px">' + e(o.por_que) + '</textarea></div></div>';
      }).join('');
      if (borrador.length) h += '<div class="actions"><button class="btn btn-primary" id="publicar" data-busy="Publicando…">Publicar plan al grupo</button></div>';
    } else {
      h += ops.map(function (o, i) {
        var n = (p.conteo && p.conteo[i]) || 0, win = p.estado === 'cerrado' && String(p.elegida) === String(i);
        return '<div class="option' + (win ? ' win' : '') + '"><b>' + (i + 1) + '. ' + e(o.titulo) + '</b> <span class="small muted">· ' + n + ' voto' + (n === 1 ? '' : 's') + '</span><div class="small muted">' + (o.paradas || []).map(function (s) { return e(s.nombre); }).join(' → ') + ' · salida ' + e(o.hora_salida) + ' · ' + e(o.presupuesto_aprox) + '</div></div>';
      }).join('') + '<p class="small">Vetos ("ninguna me sirve"): <b>' + (p.vetos || 0) + '</b></p>';
    }
    if (p.estado === 'votando') {
      var g2 = grupo(p.grupo_id), max = -1, best = 0;
      Object.keys(p.conteo || {}).forEach(function (k) { if (p.conteo[k] > max) { max = p.conteo[k]; best = Number(k); } });
      var faltan = (g2 ? g2.miembros : []).filter(function (m) { return (p.votos_por_pid || {})[m.pid] === undefined; });
      var horasPub = p.t_publicado ? (Date.now() - new Date(p.t_publicado).getTime()) / 36e5 : 0;
      var org = (g2 ? g2.miembros : []).filter(function (m) { return m.rol === 'organizador'; })[0];
      h += '<div class="card ' + (faltan.length && horasPub >= 2 ? 'warn' : 'soft') + ' small" style="margin-top:12px">Publicado hace <b>' + S.num(horasPub) + ' h</b> · ' +
        (faltan.length ? 'faltan <b>' + faltan.length + '</b> voto(s): ' + faltan.map(function (m) { return e(m.nombre); }).join(', ') : 'ya votaron todos') +
        (faltan.length && horasPub >= 2 && p.experimento === 'E2' && org ? '<div class="actions" style="margin-top:8px"><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' + e(S.wa(org.whatsapp, 'Hola ' + org.nombre + ', ¿le recuerdas a tu parche que voten el plan? Faltan ' + faltan.length + '. ¡Gracias!')) + '">Avisar al organizador</a><span class="tiny muted">Contingencia E2: solo al organizador; registra los minutos.</span></div>' : '') + '</div>';
      h += '<h3 style="margin-top:14px">Votos por persona</h3><p class="tiny muted">' + (p.experimento === 'E1' ? 'En el E1, registra aquí lo que cada persona votó en el chat.' : 'En el E2 cada persona vota en la página; aquí solo se ve.') + '</p>';
      h += (g2 ? g2.miembros : []).map(function (m) {
        var v = (p.votos_por_pid || {})[m.pid];
        return '<div class="member"><div class="who">' + e(m.nombre) + ' <span class="tiny muted">' + (v === undefined ? 'sin voto' : v === 'veto' ? 'ninguna le sirve' : 'opción ' + (Number(v) + 1)) + '</span></div>' +
          (p.experimento === 'E1' ? '<select data-votopid="' + e(m.pid) + '" style="width:auto;min-height:36px"><option value="">Registrar voto…</option>' + ops.map(function (o, i) { return '<option value="' + i + '">Opción ' + (i + 1) + '</option>'; }).join('') + '<option value="veto">Ninguna le sirve</option></select>' : '') + '</div>';
      }).join('');
      h += '<div class="card soft" style="margin-top:14px"><h3>Cerrar votación</h3><div class="row"><div class="field"><label for="elegida">Opción ganadora</label><select id="elegida">' + opts(ops.map(function (o, i) { return [i, (i + 1) + '. ' + o.titulo]; }), best) + '</select></div>' +
        '<div class="field"><label for="hora">Encuentro (día y hora)</label><input id="hora" type="datetime-local"></div></div>' +
        '<div class="field"><label for="nota">Nota (opcional)</label><input id="nota" type="text" maxlength="300"></div>' +
        '<div class="actions"><button class="btn btn-primary btn-sm" id="cerrarPlan" data-busy="Cerrando…">Cerrar plan</button></div>' +
        '<div class="row" style="margin-top:10px;align-items:flex-end"><div class="field" style="margin:0"><label for="causa">Si el plan no se dio</label><select id="causa">' + opts([['', 'Causa…']].concat(CAIDA)) + '</select></div><button class="btn btn-danger btn-sm" id="caido" data-busy="Guardando…" style="flex:0 0 auto">Marcar como caído</button></div></div>';
    }
    if (p.estado === 'cerrado') {
      var g3 = grupo(p.grupo_id);
      h += '<p class="small">Encuentro: <b>' + e(S.fecha(p.hora_encuentro) || 'sin hora') + '</b> · apuntados ' + e(p.n_apuntados || 0) + ' · llegaron ' + e(p.n_asistentes || 0) + ' de ' + e(p.n_invitados) + '</p>';
      h += '<h3>Enlaces personales a la retro</h3>' + (g3 ? g3.miembros : []).map(function (m) {
        var st = (p.estado_por_pid || {})[m.pid] || {}, l = linkRetro(m.pid, p.plan_id);
        return '<div class="member"><div class="who">' + e(m.nombre) + ' <span class="tiny muted">' + [st.apuntado ? 'apuntado' : '', st.llego ? 'llegó' : '', st.casa ? 'en casa' : ''].filter(Boolean).join(' · ') + '</span></div>' +
          '<button class="btn btn-ghost btn-sm" data-copy="' + e(l) + '">Copiar</button><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="' + e(S.wa(m.whatsapp, '¿Cómo les fue? Si hubo sintonía, sigan 🙌 Cuéntanos en 2 minutos: ' + l)) + '">Enviar por WhatsApp</a></div>';
      }).join('');
      h += '<div class="row" style="margin-top:12px;align-items:flex-end"><div class="field" style="margin:0"><label for="causa2">¿Se cayó después de cerrado?</label><select id="causa2">' + opts([['', 'Causa…']].concat(CAIDA)) + '</select></div><button class="btn btn-danger btn-sm" id="marcarCaido" data-busy="Guardando…" style="flex:0 0 auto">Marcar como caído</button></div>';
    }
    if (p.experimento === 'E1' && (p.estado === 'votando' || p.estado === 'cerrado')) {
      h += p.failover ? '<div class="card warn small">Cambio de canal registrado: <b>' + e(p.failover) + '</b>. Este plan sigue por la web y no entra en la comparación E1/E2.</div>'
        : '<details style="margin-top:12px"><summary class="small"><b>Contingencia</b> · WhatsApp bloqueado o caído</summary><p class="small muted">Pasa este plan a la web: cada persona usa su enlace web (pestaña 1). El plan queda marcado y se reporta aparte.</p>' +
          '<div class="row" style="align-items:flex-end"><div class="field" style="margin:0"><label for="foMotivo">Motivo</label><select id="foMotivo">' + opts([['whatsapp_bloqueado', 'WhatsApp bloqueado o reportado'], ['whatsapp_caido', 'WhatsApp caído'], ['otro', 'Otro']]) + '</select></div><button class="btn btn-danger btn-sm" id="failover" data-busy="Guardando…" style="flex:0 0 auto">Pasar a la web</button></div></details>';
    }
    if (p.estado === 'caido') h += '<p class="small">Causa: <b>' + e(p.causa_caida || 'sin causa') + '</b>' + (p.nota ? ' · ' + e(p.nota) : '') + '</p>';
    return h + '</div>';
  }

  function leerBorrador(el) {
    S.$$('[data-op]', el).forEach(function (c) {
      var o = borrador[Number(c.dataset.op)];
      S.$$('[data-f]', c).forEach(function (f) { if (f.dataset.f === 'id0') o.ids[0] = f.value; else if (f.dataset.f === 'id1') o.ids[1] = f.value; else o[f.dataset.f] = f.value; });
    });
  }
  function bindPlan(el, g, p) {
    bindCopy(el);
    var ia = S.$('#pedirIA', el);
    if (ia) ia.onclick = function () {
      S.busy(ia, function () { return S.post({ action: 'proponer_ia', key: key, plan_id: p.plan_id, restricciones: S.$('#restr', el).value }); }).then(function (r) {
        if (!r || !r.ok) return S.toast(S.errMsg(r), true);
        borrador = (r.opciones || []).map(function (o) { return { titulo: o.titulo, hora_salida: o.hora_salida, presupuesto_aprox: o.presupuesto_aprox, por_que: o.por_que, ids: o.paradas.map(function (s) { return s.id; }) }; });
        S.toast(borrador.length + ' opciones · ' + (r.tokens ? r.tokens.in + '+' + r.tokens.out + ' tokens' : '') + (r.ids_descartados ? ' · ' + r.ids_descartados + ' lugar(es) fuera del inventario descartados' : ''));
        load();
      });
    };
    var add = S.$('#addOp', el);
    if (add) add.onclick = function () { leerBorrador(el); if (borrador.length >= 3) return S.toast('Máximo 3 opciones.', true); borrador.push({ titulo: '', hora_salida: '', presupuesto_aprox: '', por_que: '', ids: [] }); renderPlanes(); };
    S.$$('[data-quitar]', el).forEach(function (b) { b.onclick = function () { leerBorrador(el); borrador.splice(Number(b.dataset.quitar), 1); renderPlanes(); }; });
    var pub = S.$('#publicar', el);
    if (pub) pub.onclick = function () {
      leerBorrador(el);
      var ops = borrador.map(function (o) {
        var ids = o.ids.filter(Boolean).slice(0, 2);
        return { titulo: o.titulo.trim(), hora_salida: o.hora_salida, presupuesto_aprox: o.presupuesto_aprox, por_que: o.por_que,
          paradas: ids.map(function (id) { var i = invById(id); return i ? { id: i.id, nombre: i.nombre, zona: i.zona, costo_aprox: i.costo_aprox, horario: i.horario } : null; }).filter(Boolean) };
      });
      if (!ops.length || ops.some(function (o) { return !o.titulo || !o.paradas.length; })) return S.toast('Cada opción necesita título y al menos una parada del inventario.', true);
      if (!confirm('¿Publicar ' + ops.length + ' opción(es)? El grupo las verá ' + (p.experimento === 'E2' ? 'en su página.' : 'cuando las envíes por WhatsApp (pestaña Mensajes).'))) return;
      act(pub, { action: 'publicar_plan', plan_id: p.plan_id, opciones: ops }, 'Plan publicado').then(function () { borrador = []; });
    };
    S.$$('[data-votopid]', el).forEach(function (s) {
      s.onchange = function () { var v = s.value; if (v === '') return; S.post({ action: 'votar', plan_id: p.plan_id, pid: s.dataset.votopid, opcion: v === 'veto' ? '' : Number(v), veto: v === 'veto' }).then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast('Voto registrado'); load(); }); };
    });
    var cp = S.$('#cerrarPlan', el);
    if (cp) cp.onclick = function () {
      var hora = S.$('#hora', el).value; if (!hora) return S.toast('Pon el día y la hora del encuentro (capa 2).', true);
      act(cp, { action: 'cerrar_plan', plan_id: p.plan_id, elegida: Number(S.$('#elegida', el).value), hora_encuentro: hora.replace('T', ' '), nota: S.$('#nota', el).value }, 'Plan cerrado');
    };
    var fo = S.$('#failover', el);
    if (fo) fo.onclick = function () { if (confirm('¿Pasar este plan del E1 a la web? Queda fuera de la comparación E1/E2.')) act(fo, { action: 'marcar_failover', plan_id: p.plan_id, hacia: 'E2', motivo: S.$('#foMotivo', el).value }, 'Cambio de canal registrado. Envía a cada persona su enlace web.'); };
    var cd = S.$('#caido', el);
    if (cd) cd.onclick = function () { var c = S.$('#causa', el).value; if (!c) return S.toast('Elige la causa (S9).', true); if (confirm('¿Marcar el plan como caído por "' + c + '"?')) act(cd, { action: 'cerrar_plan', plan_id: p.plan_id, caido: true, causa_caida: c, nota: S.$('#nota', el).value }, 'Plan marcado como caído'); };
    var mc = S.$('#marcarCaido', el);
    if (mc) mc.onclick = function () { var c = S.$('#causa2', el).value; if (!c) return S.toast('Elige la causa (S9).', true); if (confirm('¿Marcar el plan como caído por "' + c + '"?')) act(mc, { action: 'marcar_caido', plan_id: p.plan_id, causa_caida: c }, 'Plan marcado como caído'); };
  }

  /* ---------- 3 · Mensajes rápidos (borrador de voz de marca) ---------- */
  function tplData() {
    var p = plan(sel.plan), ops = []; if (p) { try { ops = JSON.parse(p.opciones_json || '[]'); } catch (x) {} }
    var w = p && p.estado === 'cerrado' ? ops[Number(p.elegida)] || {} : {};
    var g = p ? grupo(p.grupo_id) : null;
    var faltan = p && g ? g.miembros.filter(function (m) { return (p.votos_por_pid || {})[m.pid] === undefined; }).map(function (m) { return m.nombre; }) : [];
    var dir = (w.paradas || []).map(function (s) { var i = invById(s.id); return i && i.direccion ? i.direccion : ''; }).filter(Boolean).join(' → ');
    return {
      faltan: faltan.length ? faltan.join(', ') : '[nombres]', salida: w.hora_salida || '[hora de salida]', dir: dir || '[dirección]', presupuesto: w.presupuesto_aprox || '[presupuesto]',
      aviso: S.link('aviso.html', {}), humano: S.LS.get('sintonia_mago_nombre') || '[tu nombre]',
      lista: ops.length ? ops.map(function (o, i) { return (i + 1) + '️⃣ ' + o.titulo + ' — ' + (o.paradas || []).map(function (s) { return s.nombre; }).join(' → ') + (o.hora_salida ? ' · salida ' + o.hora_salida : '') + (o.presupuesto_aprox ? ' · ' + o.presupuesto_aprox : ''); }).join('\n') : '[opciones del plan]',
      n: ops.length || '[n]', plan: w.titulo || '[plan elegido]', lugar: (w.paradas || []).map(function (s) { return s.nombre + (s.zona ? ' (' + s.zona + ')' : ''); }).join(' → ') || '[lugar]',
      hora: p && p.hora_encuentro ? S.fecha(p.hora_encuentro) : '[día y hora]', retro: S.link('retro.html', {})
    };
  }
  var TPL = [
    ['/ingreso', 'Bienvenida y transparencia (primer mensaje del grupo)', function (d) { return '¡Hola, parche! 👋 Soy Sintonía, el quinto amigo que ayuda a que el plan sí se dé: menos vueltas y opciones reales en Cali.\nLes propongo opciones, ustedes votan y yo me encargo de cuadrar la logística.\nTodas las personas de este grupo dieron su autorización. En este piloto una persona del equipo revisa todo lo que propongo.\n👤 Si necesitan hablar con alguien del equipo, escriban HUMANO.\n🚪 Si alguien quiere salir, escribe SALIR o sale del grupo, sin problema.\n🔒 Aviso de privacidad: ' + d.aviso; }],
    ['/opciones', 'Opciones para votar', function (d) { return 'Les traigo ' + d.n + ' opciones:\n' + d.lista + '\n\nVoten con el número. Si ninguna les sirve, escriban NINGUNA y busco otra cosa. Cerca, corto y posible.'; }],
    ['/recordatorio', 'Recordatorio de votación', function (d) { return '⏳ Para cerrar los detalles con tiempo nos falta el voto de ' + d.faltan + '. ¿Cuál les late más: 1, 2 o 3? Si ninguna sirve, también vale decirlo.'; }],
    ['/confirmado', 'Plan cerrado', function (d) { return '¡Quedó! Ruta clara, ganas intactas:\n📍 ' + d.plan + ' — ' + d.lugar + '\n📌 Dirección: ' + d.dir + '\n🕒 Encuentro: ' + d.hora + '\n🚗 Salida sugerida: ' + d.salida + '. En Cali la hora pico y la lluvia cambian los tiempos; mejor salir con margen.\n💰 Presupuesto aprox.: ' + d.presupuesto + ' por persona\nRespondan ME APUNTO si van o NO PUEDO si no alcanzan.'; }],
    ['/checkpoint', 'Día del plan · llegada', function () { return '¿Ya llegaron? Cuando estén en el sitio respondan LLEGUÉ. No usamos su ubicación. Y al volver, un "ya en casa" nos deja tranquilos.'; }],
    ['/retro', 'Cierre y pulso', function (d) { return '¿Cómo les fue? Si hubo sintonía, sigan 🙌\nCuéntennos en 2 minutos (ábranlo en el mismo celular con el que se registraron): ' + d.retro + '\nSus respuestas son privadas.'; }],
    ['/guardrail', 'Fuera de alcance (política de IA de WhatsApp)', function () { return 'Mi tarea es ayudarles a armar y coordinar planes en Cali, así que en eso no les puedo ayudar. ¿Volvemos al plan?'; }],
    ['/humano', 'Escalar a una persona', function (d) { return 'Hola, soy ' + d.humano + ', del equipo de investigación de Sintonía. Tomo la conversación para ayudarles con lo que necesiten. Si es una emergencia, llamen al 123.'; }]
  ];
  function renderMensajes() {
    var el = S.$('#tab-mensajes'), d = tplData(), p = plan(sel.plan);
    var h = '<div class="card warn small"><b>Borrador.</b> Textos escritos con el sistema verbal (Wording_verificado_v2.md) y el guion del Mago de Oz. Revísenlos antes del ensayo del 9/10. ' +
      (p ? 'Se llenan con el plan seleccionado (ronda ' + e(p.ronda) + ' · ' + e(grupoLabel(grupo(p.grupo_id))) + ').' : 'Selecciona un plan en la pestaña 2 para llenar los datos.') + '</div>' +
      '<div class="row" style="align-items:flex-end"><div class="field" style="margin:0"><label for="magoNombre">Nombre de quien atiende hoy (para /humano)</label><input id="magoNombre" type="text" maxlength="30" value="' + e(S.LS.get('sintonia_mago_nombre') || '') + '"></div></div><div class="grid two">';
    h += TPL.map(function (t, i) { var txt = t[2](d); return '<div class="tpl"><div class="actions" style="margin:0;justify-content:space-between"><span><b>' + e(t[0]) + '</b> <span class="small muted">' + e(t[1]) + '</span></span><button class="btn btn-primary btn-sm" data-tpl="' + i + '">Copiar</button></div><pre>' + e(txt) + '</pre></div>'; }).join('');
    h += '</div><div class="card"><h3>Redactar con Gemini (opcional)</h3><p class="small muted">Útil para ajustar el tono. Cuenta tokens en la hoja de costos.</p><div class="row"><div class="field"><label for="paso">Paso</label><select id="paso">' + opts(['activacion', 'opciones', 'recordatorio', 'confirmado', 'checkpoint', 'cierre']) + '</select></div><div class="field"><label for="tono">Tono</label><select id="tono">' + opts(['plan tranqui', 'parche animado', 'familiar y cálido']) + '</select></div></div>' +
      '<div class="actions"><button class="btn btn-honey btn-sm" id="redactar" data-busy="Redactando…">✨ Redactar</button></div><pre id="redaccion" class="tpl hidden"></pre></div>';
    el.innerHTML = h;
    S.$$('[data-tpl]', el).forEach(function (b) { b.onclick = function () { S.copy(TPL[Number(b.dataset.tpl)][2](tplData())); }; });
    S.$('#magoNombre', el).onchange = function () { S.LS.set('sintonia_mago_nombre', this.value.trim()); renderMensajes(); };
    S.$('#redactar', el).onclick = function () {
      var b = this; S.busy(b, function () { return S.post({ action: 'redactar_ia', key: key, plan_id: sel.plan, paso: S.$('#paso', el).value, tono: S.$('#tono', el).value }); }).then(function (r) {
        if (!r || !r.ok) return S.toast(S.errMsg(r), true); var pre = S.$('#redaccion', el); pre.textContent = r.texto; S.show(pre, true); pre.onclick = function () { S.copy(r.texto); }; S.toast('Listo. Toca el texto para copiarlo.');
      });
    };
  }

  /* ---------- 4 · Eventos del chat y minutos humanos (I3) ---------- */
  function renderRegistro() {
    var el = S.$('#tab-registro'), p = plan(sel.plan), g = grupo(sel.grupo);
    var h = '<div class="grid two"><div class="card"><h3>Eventos del chat</h3><p class="small muted">Plan seleccionado: ' + (p ? 'ronda ' + e(p.ronda) + ' · ' + e(p.estado) + ' · ' + e(grupoLabel(g)) : 'ninguno (elige uno en la pestaña 2)') + '</p>';
    if (p && g) {
      h += g.miembros.map(function (m) {
        var st = (p.estado_por_pid || {})[m.pid] || {};
        return '<div class="member"><div class="who"><b>' + e(m.nombre) + '</b> <span class="tiny muted">' + [st.apuntado ? 'apuntado' : '', st.llego ? 'llegó' : '', st.casa ? 'en casa' : ''].filter(Boolean).join(' · ') + '</span></div>' +
          [['me_apunto', 'Me apunto'], ['no_puedo', 'No puedo'], ['checkpoint_llegada', 'Llegó'], ['llego_casa', 'En casa']].map(function (t) { return '<button class="btn btn-ghost btn-sm" data-ev="' + t[0] + '" data-pid="' + e(m.pid) + '" data-busy="…">' + t[1] + '</button>'; }).join('') + '</div>';
      }).join('');
      h += '<p class="small" style="margin-top:12px">Mensajes del mago al grupo:</p><div class="actions" style="margin-top:4px">' + [['recordatorio', 'Recordatorio enviado'], ['salida_sugerida', 'Hora de salida enviada'], ['mensaje_mago', 'Otro mensaje']].map(function (t) { return '<button class="btn btn-ghost btn-sm" data-ev="' + t[0] + '" data-pid="" data-busy="…">' + t[1] + '</button>'; }).join('') + '</div>';
    }
    h += '</div><div class="card"><h3>Minutos de trabajo humano</h3><p class="small muted">Registra cada bloque de trabajo del mago con su causa. Es el costo humano del piloto (I3).</p>' +
      '<div class="row"><div class="field"><label for="minActor">Quién</label><select id="minActor">' + opts([['mago', 'Mago'], ['soporte', 'Soporte'], ['tecnico', 'Técnico']]) + '</select></div><div class="field"><label for="minN">Minutos</label><input id="minN" type="number" inputmode="numeric" min="1" max="600"></div></div>' +
      '<div class="field"><label for="minCausa">Causa</label><select id="minCausa">' + opts(CAUSAS) + '</select></div><div class="field"><label for="minNota">Nota (opcional)</label><input id="minNota" type="text" maxlength="300"></div>' +
      '<div class="actions"><button class="btn btn-primary btn-sm" id="minGuardar" data-busy="Guardando…">Guardar minutos' + (p ? ' en este plan' : '') + '</button></div></div></div>';
    el.innerHTML = h;
    S.$$('[data-ev]', el).forEach(function (b) {
      b.onclick = function () { S.busy(b, function () { return S.post({ action: 'evento', key: key, plan_id: sel.plan, grupo_id: sel.grupo, pid: b.dataset.pid, tipo: b.dataset.ev, canal: 'E1' }); }).then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast('Evento registrado'); load(); }); };
    });
    S.$('#minGuardar', el).onclick = function () {
      var n = parseInt(S.$('#minN', el).value, 10); if (!(n > 0)) return S.toast('Escribe los minutos.', true);
      act(this, { action: 'operacion', plan_id: sel.plan, grupo_id: sel.grupo, experimento: (g || {}).experimento, actor: S.$('#minActor', el).value, minutos: n, causa: S.$('#minCausa', el).value, nota: S.$('#minNota', el).value }, n + ' min registrados');
    };
  }

  /* ---------- Cambios (I4) e inventario ---------- */
  function renderCambios() {
    var el = S.$('#tab-cambios'), cs = D.cambios || [];
    el.innerHTML = '<div class="grid two"><div class="card"><h3>Registrar el cambio entre W1 y W2</h3><p class="small muted">El protocolo permite <b>un solo cambio por condición</b>. Al registrarlo sube la versión de los grupos piloto de esa condición.</p>' +
      '<div class="row"><div class="field"><label for="cExp">Condición</label><select id="cExp">' + opts(['E1', 'E2']) + '</select></div><div class="field"><label for="cVer">Nueva versión</label><input id="cVer" type="text" maxlength="10" placeholder="v2"></div></div>' +
      '<div class="field"><label for="cDesc">Qué cambia y por qué</label><textarea id="cDesc" maxlength="600"></textarea></div><div class="field"><label for="cPor">Registrado por</label><input id="cPor" type="text" maxlength="40"></div>' +
      '<div class="actions"><button class="btn btn-primary btn-sm" id="cGuardar" data-busy="Guardando…">Registrar cambio</button></div></div>' +
      '<div class="card"><h3>Historial</h3>' + (cs.length ? '<table><thead><tr><th>Cond.</th><th>Versión</th><th>Descripción</th></tr></thead><tbody>' + cs.map(function (c) { return '<tr><td>' + e(c.experimento) + '</td><td>' + e(c.version) + '</td><td>' + e(c.descripcion) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="small muted">Sin cambios registrados.</p>') + '</div></div>';
    S.$('#cGuardar', el).onclick = function () {
      var exp = S.$('#cExp', el).value, ver = S.$('#cVer', el).value.trim(), d = S.$('#cDesc', el).value.trim();
      if (!ver || !d) return S.toast('Completa versión y descripción.', true);
      if (cs.some(function (c) { return c.experimento === exp; }) && !confirm('Ya hay un cambio registrado en ' + exp + '. El protocolo permite solo uno. ¿Registrar igual?')) return;
      act(this, { action: 'registrar_cambio', experimento: exp, version: ver, descripcion: d, por: S.$('#cPor', el).value }, function (r) { return r.alerta || 'Cambio registrado'; });
    };
  }
  function renderInventario() {
    var inv = D.inventario || [], pend = D.inventario_pendiente || [];
    S.$('#tab-inventario').innerHTML = '<div class="card"><h3>Inventario activo (' + inv.length + ')</h3><p class="small muted">Solo estos lugares pueden aparecer en un plan. Antes de cada fin de semana, confirma horarios y cierres.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Zona</th><th>Costo</th><th>Horario</th><th>Verificado</th></tr></thead><tbody>' +
      inv.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.categoria) + '</span></td><td>' + e(i.zona) + '</td><td>' + e(i.costo_aprox) + '</td><td>' + e(i.horario) + '</td><td class="tiny">' + e(String(i.verificado_el).slice(0, 10)) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><h3>Ronda de llamadas · por confirmar (' + pend.length + ')</h3><p class="small muted">Antes de cada fin de semana: llama, confirma que abrió tras el sismo, horario y costo, y cambia <b>estado</b> a <b>activo</b> en la hoja "inventario" (con la fecha en verificado_el). Los teléfonos marcados "sin verificar" vienen de la lista de Gemini.</p><div class="table-scroll"><table><thead><tr><th>Id</th><th>Lugar</th><th>Teléfono</th><th>Qué confirmar</th></tr></thead><tbody>' +
      pend.map(function (i) { return '<tr><td>' + e(i.id) + '</td><td>' + e(i.nombre) + '<br><span class="tiny muted">' + e(i.zona) + '</span></td><td class="small">' + e(i.telefono_para_llamar || '—') + '</td><td class="tiny">Horario: ' + e(i.horario) + '<br>Costo: ' + e(i.costo_aprox) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  }

  load();
})();
</script>
</body>
</html>
