      }
    } catch (e) { Diag.add('transición ' + p.stage, e); }
  },

  /* Acciones de la persona */
  async enviar(t, extra = {}) {
    if (!this.pid) return;
    const id = 'm' + Date.now().toString(36) + rid(3);
    const m = { id, a: 'h', uid: Me.uid, nombre: this.yo && this.yo.muestra ? this.yo.nombre : 'Alguien', t, at: Date.now(), ...extra };
    if (Store.falla.offline || !navigator.onLine) { this.cola.push(m); UI.refresh(); return m; }
    try { await Store.write(() => Store.set(`${this.base(this.pid)}/mensajes/${id}`, m)); this.errorEnvio = null; }
    catch (e) { this.errorEnvio = m; Diag.add('enviar', e); }
    UI.refresh(); return m;
  },
  async vaciarCola() { const c = this.cola.splice(0); for (const m of c) { try { await Store.set(`${this.base(this.pid)}/mensajes/${m.id}`, m); } catch (e) { this.cola.push(m); } } UI.refresh(); },
  async reintentar() { const m = this.errorEnvio; if (!m) return; this.errorEnvio = null; try { await Store.set(`${this.base(this.pid)}/mensajes/${m.id}`, m); } catch (e) { this.errorEnvio = m; } UI.refresh(); },

  async votar(k) {
    const p = this.p; if (!p || p.stage !== 'votacion') return;
    try { await Store.write(() => Store.set(`${this.base(this.pid)}/votos/${Me.uid}`, { uid: Me.uid, ronda: p.ronda, opcion: k, at: Date.now() })); }
    catch (e) { this.errorEnvio = { id: 'voto', t: 'Voté por la ' + k, reintento: () => this.votar(k) }; UI.refresh(); return; }
    await this.enviar('Voté por la ' + k);
    const v = this.votosRonda().filter(x => x.uid !== Me.uid).length + 1;
    await this.msgAI(this.pid, `ack-${Me.uid}-r${p.ronda}`, `Voto registrado. Van ${v} de ${this.activos.length}.`, 'mago');
  },
  async ninguna() {
    const p = this.p; if (!p || p.stage !== 'votacion') return;
    await Store.set(`${this.base(this.pid)}/votos/${Me.uid}`, { uid: Me.uid, ronda: p.ronda, opcion: 'ninguna', at: Date.now() });
    await this.enviar('Ninguna me sirve', { solo: Me.uid });
    await this.msgAI(this.pid, `veto-${Me.uid}-r${p.ronda}`, 'Entendido. No le digo a nadie quién fue. ¿Qué no te sirve?', 'resonador', null, Me.uid);
  },
  async cambiarVoto() { if (!this.p || this.p.stage !== 'votacion') return; await Store.del(`${this.base(this.pid)}/votos/${Me.uid}`); await this.msgAI(this.pid, `cambio-${Me.uid}-${Date.now()}`, 'Listo, vuelve a elegir en la tarjeta.', 'mago', null, Me.uid); },
  async miembro(patch) { if (this.yo) await Store.update(`${this.base(this.pid)}/miembros/${Me.uid}`, patch); },
  async guardarSobremesa(pid, ans) { await Store.set(`${this.base(pid)}/sobremesa/${Me.uid}`, { uid: Me.uid, ...ans, at: Date.now() }).catch(e => Diag.add('sobremesa', e)); },

  /* Respuestas rápidas del grupo */
  async rapida(v) {
    const p = this.p || {}, pid = this.pid, n = this.activos.length, N = this.N;
    const ai = (t, voz = 'quinto', solo = null) => this.msgAI(pid, 'r' + Date.now().toString(36) + rid(2), t, voz, null, solo);
    switch (v) {
      case 'Copiar enlace': UI.copiar(linkParche(pid)); return;
      case '¿Quién falta?': await this.enviar(v); return ai(n >= N ? 'Ya están todos. ¡Parche en sintonía!' : `Van ${n} de ${N}. Falta${N - n > 1 ? 'n' : ''} ${N - n}. Compartan el código ${pid}.`);
      case 'Cambiar mi voto': return this.cambiarVoto();
      case 'Muy lejos': case 'Muy caro': case 'No me llama':
        await Store.update(`${this.base(pid)}/votos/${Me.uid}`, { motivo: v }).catch(() => {});
        await this.enviar(v, { solo: Me.uid }); return ai('Gracias. Lo tengo en cuenta para la próxima propuesta.', 'resonador', Me.uid);
      case 'Ajustar hora': await this.enviar('¿Podemos ajustar la hora?'); return ai('Anotado. Si la mayoría quiere otra hora, la muevo al fijar el plan.', 'mago');
      case 'Me apunto': case 'No puedo': await this.miembro({ asistencia: v === 'Me apunto' ? 'si' : 'no' }); await this.enviar(v === 'Me apunto' ? '¡Me apunto!' : 'No puedo ir'); if (v === 'No puedo') return ai('Gracias por avisar. Le cuento al grupo sin detalles.', 'antena'); return;
      case 'Cómo llegar': await this.enviar(v); return ai(p.plan ? `Primera parada: ${p.plan.paradas[0][0]} (${p.plan.zona}), ${fechaCorta(p.plan.fecha)} a las ${hora12(p.plan.h, p.plan.m)}. En esta prueba no hay mapa.` : 'Cuando el plan esté fijado te paso cómo llegar.', 'antena');
      case 'Ahí estaré': case 'Ya no puedo': await this.miembro({ confirmaD1: v === 'Ahí estaré' }); return this.enviar(v);
      case 'Voy tarde': return this.enviar('Voy un poco tarde');
      case '¡Llegué!': { await this.miembro({ llego: true }); await this.enviar('¡Llegué!'); const k = this.activos.filter(m => m.llego || m.uid === Me.uid).length; return this.msgAI(pid, 'llegados', k === 1 ? '¡Ya llegó el primero! Los demás vienen en camino.' : `¡Ya llegaron ${k}! Disfruten.`, 'antena'); }
      case 'Guardar en mis parches': if (!Yo.doc.guardados.some(g => g.pid === pid) && Yo.doc.guardados.length < 4) { Yo.doc.guardados.push({ pid, titulo: p.nombre }); await Yo.guardar(); } UI.aviso('Guardado en Mis parches.'); return;
      case 'Otra idea': await this.enviar('¿Y si armamos otra?'); return ai('Cuando quieran, armo otro plan con este mismo grupo.', 'gramola');
      case 'Dar 24 h más': await Store.update(this.base(pid), { stage: 'reclutando', plazo: Date.now() + 24 * 3600e3 }); return ai('Listo, 24 horas más para que se unan.', 'estatica');
      case 'Seguir con los que estamos': if (n < 2) { await Store.update(this.base(pid), { stage: 'reclutando', plazo: Date.now() + 24 * 3600e3 }); return ai('Para un plan hacen falta al menos 2 personas. Les doy 24 horas más.', 'estatica'); } await Store.update(this.base(pid), { stage: 'reclutando', quorum: n, plazo: Date.now() + 24 * 3600e3 }); return ai(`Seguimos con ${n}. Ya les propongo planes.`, 'estatica');
      case 'Cancelar el plan': await Store.update(this.base(pid), { stage: 'cancelado' }); return ai('Plan cancelado. Cuando quieran, lo intentamos de nuevo.', 'estatica');
      case 'Armar otro plan': UI.ir('sintonia'); return S1.iniciar('organiza', 'A1');
      case '¿Y si llueve?': case 'Ver mapa': default: return this.libre(v, true);
    }
  },
  /* Texto libre en el grupo: Sintonía responde si la nombran o si es una pregunta rápida */
  async libre(t, rapida = false) {
    if (/^\s*salir\s*$/i.test(t)) { await this.enviar(t, { solo: Me.uid }); UI.abrirSalir(); return; }
    await this.enviar(t);
    if (!rapida && !/sinton[ií]a/i.test(t)) return;
    const p = this.p || {};
    const ctx = { canal: 'chat del grupo', parche: p.nombre, etapa: ETAPA_TXT[p.stage], quorum: `${this.activos.length} de ${this.N}`, opciones: (p.opciones || []).map(o => `${o.titulo} (${detalleOpcion(o)})`), plan: p.plan ? `${p.plan.titulo}, ${fechaCorta(p.plan.fecha)} ${hora12(p.plan.h, p.plan.m)}, ${p.plan.zona}; paradas: ${p.plan.paradas.map(x => x[0]).join(', ')}` : null, persona: this.yo && this.yo.muestra ? this.yo.nombre : undefined, nota: 'Contenido de prueba interna: los lugares son ejemplos.' };
    const hist = this.mensajes.filter(m => !m.solo).slice(-10).map(m => ({ quien: m.a === 'ai' ? 'Sintonía' : (m.nombre || 'Alguien'), texto: m.t }));
    this.pendIA = true; UI.refresh();
    let r = await IA.responder(ctx, hist, t);
    this.pendIA = false;
    if (!r) r = t === '¿Y si llueve?' ? 'Si llueve, les propongo una alternativa bajo techo antes de la hora del plan.' : t === 'Ver mapa' ? `En esta prueba no hay mapa. Las zonas: ${(p.opciones || []).map(o => o.zona).join(', ') || 'aún sin opciones'}.` : 'Te leo. Si necesitas algo del plan, escríbeme «Sintonía…» o toca «Habla con un humano».';
    await this.msgAI(this.pid, 'ia' + Date.now().toString(36) + rid(2), r, p.stage === 'fijado' ? 'antena' : 'quinto');
  },
  async salirYBorrar() {
    const pid = this.pid; if (!pid) return;
    const b = this.base(pid);
    await Store.del(`${b}/votos/${Me.uid}`).catch(() => {});
    await Store.del(`${b}/sobremesa/${Me.uid}`).catch(() => {});
    await Store.del(`${b}/miembros/${Me.uid}`).catch(() => {});
    for (const m of this.mensajes.filter(m => m.uid === Me.uid || m.solo === Me.uid || m._id === 'join-' + Me.uid)) await Store.del(`${b}/mensajes/${m._id}`).catch(() => {});
    await this.msgAI(pid, 'salida-' + Date.now().toString(36), 'Alguien salió del parche.', 'guardiana');
    Yo.doc.parches = Yo.doc.parches.filter(x => x !== pid); Yo.doc.organizo = Yo.doc.organizo.filter(x => x !== pid); Yo.doc.guardados = Yo.doc.guardados.filter(g => g.pid !== pid); delete Yo.doc.sobremesa[pid];
    await Yo.guardar();
  },
};

/* ── 07 · Pantallas y eventos ─────────────────────────────────────────────── */
const Lista = { // parches de «Mis sintonías» y «Chats»
  docs: {}, unsubs: {},
  sync() {
    const want = new Set(Yo.doc ? Yo.doc.parches : []);
    Object.keys(this.unsubs).forEach(pid => { if (!want.has(pid)) { this.unsubs[pid](); delete this.unsubs[pid]; delete this.docs[pid]; } });
    want.forEach(pid => { if (!this.unsubs[pid]) this.unsubs[pid] = Store.watchDoc('parches/' + pid, d => { if (d) this.docs[pid] = d; else delete this.docs[pid]; UI.refresh(); }); });
  },
};

const Soporte = {
  uid: null, msgs: [], un: null,
  abrir(uid) { if (this.uid === uid) return; this.cerrar(); this.uid = uid; this.un = Store.watchCol(`soporte/${uid}/mensajes`, l => { this.msgs = l.sort((a, b) => a.at - b.at); UI.refresh(); }); },
  cerrar() { if (this.un) this.un(); this.un = null; this.uid = null; this.msgs = []; },
  async escribir(uid, t, a, nombre) {
    const id = 'm' + Date.now().toString(36) + rid(3);
    await Store.set(`soporte/${uid}/mensajes/${id}`, { id, a, t, at: Date.now(), nombre: nombre || '' });
    const meta = { id: uid, uid, nombre: a === 'h' ? nombre : undefined, ultimo: t.slice(0, 80), at: Date.now(), deEquipo: a === 'eq' };
    Object.keys(meta).forEach(k => meta[k] === undefined && delete meta[k]);
    await Store.update(`soporte/${uid}`, meta).catch(() => Store.set(`soporte/${uid}`, meta));
  },
};

const UI = {
  view: 'sintonia', pid: null, tab: 0, sheet: false, toast: null, cargando: false, vistaPrevia: null,
  el: null, _raf: 0, _timer: null, _escT: null, temp: {},

  hist: [],
  ir(v, pid, atras) {
    if (!atras && (this.view !== v || (pid && pid !== this.pid))) { this.hist.push([this.view, this.pid]); if (this.hist.length > 30) this.hist.shift(); }
    this.view = v; if (pid) this.pid = pid;
    if (v === 'grupo' && this.pid) { Grupo.abrir(this.pid); Grupo.sel = (Grupo.miVoto && typeof Grupo.miVoto.opcion === 'number') ? Grupo.miVoto.opcion : 1; }
    if (v === 'humano') Soporte.abrir(Me.uid);
    this.sheet = false; this.build();
  },
  atras() { let prev; while ((prev = this.hist.pop()) && prev[0] === this.view && prev[1] === this.pid) {} return prev ? this.ir(prev[0], prev[1], true) : this.ir('chats', null, true); },
  aviso(t, accion, fn) { this.toast = { t, accion, fn }; clearTimeout(this._tt); this._tt = setTimeout(() => { this.toast = null; this.refresh(); }, 5000); this.refresh(); },
  async copiar(texto) {
    try { await navigator.clipboard.writeText(texto); this.aviso('Copiado: ' + texto); }
    catch (e) { this.aviso('Copia esto: ' + texto); }
  },
  abrirSalir() { this.sheet = true; this.refresh(); },

  refresh() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; this.paint(); }); },

  /* Estructura de la pantalla: cabecera + cuerpo + compositor. Se reconstruye al cambiar de vista. */
  build() {
    const ph = this.el; ph.innerHTML = ''; ph.removeAttribute('data-panel');
    const panel = ['chats', 'mis', 'perfil'].includes(this.view);
    if (panel) ph.setAttribute('data-panel', '');
    ph.innerHTML = panel ? `<div class="scroll" data-slot="body"></div><div data-slot="nav">${P.nav(this.view)}</div><div data-slot="over"></div>`
      : `<div data-slot="head"></div><div class="s-thread" role="log" aria-live="polite" data-slot="body"></div><div data-slot="comp"></div><div data-slot="over"></div>`;
    this._last = {}; this.paint(true);
  },
  slot(n) { return this.el.querySelector(`[data-slot="${n}"]`); },
  put(n, html) { const s = this.slot(n); if (s && this._last[n] !== html) { s.innerHTML = html; this._last[n] = html; return true; } return false; },

  paint(force) {
    if (!this.el) return;
    if (this.cargando || !Yo.doc) { this.put('body', P.att(P.valves(1))); return; }
    const v = this.view;
    if (v === 'sintonia') this.pSintonia();
    else if (v === 'grupo') this.pGrupo();
    else if (v === 'humano') this.pHumano();
    else if (v === 'chats') this.pChats();
    else if (v === 'mis') this.pMis();
    else if (v === 'perfil') this.pPerfil();
    this.put('over', (this.sheet ? `<div class="sheet-scrim" data-act="salir-no-fondo">${P.sheet()}</div>` : '') + (this.toast ? `<div class="toast">${P.banner(this.toast.t, '', 'progress').replace('</div></div>', `</div>${this.toast.accion ? `<button class="s-button" data-size="sm" data-style="secondary" data-act="toast">${esc(this.toast.accion)}</button>` : ''}</div>`)}</div>` : ''));
    Team.paint(); swapAvatars();
  },

  /* Hilo con reconciliación por clave (no se pierde el scroll ni el foco) */
  thread(items) {
    const box = this.slot('body'); if (!box) return;
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    const prevCount = box.children.length;
    const keys = new Set(items.map(i => i.k));
    [...box.children].forEach(c => { if (!keys.has(c.dataset.k)) c.remove(); });
    items.forEach((it, idx) => {
      let el = box.querySelector(`:scope > [data-k="${CSS.escape(it.k)}"]`);
      if (!el) { el = document.createElement('div'); el.dataset.k = it.k; el.style.display = 'contents'; }
      if (el.dataset.h !== it.h) { el.innerHTML = it.h; el.dataset.h = it.h; }
      if (box.children[idx] !== el) box.insertBefore(el, box.children[idx] || null);
    });
    if (near || prevCount === 0 || items.length > prevCount) requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  },
  sepDia(at, prev) { const d = new Date(at).toDateString(); if (prev && new Date(prev).toDateString() === d) return null; const hoy = new Date(); const ay = new Date(Date.now() - 864e5); return d === hoy.toDateString() ? 'Hoy' : d === ay.toDateString() ? 'Ayer' : fechaCorta(at); },

  /* ── 1:1 Sintonía ── */
  pSintonia() {
    const st = S1.st, paso = S1.paso;
    this.put('head', P.head({ titulo: 'Sintonía', sub: 'IA · una persona revisa', voz: (paso && paso.voz) || 'quinto', alAire: true, escribiendo: S1.pendienteIA ? 'Sintonía' : null }));
    const items = []; let prev = null;
    st.log.forEach(m => {
      const s = this.sepDia(m.at, prev); if (s) items.push({ k: 'd' + m.at, h: P.sep(s) }); prev = m.at;
      let h = m.a === 'ai' ? P.ai(m.t, horaMsg(m.at), m.voz) : P.me(m.t, horaMsg(m.at));
      if (m.att) h += P.att(this.adjunto1a1(m.att));
      items.push({ k: m.id, h });
    });
    this.thread(items);
    let chips = [], modo = null;
    if (paso && paso.input && !S1.pendienteIA) {
      const t = paso.input.type, ops = paso.input.options ? (typeof paso.input.options === 'function' ? paso.input.options(S1.ctx()) : paso.input.options) : [];
      if (t === 'chips' || t === 'text' || t === 'toggles' || t === 'invite') chips = ops.map(o => [o, o === 'Continuar' || o === 'Abrir el chat del grupo', 'paso']);
      /* El dial ya tiene un valor: se confirma con OK desde el inicio; moverlo no cambia el botón. */
      if (t === 'dial') modo = 'ok';
      else if (t === 'multi' || t === 'toggles') modo = this.temp.tocado === st.step ? 'ok' : 'sel';
      if (t === 'toggles') chips = chips.filter(c => c[0] !== 'Continuar');
    }
    this.compositor(chips, modo === 'ok' ? 'Toca OK para confirmar' : 'Escribe a Sintonía', false, modo);
  },
  adjunto1a1(att) {
    const activo = att.step === S1.st.step, p = PASOS[att.step] || {}, inp = p.input || {}, a = S1.st.ans;
    if (att.type === 'multi') { const sel = activo ? (this.temp[inp.key] || []) : (a[inp.key] || []); return P.chips(inp.options.map(o => [o, sel.includes(o), activo ? 'multi' : 'nada']), 'multi'); }
    if (att.type === 'band') return P.band(a[inp.key] || (activo ? null : 'tarde'), !activo);
    if (att.type === 'dial') { const v = activo ? (this.temp[inp.key] || inp.def || 3) : (a[inp.key] || inp.def || 3); return P.energy(inp.q, v, !activo); }
    if (att.type === 'toggles') { const c = (activo ? a.consent : (a.consent || Yo.doc.consent)) || { wa: false, nom: false, mej: false }; return `<div style="display:grid;gap:8px">${P.toggle('Recibir el plan por WhatsApp', c.wa, 'wa', !activo)}${P.toggle('Mostrar mi nombre al grupo', c.nom, 'nom', !activo)}${P.toggle('Usar mis respuestas para mejorar', c.mej, 'mej', !activo)}</div>`; }
    if (att.type === 'invite') { const pid = S1.st.pid; return pid ? P.invite(pid, ARTIFACT_URL ? linkParche(pid) : '') : P.valves(2); }
    return '';
  },

  /* ── Grupo ── */
  pGrupo() {
    const G = Grupo, p = G.p;
    if (!G.listo) { this.put('head', P.head({ grupo: true, titulo: 'Parche', sub: 'Conectando…' })); this.thread([{ k: 'cargando', h: P.att(P.valves(1)) }]); this.compositor([], 'Escribe al grupo', true); return; }
    if (!p) { this.put('head', P.head({ grupo: true, titulo: 'Parche no encontrado', sub: '' })); this.thread([{ k: 'nf', h: P.ai('No encuentro este parche. Puede que lo hayan borrado.', horaMsg(Date.now()), 'estatica') }]); this.compositor([], '', true); return; }
    const n = G.activos.length, N = G.N, yo = G.yo;
    const vr = G.votosRonda();
    const station = { reclutando: { state: 'searching', text: `Buscando señal · ${n}/${N}` }, sinquorum: { state: 'searching', text: `Sin quórum · ${n}/${N}` }, votacion: { state: 'live', text: `Votación abierta · ${vr.length}/${n}` }, fijado: p.plan ? { state: 'fixed', text: `Plan fijado · ${fechaCorta(p.plan.fecha)}, ${hora12(p.plan.h, p.plan.m)}` } : null, encurso: { state: 'fixed', text: 'Plan en curso · hoy' } }[p.stage] || null;
    const typing = G.pendIA || p.stage === 'resolviendo' ? 'Sintonía' : (Live.escribiendo(Me.uid)[0] || null);
    const offline = Store.falla.offline || !navigator.onLine;
    this.put('head', P.head({ grupo: true, titulo: p.nombre, sub: `${n} persona${n === 1 ? '' : 's'} · Sintonía (IA)`, station: offline ? { state: 'searching', text: 'Sin señal · reintentando' } : station, escribiendo: typing }));
    const items = []; let prev = null;
    if (!yo) items.push({ k: 'nomiembro', h: P.ai('Aún no estás en este parche. Si te invitaron, entra con el código.', horaMsg(Date.now()), 'quinto') + P.att(P.btn('Unirme a este parche', 'unirme', p.id)) });
    const vis = G.mensajes.filter(m => !m.solo || m.solo === Me.uid);
    [...vis, ...G.cola.map(m => ({ ...m, _cola: true }))].forEach(m => {
      const s = this.sepDia(m.at, prev); if (s) items.push({ k: 'd' + m.at, h: P.sep(s) }); prev = m.at;
      let h;
      if (m.a === 'ai') h = P.ai(m.t, horaMsg(m.at), m.voz);
      else if (m.uid === Me.uid) h = P.me(m.t, horaMsg(m.at), m._cola ? 'cola' : 'ok');
      else h = P.member(m.nombre || 'Alguien', m.t, horaMsg(m.at));
      if (m.att) h += P.att(this.adjuntoGrupo(m));
      items.push({ k: m._id || m.id, h });
    });
    if (G.errorEnvio) items.push({ k: 'err', h: P.me(G.errorEnvio.t, horaMsg(Date.now()), 'err') + P.att(P.banner('No se pudo enviar', ' Toca «Reintentar». Tu mensaje sigue aquí.')) });
    if (offline) items.push({ k: 'off', h: P.ai('Se fue la señal. No pasa nada: guardo lo que escribas y lo envío apenas vuelva.', horaMsg(Date.now()), 'estatica') + P.att(P.display('off', 'Sin señal · reintentando', '--:--', 'SIN CONEXIÓN')) });
    this.thread(items);
    this.compositor(this.chipsGrupo(), offline ? 'Sin conexión · se envía al volver' : 'Escribe al grupo', !yo);
    clearTimeout(this._timer);
    if (p.stage === 'resolviendo') this._timer = setTimeout(() => { this._last.body = null; this.refresh(); }, 1000);
  },
  adjuntoGrupo(m) {
    const G = Grupo, p = G.p, a = m.att;
    if (a.type === 'quorum') { const vivo = m._id === G.mensajes.filter(x => x.att && x.att.type === 'quorum').slice(-1)[0]?._id; return P.quorum(vivo ? G.activos.length : a.n, G.N); }
    if (a.type === 'vote') {
      const actual = p.stage === 'votacion' && p.ronda === a.ronda;
      if (!actual) { const plan = p.plan; const k = plan && a.ronda === p.ronda ? (a.opciones.findIndex(o => o.id === plan.id) + 1) : 1; return P.vote(a.opciones, k || 1, { cerrada: true, fijo: !!plan && a.ronda === p.ronda, nota: plan && a.ronda === p.ronda ? `Ganó «${plan.titulo}».` : 'Ronda cerrada.' }); }
      const mv = G.miVoto; const vr = G.votosRonda();
      if (mv) return mv.opcion === 'ninguna' ? P.vote(a.opciones, G.sel, { votado: `Dijiste «Ninguna me sirve». Van ${vr.length} de ${G.activos.length}.` }) : P.vote(a.opciones, mv.opcion, { votado: `Votaste por la ${mv.opcion}. Van ${vr.length} de ${G.activos.length}.` });
      return P.vote(a.opciones, G.sel, {});
    }
    if (a.type === 'valves') { const step = p.stage === 'resolviendo' ? Math.min(3, 1 + Math.floor((Date.now() - m.at) / 2000)) : 3; return P.valves(step); }
    if (a.type === 'plan') return P.plan(a.plan, p.stage === 'encurso' ? 'cur' : p.stage === 'sobremesa' ? 'done' : '') + (m._id === 'plan' && p.stage === 'fijado' && G.yo ? P.apuntas(G.yo.asistencia) : '') + (m._id === 'plan' ? P.quorum(Math.min(a.n, G.activos.length) || a.n, a.N) : '');
    if (a.type === 'countdown') { const d = Math.max(0, (p.plan ? p.plan.fecha : Date.now()) - Date.now()); const hh = Math.min(99, Math.floor(d / 3600e3)), mm = Math.floor(d % 3600e3 / 60e3); return P.display('countdown', 'Faltan · h:min', `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, 'PARA EL PLAN'); }
    if (a.type === 'time') return p.plan ? P.display('time', `Salida · ${fechaCorta(p.plan.fecha)}`, hora12(p.plan.h, p.plan.m).split(' ')[0], hora12(p.plan.h, p.plan.m).split(' ').slice(1).join(' ').toUpperCase()) : '';
    if (a.type === 'cierre') return (p.plan ? P.plan(p.plan, 'done') : '') + (G.yo ? P.reencuentro(G.yo.repetir) : '');
    return '';
  },
  chipsGrupo() {
    const G = Grupo, p = G.p, yo = G.yo || {};

    const err = G.errorEnvio ? [['Reintentar', true, 'reintentar']] : [];

      reclutando: org ? [['Copiar enlace', true], '¿Quién falta?'] : ['¿Quién falta?'],

      fijado: p.recordatorio && yo.confirmaD1 === undefined ? [['Ahí estaré', true], 'Ya no puedo'] : ['Cómo llegar', '¿Y si llueve?'],

        case 'bot': { const used = new Set(G.miembros.map(m => m.nombre)); const nom = NOMBRES_SIM.find(x => !used.has(x)) || ('Sim' + rid(2)); const uid = 'bot-' + rid(4);
          await Store.set(`${b}/miembros/${uid}`, { id: uid, uid, nombre: nom, muestra: true, consent: { wa: true, nom: true, mej: true }, rol: 'invitado', bot: true, restr: [], franja: p.franja || 'tarde', unido: Date.now() });

        case 'botsvotan': case 'botninguna': {

            await Store.set(`${b}/votos/${m.uid}`, { uid: m.uid, ronda: p.ronda, opcion: op, at: Date.now() });
            if (op !== 'ninguna') await Store.set(`${b}/mensajes/b${Date.now().toString(36)}${rid(2)}`, { id: 'b' + rid(6), a: 'h', uid: m.uid, nombre: m.nombre, t: 'Voté por la ' + op, at: Date.now() });

        case 'cerrar-voto': if (p.stage === 'votacion') { await Store.update(b, { stage: 'resolviendo', cierreAt: Date.now() }); await G.msgAI(p.id, 'cierre-r' + p.ronda, 'Cerró la votación. Estoy revisando con el equipo.', 'mago', { type: 'valves' }); } break;

        case 'd': if (p.plan) { await Store.update(b, { stage: 'sobremesa' }); await G.msgAI(p.id, 'cierre-plan', `¡Gracias por venir a «${p.plan.titulo}»! Les escribo en privado para saber cómo les fue.`, 'gramola', { type: 'cierre' }); } else UI.aviso('Primero fija un plan.'); break;
        case 'reset': { const vs = await Store.list(`${b}/votos`); for (const x of vs) await Store.del(`${b}/votos/${x._id}`); for (const m of G.mensajes) if (/^(opciones-|cierre-|plan$|veto|ack-|recordatorio$|dia$|llegados$|sinquorum-|cambio-)/.test(m._id || '')) await Store.del(`${b}/mensajes/${m._id}`); await Store.update(b, { stage: 'reclutando', ronda: 0, opciones: [], plan: null, recordatorio: false, plazo: Date.now() + 48 * 3600e3 }); break; }
        case 'borrar': { for (const c of ['mensajes', 'votos', 'miembros', 'sobremesa']) { const l = await Store.list(`${b}/${c}`); for (const x of l) await Store.del(`${b}/${c}/${x._id}`); } await Store.del(b); Yo.doc.parches = Yo.doc.parches.filter(x => x !== p.id); Yo.doc.organizo = Yo.doc.organizo.filter(x => x !== p.id); await Yo.guardar(); UI.ir('chats'); break; }
        case 'paso': UI.ir('sintonia'); { const f = v[0] === 'B' ? 'invitado' : v[0] === 'D' ? 'D' : 'organiza'; const extra = v[0] === 'B' || v[0] === 'D' ? { pid: S1.st.pid || G.pid || Yo.doc.parches[0], parche: G.p ? { nombre: G.p.nombre, org: G.p.orgNombre, titulo: G.p.plan ? G.p.plan.titulo : G.p.nombre } : null } : {}; if ((v[0] === 'B' || v[0] === 'D') && !extra.pid) { UI.aviso('Primero abre o crea un parche.'); break; } await S1.iniciar(f, v, extra); } break;
        case 'ir': UI.ir(v); break;

        case 'hilo': this.verHilo(v); break;

      }
    } catch (e) { Diag.add('panel ' + a, e); }
    this._h = ''; this.paint(); UI.refresh();
  },
};

/* ── 09 · Arranque y eventos ─────────────────────────────────────────────── */
const conTiempo = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(() => r(null), ms))]);

async function borrarTodo() {
  for (const pid of [...Yo.doc.parches]) {
    const b = 'parches/' + pid;
    for (const c of ['votos', 'sobremesa', 'miembros']) await Store.del(`${b}/${c}/${Me.uid}`).catch(() => {});
  }
  await Store.del(Yo.path).catch(() => {});
  Grupo.cerrar(); Yo.doc = Yo.def(); await Yo.guardar();
  UI.ir('sintonia'); await S1.mostrar();
}

async function actualizarConsent(c) {
  Yo.doc.consent = c; await Yo.guardar();
  for (const pid of Yo.doc.parches) await Store.update(`parches/${pid}/miembros/${Me.uid}`, { consent: { ...c }, muestra: !!c.nom }).catch(() => {});
}

async function abrirInvitacion(pid) {
  pid = pid.toUpperCase();
  if (Yo.doc.parches.includes(pid)) return UI.ir('grupo', pid);
  const p = await Store.get('parches/' + pid).catch(() => null);
  UI.ir('sintonia');
  if (!p) { await S1.decir([`No encuentro el parche ${pid}. Pídele a quien te invitó que te pase el código otra vez.`], 'estatica'); return; }
  await S1.iniciar('invitado', 'B1a', { pid, parche: { nombre: p.nombre, org: p.orgNombre } });
}

document.addEventListener('click', async e => {
  const t = e.target;
  const team = t.closest('[data-team]');
  if (team) { if (team.tagName === 'INPUT') return; e.preventDefault(); return Team.accion(team.dataset.team, team.dataset.v); }
  if (t.closest('.team-fab')) { Team.abierto = !Team.abierto; Team.paint(); return; }
  const el = t.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (el.tagName === 'FORM') return;
  if (act === 'salir-no-fondo') { if (t === el) { UI.sheet = false; UI.refresh(); } return; }
  e.preventDefault();
  const paso = S1.paso;
  switch (act) {
    case 'back': return UI.atras();
    case 'humano': return UI.ir('humano');
    case 'ir': return UI.ir(v);
    case 'reply': return UI.view === 'grupo' ? Grupo.rapida(v) : null;
    case 'paso': if (!paso) return; if (paso.input.type === 'toggles' && v === 'Continuar') S1.st.ans.consent = { wa: false, nom: false, mej: false, ...(S1.st.ans.consent || {}) }; return S1.responder(v, paso.input.type === 'invite' && v === 'Copiar enlace' ? null : v);
    case 'apuntar': return Grupo.rapida(v === 'si' ? 'Me apunto' : 'No puedo');
    case 'repetir': { const t = { si: 'Sí, repitamos', 'tal-vez': 'Tal vez repetimos', no: 'Ahora no' }[v]; await Grupo.miembro({ repetir: v, repetirAt: Date.now() }); return Grupo.enviar(t); }
    case 'paso-listo': return pasoListo();
    case 'multi': { const k = paso && paso.input.key; if (!k) return; UI.temp.tocado = S1.st.step; const cur = UI.temp[k] || []; UI.temp[k] = cur.includes(v) ? cur.filter(x => x !== v) : (v === 'Nada especial' ? ['Nada especial'] : [...cur.filter(x => x !== 'Nada especial'), v]); UI._last.body = null; return UI.refresh(); }
    case 'band': if (UI.view === 'sintonia' && paso && paso.input.type === 'band') { const f = FRANJAS.find(x => x.id === v); S1.st.ans[paso.input.key] = v; return S1.responder(v, `${f.b[0] + f.b.slice(1).toLowerCase()} · ${f.s}`); } return;
    case 'toggle': {
      const k = el.dataset.k;
      if (k === 'compartir') return Grupo.miembro({ compartir: !(Grupo.yo && Grupo.yo.compartir) });
      if (k.startsWith('p-')) { const c = { ...Yo.doc.consent }; c[k.slice(2)] = !c[k.slice(2)]; return actualizarConsent(c); }
      const c = { wa: false, nom: false, mej: false, ...(S1.st.ans.consent || {}) }; c[k] = !c[k]; S1.st.ans.consent = c; UI.temp.tocado = S1.st.step; UI._last.body = null; return UI.refresh();
    }
    case 'pick': Grupo.sel = +v; UI._last.body = null; return UI.refresh();
    case 'rail': { const r = el.getBoundingClientRect(); Grupo.sel = Math.max(1, Math.min(3, Math.round((e.clientX - r.left) / r.width * 2) + 1)); return UI.refresh(); }
    case 'votar': return Grupo.votar(+v);
    case 'ninguna': return Grupo.ninguna();
    case 'copiar': return UI.copiar(v);
    case 'unirme': return abrirInvitacion(v);
    case 'organizar': UI.ir('sintonia'); return S1.iniciar('organiza', 'A1');
    case 'codigo': UI.ir('sintonia'); return S1.iniciar('invitado', 'B0');
    case 'abrir': return UI.ir('grupo', v);
    case 'tab': UI.tab = +v; return UI.refresh();
    case 'salir': return UI.abrirSalir();
    case 'salir-no': UI.sheet = false; return UI.refresh();
    case 'salir-si': UI.sheet = false; if (UI.view === 'grupo') { await Grupo.salirYBorrar(); UI.aviso('Saliste del parche y se borraron tus respuestas.'); return UI.ir('mis'); } return borrarTodo();
    case 'toast': { const f = UI.toast && UI.toast.fn; UI.toast = null; UI.refresh(); return f && f(); }
    case 'reintentar': { const er = Grupo.errorEnvio; if (er && er.reintento) { Grupo.errorEnvio = null; return er.reintento(); } return Grupo.reintentar(); }
  }
});

async function pasoListo() {
  const paso = S1.paso; if (!paso) return; const k = paso.input.key;
  if (paso.input.type === 'multi') { const val = UI.temp[k] || []; S1.st.ans[k] = val; UI.temp[k] = []; return S1.responder(val, val.length ? val.join(', ') : 'Nada en especial'); }
  if (paso.input.type === 'dial') { const val = +(UI.temp[k] || paso.input.def || 3); UI.temp[k] = null; return S1.responder(val, `${ENERGIA[val - 1]} · ${val} de 5`); }
}
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.teamForm === 'alias') { Me.setAlias(f.alias.value.trim()); location.reload(); return; }
  if (f.dataset.teamForm === 'responder') { const t = f.t.value.trim(); if (!t || !Team.sel) return; f.t.value = ''; await Soporte.escribir(Team.sel, t, 'eq', 'Equipo de Sintonía'); return; }
  if (f.dataset.act === 'nombre') { const n = f.n.value.trim().split(' ')[0].slice(0, 20); if (!n) return; Yo.doc.nombre = n; await Yo.guardar(); for (const pid of Yo.doc.parches) await Store.update(`parches/${pid}/miembros/${Me.uid}`, { nombre: n }).catch(() => {}); UI.aviso('Nombre guardado.'); UI._last.body = null; return UI.refresh(); }
  if (f.dataset.act === 'enviar') {
    const inp = f.m; const t = inp.value.trim();
    if (!t && f.hasAttribute('data-sel') && UI.view === 'sintonia') { const pz = S1.paso; if (pz && pz.input.type === 'toggles') { S1.st.ans.consent = { wa: false, nom: false, mej: false, ...(S1.st.ans.consent || {}) }; return S1.responder('Continuar', 'Continuar'); } return pasoListo(); }
    if (!t) return; inp.value = '';
    Live.marcar({ uid: Me.uid, nombre: Yo.doc.nombre, escribiendo: false });
    if (UI.view === 'sintonia') return S1.texto(t);
    if (UI.view === 'grupo') return Grupo.libre(t);
    if (UI.view === 'humano') return Soporte.escribir(Me.uid, t, 'h', Yo.doc.nombre || 'Persona');
  }
});

function marcarTexto(inp) { const f = inp.form; if (!f) return; const tx = !!inp.value.trim(); f.toggleAttribute('data-texto', tx); const b = f.querySelector('.s-send'); if (b) b.setAttribute('aria-label', f.hasAttribute('data-ok') && !tx ? 'OK, confirmar' : 'Enviar'); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'm' && t.form && t.form.dataset.act === 'enviar') marcarTexto(t);
  if (t.matches('input[type="range"][data-act="dial"]')) { const k = S1.paso && S1.paso.input.key; const v = +t.value; if (k) UI.temp[k] = v; const d = t.closest('.e-dial'); if (d) { d.querySelector('[data-e="scale"]').style.setProperty('--f', (v - 1) / 4); d.querySelector('[data-e="val"]').textContent = ENERGIA[v - 1]; d.querySelectorAll('.e-marks i').forEach((i, j) => i.toggleAttribute('data-on', j < v)); } t.setAttribute('aria-valuetext', `${ENERGIA[v - 1]}, ${v} de 5`); return; }
  if (UI.view === 'grupo' && t.name === 'm') { Live.marcar({ uid: Me.uid, nombre: Grupo.yo ? (Grupo.yo.muestra ? Grupo.yo.nombre : 'Alguien') : '', escribiendo: true }); clearTimeout(UI._escT); UI._escT = setTimeout(() => Live.marcar({ uid: Me.uid, nombre: '', escribiendo: false }), 2500); }
});
document.addEventListener('change', e => { const t = e.target; if (t.matches('input[type="checkbox"][data-team]')) Team.accion(t.dataset.team); });
document.addEventListener('keydown', e => {
  const s = e.target.closest && e.target.closest('.s-dial-vote[data-act="rail"]'); if (!s) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { Grupo.sel = Math.min(3, Grupo.sel + 1); e.preventDefault(); UI.refresh(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { Grupo.sel = Math.max(1, Grupo.sel - 1); e.preventDefault(); UI.refresh(); }
});
addEventListener('online', () => { Grupo.vaciarCola(); UI.refresh(); });
addEventListener('offline', () => UI.refresh());
mqDark.addEventListener('change', swapAvatars);
new MutationObserver(swapAvatars).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('hashchange', () => { const m = location.hash.match(/^#p-([A-Za-z0-9]{6})$/); if (m && Yo.doc) abrirInvitacion(m[1]); });
setInterval(() => { if (['mis', 'grupo'].includes(UI.view)) { UI._last.body = null; UI.refresh(); } }, 30000);

(async () => {
  UI.el = document.getElementById('phone'); UI.cargando = true; UI.build();
  await Promise.all([conTiempo(Me.init(), 6000), conTiempo(IA.init(), 6000), conTiempo(Live.init(), 6000), conTiempo(Store.init(), 8000)]);
  if (!Me.base) { Me.base = ls.get('sintonia-e3-uid') || ('local-' + rid(8)); ls.set('sintonia-e3-uid', Me.base); }
  Store.ready = true;
  await Yo.cargar();
  Team.init(document.getElementById('team'));
  UI.cargando = false; Lista.sync();
  const m = location.hash.match(/^#p-([A-Za-z0-9]{6})$/);
  if (m) return abrirInvitacion(m[1]);
  if (Yo.doc.s1.flow === 'inicio' && !Yo.doc.s1.log.length) { UI.ir('sintonia'); UI.hist = []; return S1.mostrar(); }
  UI.ir(Yo.doc.parches.length ? 'mis' : 'sintonia'); UI.hist = [];
})();

})();
</script>
