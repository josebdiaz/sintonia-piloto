.t-data-display { font-family: var(--font-family-mono); font-size: var(--font-size-40, 40px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.t-data-display-xl { font-family: var(--font-family-mono); font-size: var(--font-size-64, 64px); font-weight: 800; line-height: 1.0; letter-spacing: -0.03em; }

/* Sintonía DS 3.0 · base
   Requiere tokens/tokens.css antes de este archivo.
   Reset mínimo, tipografía, foco visible (WCAG 2.4.7 / 2.4.13), objetivo táctil y movimiento reducido. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-bg-canvas);
  color: var(--color-text-primary);
  font-family: var(--font-family-sans);
  font-size: var(--font-size-16);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, figure, ol, ul, fieldset { margin: 0; }
fieldset { border: 0; padding: 0; min-width: 0; }
ol, ul { padding: 0; list-style: none; }
a { color: var(--color-text-brand); text-underline-offset: 0.18em; }
h1, h2, h3 { text-wrap: balance; }

/* Foco: anillo de 2 px con 2 px de separación, token border/focus. Nunca se quita sin reemplazo. */
:focus { outline: none; }
:focus-visible {
  outline: var(--stroke-2) solid var(--color-border-focus);
  outline-offset: 2px;
}

/* Utilidades de accesibilidad */
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.s-icon { width: var(--size-icon-lg); height: var(--size-icon-lg); flex: none; }
.s-icon[data-size="md"] { width: var(--size-icon-md); height: var(--size-icon-md); }
.s-icon[data-size="sm"] { width: var(--size-icon-sm); height: var(--size-icon-sm); }

/* Movimiento: onda, válvulas y aguja se detienen (2.2.2 · 2.3.3) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Sintonía DS 3.0 · componentes (v3.1 · alineados con «Convergencias visuales»)
   Un bloque por componente de Figma (página entre paréntesis). Variantes → data-*; estados → :hover, :active, aria-*.
   Solo tokens: si falta un valor, se crea en Figma y se exporta. */

/* ═════════ Controles ═════════ */

/* Button · Style=Primary|Accent|Secondary|Danger · Size=Medium|Small · State=Default|Hover|Disabled|Loading
   <button class="s-button" data-style="primary" data-size="md"> — píldora; Medium 48 px, Small 36 px */
.s-button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8);
  height: var(--size-control-md); padding: var(--space-12) var(--space-18);
  border: var(--stroke-1-5) solid transparent; border-radius: var(--radius-full);
  background: var(--color-bg-brand); color: var(--color-text-on-brand);
  font: 700 var(--font-size-16)/1.25 var(--font-family-sans); text-decoration: none; white-space: nowrap;
}
.s-button .s-icon { width: var(--size-icon-md); height: var(--size-icon-md); }
.s-button:hover { background: var(--color-bg-brand-hover); }
.s-button[data-size="sm"] { height: var(--size-control-sm); padding: var(--space-6) var(--space-12); gap: var(--space-6); font-size: var(--font-size-14); }
.s-button[data-size="sm"] .s-icon { width: var(--size-icon-sm); height: var(--size-icon-sm); }
.s-button[data-style="accent"] { background: var(--color-bg-accent); color: var(--color-text-on-accent); }
.s-button[data-style="accent"]:hover { background: var(--color-bg-accent-hover); }
.s-button[data-style="secondary"] { background: transparent; color: var(--color-text-primary); border-color: var(--color-border-default); }
.s-button[data-style="secondary"]:hover { background: var(--color-bg-surface-hover); }
.s-button[data-style="danger"] { background: var(--color-bg-surface); color: var(--color-text-danger); border-color: var(--color-border-danger); }
.s-button[data-style="danger"]:hover { background: var(--color-bg-danger-soft); }
.s-button:disabled, .s-button[aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
.s-button[aria-busy="true"]::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: s-spin 0.9s linear infinite; }
@keyframes s-spin { to { transform: rotate(1turn); } }
.s-button[data-block] { width: 100%; }

/* Chat · Respuesta rápida · Tipo=Normal|Destacada — píldora de 44 px; Destacada solo para la acción del momento */
.s-quick-reply {
  display: inline-flex; align-items: center; justify-content: center; min-height: var(--size-touch-min);
  padding: var(--space-8) var(--space-12); border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-full);
  background: var(--color-bg-surface); color: var(--color-text-primary); font: 600 var(--font-size-14)/1.45 var(--font-family-sans);
}
.s-quick-reply:hover { background: var(--color-bg-surface-hover); }
.s-quick-reply[data-type="primary"], .s-quick-reply[aria-pressed="true"] { background: var(--color-bg-brand); border-color: var(--color-border-brand); color: var(--color-text-on-brand); }
.s-quick-replies { display: flex; flex-wrap: wrap; gap: var(--space-8); }

/* Interruptor de palanca · Estado=Apagado|Encendido — fila de 52 px, NO/SÍ escritos, nunca encendido por defecto */
.s-toggle {
  display: flex; align-items: center; gap: var(--space-16); width: 100%; min-height: 52px; text-align: left;
  padding: var(--space-12) var(--space-12) var(--space-12) var(--space-16);
  border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface);
  font: 600 var(--font-size-16)/1.5 var(--font-family-sans); color: var(--color-text-primary);
}
.s-toggle > span:first-child { flex: 1; }
.s-toggle small { display: block; font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-lever-switch {
  position: relative; flex: none; width: 60px; height: 30px; border-radius: var(--radius-sm);
  border: var(--stroke-1) solid var(--color-border-strong); background: var(--color-bg-surface-muted); box-shadow: var(--shadow-knob-pressed);
  font: 700 var(--font-size-12)/1 var(--font-family-mono); letter-spacing: 0.08em; color: var(--color-text-secondary);
}
.s-lever-switch::before { content: "NO"; position: absolute; right: 7px; top: 8px; } /* Figma: auto-layout, padding 4 · 8 dentro del borde de 1 px */
.s-lever-switch::after { /* cabeza estriada */
  content: ""; position: absolute; left: 3px; top: 2px; width: 24px; height: 24px; border-radius: var(--radius-xs);
  border: var(--stroke-1) solid var(--color-border-strong); box-shadow: var(--shadow-card);
  background: var(--color-bg-surface) linear-gradient(90deg, transparent 6.5px, var(--color-radio-chrome) 6.5px 8px, transparent 8px 10.5px, var(--color-radio-chrome) 10.5px 12px, transparent 12px 14.5px, var(--color-radio-chrome) 14.5px 16px, transparent 16px) center / 100% 11px no-repeat;
  transition: left 0.2s ease;
}
.s-toggle[aria-checked="true"] { border-color: var(--color-border-brand); }
.s-toggle[aria-checked="true"] .s-lever-switch { background: var(--color-bg-brand); border-color: var(--color-border-brand); color: var(--color-text-on-brand); }
.s-toggle[aria-checked="true"] .s-lever-switch::before { content: "SÍ"; left: 7px; right: auto; }
.s-toggle[aria-checked="true"] .s-lever-switch::after { left: 31px; }

/* Selector de banda · Posición=1|2|3 — teclas que se hunden (role="radiogroup") */
.s-band {
  display: flex; gap: var(--space-8); padding: var(--space-8);
  border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: var(--radius-md); background: var(--color-bg-surface-muted);
}
.s-band [role="radio"] {
  flex: 1; display: grid; justify-items: center; gap: var(--space-2); min-height: 52px; padding: var(--space-8) 0;
  border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: var(--radius-md); background: var(--color-bg-surface); box-shadow: var(--shadow-card);
  color: var(--color-text-primary);
}
.s-band b { font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; }
.s-band small { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-band [role="radio"][aria-checked="true"] { background: var(--color-bg-brand-soft); border-color: var(--color-border-brand); box-shadow: var(--shadow-knob-pressed); color: var(--color-text-brand); }
.s-band [role="radio"][aria-checked="true"] small { color: var(--color-text-brand); }

/* Campo de texto, Dial de energía, Banner, Estado vacío, Enlace de invitación (propios del DS 3.0) */
.s-field { display: grid; gap: var(--space-8); }
.s-field > span { font: 600 var(--font-size-16)/1.35 var(--font-family-sans); }
.s-field input { min-height: var(--size-control-md); padding: 0 var(--space-16); border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-full); background: var(--color-bg-canvas); }
.s-energy-dial { display: grid; gap: var(--space-8); padding: var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); }
.s-energy-dial input[type="range"] { width: 100%; min-height: var(--size-touch-min); accent-color: var(--color-bg-brand); }
.s-energy-dial output { font: 700 var(--font-size-12)/16px var(--font-family-mono); color: var(--color-text-brand); }
.s-banner { display: flex; gap: var(--space-12); align-items: flex-start; padding: var(--space-12) var(--space-16) var(--space-12) var(--space-12); border-radius: var(--radius-md); background: var(--color-bg-brand-soft); color: var(--color-text-brand); font: 400 var(--font-size-14)/1.45 var(--font-family-sans); }
.s-banner strong { display: block; font-weight: 600; }
.s-banner[data-type="progress"] { background: var(--color-bg-accent-soft); color: var(--color-text-accent-strong); }
.s-banner[data-type="error"] { background: var(--color-bg-critical-soft); color: var(--color-text-critical); }
.s-empty { display: grid; gap: var(--space-12); justify-items: center; text-align: center; padding: var(--space-32) var(--space-24); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-lg); background: var(--color-bg-surface); }
.s-invite { display: grid; gap: var(--space-12); padding: var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-lg); background: var(--color-bg-surface); }
.s-invite code { font: 500 var(--font-size-14)/20px var(--font-family-mono); padding: var(--space-12); border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); overflow-wrap: anywhere; }

/* ═════════ Chat ═════════ */

/* Marco catedral · Tamaño=S|L · Estado=En espera|En el aire — arco casi circular para el anfitrión */
.s-cathedral { position: relative; flex: none; width: 40px; height: 42px; padding: 2.5px; border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: 9999px 9999px var(--radius-lg) var(--radius-lg); background: var(--color-bg-bakelite-soft); }
.s-cathedral img { width: 100%; height: 100%; object-fit: cover; border-radius: 9999px 9999px var(--radius-md) var(--radius-md); }
.s-cathedral[data-size="l"] { width: 96px; height: 102px; padding: 6px; border-radius: 9999px 9999px var(--radius-device) var(--radius-device); }
.s-cathedral[data-size="l"] img { border-radius: 9999px 9999px var(--radius-device) var(--radius-device); }
.s-cathedral[data-on-air] { border: var(--stroke-1-5) solid var(--color-signal-live); box-shadow: 0 0 6px var(--color-signal-live); }

/* Chat · Cabecera · Tipo=Grupo|Sintonía · Estado=Sin plan|Votación|Buscando|Fijado|Escribiendo|Normal */
.s-chat-header { background: var(--color-bg-surface); }
.s-chat-header .s-bar { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-12) var(--space-8) var(--space-8) var(--space-4); }
.s-back { flex: none; display: grid; place-items: center; width: var(--size-touch-min); height: var(--size-touch-min); border: 0; border-radius: var(--radius-xl); background: none; color: var(--color-icon-primary); }
.s-group-avatar { flex: none; display: grid; place-items: center; width: var(--size-control-sm); height: var(--size-control-sm); border-radius: var(--radius-xl); background: var(--color-bg-surface-muted); color: var(--color-icon-secondary); }
.s-chat-header .s-title { flex: 1; min-width: 0; display: grid; gap: var(--space-2); }
.s-chat-header h1 { font: 700 var(--font-size-16)/1.4 var(--font-family-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-chat-header p { display: flex; align-items: center; gap: var(--space-4); font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-chat-header p b { font-weight: 400; color: var(--color-text-brand); }

/* Firma · Escala de dial · Tipo=Divisor|Separador|Indicador|Emisora · … — la firma de marca */
.s-scale { height: 7px; background: linear-gradient(var(--color-border-default), var(--color-border-default)) bottom / 100% 1px no-repeat, repeating-linear-gradient(90deg, var(--color-radio-chrome) 0 1px, transparent 1px 8.5px) 8px 3px / calc(100% - 16px) 3px no-repeat; }
.s-station { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-2) var(--space-12); border-bottom: var(--stroke-1) solid var(--color-border-default); }
.s-station::before, .s-station::after { content: ""; flex: 1; height: 8px; background: repeating-linear-gradient(90deg, var(--color-radio-chrome) 0 1px, transparent 1px 8px) left bottom / 100% 4px no-repeat; }
.s-station span { display: inline-flex; align-items: center; gap: var(--space-6); font: 600 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-primary); }
.s-station span::before { content: ""; width: 2px; height: 14px; border-radius: 1px; background: var(--color-bg-brand); }
.s-station i { width: 8px; height: 8px; border-radius: 50%; background: var(--color-signal-live); }
.s-station[data-state="searching"] i { background: var(--color-signal-searching); }
.s-station[data-state="fixed"] i { background: var(--color-signal-locked); }
.s-date { display: flex; align-items: center; gap: var(--space-12); font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-date::before, .s-date::after { content: ""; flex: 1; height: 6px; background: repeating-linear-gradient(90deg, var(--color-radio-chrome) 0 1px, transparent 1px 5.9px) left bottom / 100% 3px no-repeat; }

/* Onda escribiendo · Fase=1…12|Quieta — «Sintonía ∿ escribiendo…»; se detiene con prefers-reduced-motion */
.s-wave { display: inline-flex; align-items: center; gap: var(--space-8); font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-wave svg { width: 30px; height: 16px; color: var(--color-text-accent-strong); animation: s-wave 1.2s linear infinite; }
@keyframes s-wave { to { transform: translateX(-10px); } }

/* Chat · Mensaje · Autor=Sintonía|Otra persona|Yo — <div role="log" aria-live="polite"> con <article class="s-message"> */
.s-thread { display: flex; flex-direction: column; gap: var(--space-12); padding: var(--space-12) var(--space-16) var(--space-16); }
.s-message { display: flex; align-items: flex-end; gap: var(--space-8); }
.s-message[data-author="me"] { justify-content: flex-end; }
.s-initial { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-bg-surface-muted); font: 700 var(--font-size-12)/1.3 var(--font-family-sans); color: var(--color-text-secondary); }
.s-bubble { display: grid; gap: var(--space-2); max-width: 286px; padding: var(--space-8) var(--space-12); border-radius: var(--radius-md) var(--radius-md) var(--radius-md) var(--radius-2xs); background: var(--color-chat-bubble-in); }
.s-message[data-author="me"] .s-bubble { max-width: 280px; border-radius: var(--radius-md) var(--radius-md) var(--radius-2xs) var(--radius-md); background: var(--color-chat-bubble-out); }
.s-bubble header { display: flex; align-items: center; gap: var(--space-8); font: 600 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-primary); }
.s-message[data-author="ai"] .s-bubble header { color: var(--color-text-brand); }
.s-ia { padding: var(--space-2) var(--space-4); border-radius: var(--radius-2xs); background: var(--color-bg-inverse); color: var(--color-text-inverse); font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; }
.s-bubble p { font: 400 var(--font-size-17)/24px var(--font-family-sans); color: var(--color-text-primary); } /* Body/Chat */
.s-bubble time { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-chat-meta); }
.s-attach { padding-left: var(--space-48); } /* adjuntos con sangría de 48 px */

/* Chat · Composer · Respuestas=Sí|No */
.s-composer { display: grid; gap: var(--space-12); padding: var(--space-12) var(--space-12) calc(var(--space-20) + env(safe-area-inset-bottom, 0px)); background: var(--color-bg-surface); border-top: var(--stroke-1) solid var(--color-border-default); }
.s-composer form { display: flex; align-items: center; gap: var(--space-8); }
.s-composer input { flex: 1; min-width: 0; min-height: var(--size-control-md); padding: var(--space-12) var(--space-16); border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-full); background: var(--color-bg-canvas); font: 400 var(--font-size-16)/1.5 var(--font-family-sans); }
.s-send { flex: none; display: grid; place-items: center; width: var(--size-control-md); height: var(--size-control-md); border: 0; border-radius: var(--radius-xl); background: var(--color-bg-brand); color: var(--color-icon-on-brand); }

/* Chat · Tarjeta de votación · Opción=1|2|3 — las 3 estaciones del Cuadrante son las opciones */
.s-vote-card { border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-xl); background: var(--color-bg-surface); overflow: hidden; }
.s-vote-card .s-dial-vote { padding: var(--space-16) var(--space-8) var(--space-4); align-items: flex-start; }
.s-vote-card .s-dial-vote output { margin-top: var(--space-12); } /* centrado con la pista */
.s-station-option { display: flex; align-items: center; gap: var(--space-12); width: 100%; padding: var(--space-12); border: 0; background: none; text-align: left; cursor: pointer; }
.s-station-option[aria-checked="true"] { background: var(--color-bg-accent-soft); }
.s-station-option .s-num { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border: var(--stroke-1-5) solid var(--color-border-strong); border-radius: var(--radius-md); font: 700 var(--font-size-16)/22px var(--font-family-mono); color: var(--color-text-secondary); }
.s-station-option[aria-checked="true"] .s-num { background: var(--color-text-accent-strong); border-color: var(--color-text-accent-strong); color: var(--color-text-inverse); }
.s-station-option strong { display: block; font: 600 var(--font-size-16)/1.5 var(--font-family-sans); color: var(--color-text-primary); }
.s-station-option small { font: 400 var(--font-size-14)/1.45 var(--font-family-sans); color: var(--color-text-secondary); }
.s-vote-card .s-actions { display: grid; gap: var(--space-8); padding: var(--space-12); }
.s-links { display: flex; justify-content: space-between; }
.s-links a { display: inline-flex; align-items: center; min-height: var(--size-touch-min); font: 600 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-brand); text-decoration: none; }
.s-links a[data-tone="danger"] { color: var(--color-text-danger); }

/* ═════════ Instrumentos de radio ═════════ */

/* Cuadrante de opciones · Opción=1|2|3 · Estado=Votación|Fijado — role="slider" */
.s-dial-vote { display: flex; align-items: center; gap: var(--space-12); min-height: var(--size-control-md); padding: var(--space-8) var(--space-4); }
.s-rail { position: relative; flex: 1; height: 38px; background: repeating-linear-gradient(90deg, var(--color-radio-chrome) 0 1px, transparent 1px 12.7px) 8.5px 2px / calc(100% - 17px) 4px no-repeat; }
.s-rail::before { content: ""; position: absolute; inset: 9px 0 auto; height: 6px; border: var(--stroke-1) solid var(--color-icon-secondary); border-radius: var(--radius-full); background: var(--color-data-track); }
.s-rail i { position: absolute; left: 0; top: 9px; height: 6px; width: var(--fill, 7%); border-radius: var(--radius-full); background: var(--color-text-accent-strong); }
.s-rail b { position: absolute; top: 3px; left: calc(var(--fill, 7%) - 6px); width: 12px; height: 18px; border: var(--stroke-2) solid var(--color-text-accent-strong); border-radius: var(--radius-full); background: var(--color-bg-surface); box-shadow: var(--shadow-card); }
.s-rail ol { position: absolute; inset: 22px 0 auto; display: flex; justify-content: space-between; padding: 0 15px; font: 500 var(--font-size-14)/20px var(--font-family-mono); color: var(--color-text-secondary); }
.s-rail ol li[aria-current] { font-weight: 700; color: var(--color-text-accent-strong); }
.s-dial-vote output { font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; color: var(--color-text-accent-strong); }
.s-dial-vote[data-state="fixed"] .s-rail i { background: var(--color-bg-brand); }
.s-dial-vote[data-state="fixed"] .s-rail b { border-color: var(--color-bg-brand); }
.s-dial-vote[data-state="fixed"] output, .s-dial-vote[data-state="fixed"] li[aria-current] { color: var(--color-text-brand); }

/* Aguja de quórum · Quórum=1…4 — role="progressbar" con aria-valuetext */
.s-quorum { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-16) var(--space-8) var(--space-8); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); }
.s-quorum[data-complete] { background: var(--color-bg-brand-soft); border-color: var(--color-border-brand); }
.s-gauge { flex: none; width: 76px; height: 46px; }
.s-quorum b { display: block; font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; color: var(--color-text-primary); }
.s-quorum[data-complete] b { color: var(--color-text-brand); }
.s-quorum small { font: 400 var(--font-size-14)/1.45 var(--font-family-sans); color: var(--color-text-secondary); }

/* Display de señal · Tipo=Hora|Cuenta regresiva|Sin señal — LCD con segmentos fantasma al 8 % */
.s-display { display: inline-flex; align-items: flex-end; gap: var(--space-16); padding: var(--space-12) var(--space-20); border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: var(--radius-md); background: var(--color-radio-display); color: var(--color-radio-display-ink); }
.s-display[data-type="time"] { color: var(--color-radio-display-live); }
.s-display small { display: block; font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.s-display b { position: relative; display: block; font: 800 var(--font-size-40)/1.1 var(--font-family-mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.s-display b::before { content: attr(data-ghost); position: absolute; inset: 0; opacity: 0.08; }
.s-display[data-type="off"] b { color: var(--color-text-secondary); }
.s-display[data-type="off"]::after { content: ""; width: 8px; height: 8px; margin-bottom: 4px; border-radius: 50%; background: var(--color-signal-off); }

/* Válvulas calentando · Paso=1|2|3 — brillo interno, nunca sale del bulbo */
.s-valves { display: flex; align-items: center; gap: var(--space-16); padding: var(--space-12) var(--space-20) var(--space-12) var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-xl); background: var(--color-bg-surface); }
.s-valves .s-tubes { display: flex; gap: var(--space-8); }
.s-valves .s-tubes i { position: relative; width: 20px; height: 36px; }
.s-valves .s-tubes i::before { content: ""; position: absolute; inset: 0 0 6px; border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: 9999px 9999px var(--radius-2xs) var(--radius-2xs); background: var(--color-bg-surface) linear-gradient(var(--color-radio-chrome), var(--color-radio-chrome)) center 10px / 4px 12px no-repeat; }
.s-valves .s-tubes i::after { content: ""; position: absolute; inset: auto 0 0; height: 6px; border-radius: var(--radius-3xs); background: var(--color-text-bakelite); }
.s-valves .s-tubes i[data-on]::before { /* luz interna: núcleo claro → brillo → vidrio; nunca «hueca» en Oscuro */ border-color: var(--color-border-accent); background: radial-gradient(ellipse 30% 30% at 50% 55%, var(--color-radio-valve-core), transparent 100%), radial-gradient(ellipse at 50% 55%, var(--color-border-warning), var(--color-radio-valve-glass) 75%); box-shadow: inset 0 0 6px var(--color-bg-accent); }
.s-valves strong { display: block; font: 600 var(--font-size-16)/1.5 var(--font-family-sans); }
.s-valves small { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }

/* Presintonías · mis parches · Estado=Vacío|Con parches */
.s-presets { display: grid; gap: var(--space-12); padding: var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-xl); background: var(--color-bg-surface); }
.s-presets header { display: flex; justify-content: space-between; font: 600 var(--font-size-13)/1.3 var(--font-family-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-secondary); }
.s-presets header span { font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; text-transform: none; }
.s-presets ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-8); }
.s-preset { display: grid; gap: var(--space-2); min-height: 64px; padding: var(--space-12) var(--space-8); border: var(--stroke-1) dashed var(--color-radio-chrome); border-radius: var(--radius-md); color: var(--color-text-secondary); text-align: left; }
.s-preset small { display: flex; align-items: center; gap: var(--space-8); font: 700 var(--font-size-12)/16px var(--font-family-mono); letter-spacing: 0.08em; }
.s-preset strong { font: 600 var(--font-size-14)/1.45 var(--font-family-sans); }
.s-preset span { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); }
.s-preset[data-state="saved"], .s-preset[data-state="active"] { border-style: solid; background: var(--color-bg-surface); box-shadow: var(--shadow-card); }
.s-preset[data-state="saved"] strong, .s-preset[data-state="active"] strong { color: var(--color-text-primary); }
.s-preset[data-state="active"] { border-color: var(--color-border-brand); }
.s-preset[data-state="active"] small, .s-preset[data-state="active"] span { color: var(--color-text-brand); }
.s-preset[data-state="active"] small::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--color-signal-live); }

/* Presione para hablar · Tamaño=Normal|Compacto|Cabecera · Estado=Reposo|Presionado|En línea — «Habla con un humano» */
.s-human { display: inline-flex; align-items: center; gap: var(--space-16); min-height: 56px; padding: var(--space-8) var(--space-20) var(--space-8) var(--space-8); border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-xl); background: var(--color-bg-surface); color: var(--color-text-primary); text-decoration: none; text-align: left; }
.s-human .s-grip { flex: none; width: 30px; height: 48px; border-radius: var(--radius-md); background: var(--color-bg-surface-muted) repeating-linear-gradient(90deg, transparent 0 8px, var(--color-radio-chrome) 8px 10px, transparent 10px 12px) center / 14px 24px no-repeat; }
.s-human strong { display: block; font: 600 var(--font-size-16)/1.5 var(--font-family-sans); }
.s-human small { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-human::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-radio-chrome); }
.s-human[data-size="header"] { gap: var(--space-4); height: var(--size-touch-min); min-height: 0; padding: var(--space-4) var(--space-8) var(--space-4) var(--space-4); border-radius: var(--radius-md); font: 600 var(--font-size-13)/15px var(--font-family-sans); }
.s-human[data-size="header"] .s-grip { width: 26px; height: 32px; border-radius: var(--radius-sm); background-size: 10px 16px; }
.s-human[data-size="header"]::after { width: 6px; height: 6px; }
.s-human[aria-pressed="true"] { background: var(--color-bg-brand-soft); border-color: var(--color-border-brand); box-shadow: var(--shadow-knob-pressed); color: var(--color-text-brand); }
.s-human[aria-pressed="true"]::after { background: var(--color-signal-searching); }
.s-human[data-state="live"] { background: var(--color-bg-brand-deep); border-color: var(--color-bg-brand-deep); color: var(--color-text-on-deep); }
.s-human[data-state="live"] small { color: var(--color-text-on-deep); }
.s-human[data-state="live"]::after { background: var(--color-signal-glow); }

/* Luz piloto · State=Buscando|Votación|Fijado|Sin señal — el LED siempre va con texto */
.s-pilot { display: inline-flex; align-items: center; gap: var(--space-8); padding: var(--space-4) var(--space-12) var(--space-4) var(--space-10); border-radius: var(--radius-full); background: var(--color-bg-brand-soft); color: var(--color-text-brand); font: 700 var(--font-size-12)/1.3 var(--font-family-sans); }
.s-pilot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-signal-live); box-shadow: 0 0 6px 1px var(--color-signal-live); }
.s-pilot[data-state="searching"] { background: var(--color-bg-accent-soft); color: var(--color-text-accent-strong); }
.s-pilot[data-state="searching"]::before { background: var(--color-signal-searching); box-shadow: 0 0 6px 1px var(--color-signal-searching); }
.s-pilot[data-state="fixed"] { background: var(--color-bg-brand-deep); color: var(--color-text-on-deep); }
.s-pilot[data-state="fixed"]::before { background: var(--color-signal-glow); box-shadow: 0 0 6px 1px var(--color-signal-glow); }
.s-pilot[data-state="off"] { background: var(--color-bg-critical-soft); color: var(--color-text-critical); }
.s-pilot[data-state="off"]::before { background: var(--color-signal-off); box-shadow: 0 0 6px 1px var(--color-signal-off); }

/* ═════════ Plan y panel ═════════ */

/* Lista del plan · Estado=Por empezar|En curso|Terminado — lista de reproducción, <ol> con aria-current="step" */
.s-plan-list { display: grid; gap: var(--space-12); padding: var(--space-16) var(--space-12); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-xl); background: var(--color-bg-surface); }
.s-plan-list header { display: flex; align-items: center; gap: var(--space-12); }
.s-plan-list .s-control { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--color-bg-surface-muted); color: var(--color-icon-secondary); }
.s-plan-list header small { display: block; font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-plan-list header b { font: 600 var(--font-size-13)/1.3 var(--font-family-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-secondary); }
.s-progress { display: flex; gap: var(--space-2); }
.s-progress i { flex: var(--w, 1); height: 4px; border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-full); background: linear-gradient(90deg, var(--color-text-accent-strong) var(--p, 0%), var(--color-data-track) 0); }
.s-plan-list li { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-8); border-radius: var(--radius-sm); font: 400 var(--font-size-14)/1.45 var(--font-family-sans); color: var(--color-text-secondary); }
.s-plan-list li > span { flex: 1; }
.s-plan-list li strong { display: block; font: 400 var(--font-size-16)/1.5 var(--font-family-sans); color: var(--color-text-primary); }
.s-plan-list li[aria-current="step"] { background: var(--color-bg-brand-soft); }
.s-plan-list li[aria-current="step"] strong { font-weight: 600; }
.s-plan-list li em { font: 600 var(--font-size-14)/20px var(--font-family-sans); font-style: normal; }
.s-plan-list[data-state="done"] .s-progress i { background: var(--color-bg-brand); }
.s-plan-list[data-state="done"] li strong { color: var(--color-text-secondary); }

/* Hoja con asa — role="dialog"; asa de boombox decorativa (aria-hidden) */
.s-sheet { display: grid; gap: var(--space-16); padding: var(--space-12) var(--space-20) calc(var(--space-24) + env(safe-area-inset-bottom, 0px)); border: var(--stroke-1) solid var(--color-radio-chrome); border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--color-bg-surface); box-shadow: var(--shadow-toast); }
.s-sheet::before { content: ""; height: 14px; margin: 0 var(--space-32); background: linear-gradient(var(--color-radio-chrome), var(--color-radio-chrome)) top / 100% 2px no-repeat, linear-gradient(var(--color-radio-chrome), var(--color-radio-chrome)) left top / 2px 10px no-repeat, linear-gradient(var(--color-radio-chrome), var(--color-radio-chrome)) right top / 2px 10px no-repeat, linear-gradient(var(--color-bg-surface-muted), var(--color-bg-surface-muted)) center 0 / 36% 4px no-repeat; }
.s-sheet small { font: 600 var(--font-size-13)/1.3 var(--font-family-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-secondary); }
.s-sheet h2 { font: 700 var(--font-size-19)/1.3 var(--font-family-display); letter-spacing: -0.01em; }
.s-sheet .s-actions { display: flex; gap: var(--space-8); }
.s-sheet .s-actions > * { flex: 1; }

/* Panel · Encabezado / Pestañas / Fila de sintonía / Próxima sintonía / Navegación */
.s-panel-head { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-24) var(--space-16) var(--space-8); }
.s-panel-head h1 { font: 800 var(--font-size-32)/1.15 var(--font-family-display); letter-spacing: -0.015em; }
.s-panel-head p { font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-panel-head .s-me { margin-left: auto; display: grid; place-items: center; width: var(--size-touch-min); height: var(--size-touch-min); border-radius: var(--radius-xl); background: var(--color-bg-surface-muted); font: 700 var(--font-size-12)/1.3 var(--font-family-sans); color: var(--color-text-secondary); }
.s-tabs { display: flex; border-bottom: var(--stroke-1) solid var(--color-border-default); }
.s-tabs [role="tab"] { flex: 1; display: grid; justify-items: center; gap: var(--space-8); min-height: var(--size-control-md); padding-top: var(--space-12); border: 0; background: none; font: 400 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-secondary); }
.s-tabs [role="tab"] span { margin-left: var(--space-6); font-size: var(--font-size-13); }
.s-tabs [role="tab"]::after { content: ""; width: 40px; height: 6px; visibility: hidden; background: linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) center / 2px 6px no-repeat, linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) bottom / 100% 1px no-repeat; }
.s-tabs [role="tab"][aria-selected="true"] { font-weight: 600; color: var(--color-text-primary); }
.s-tabs [role="tab"][aria-selected="true"] span { color: var(--color-text-brand); }
.s-tabs [role="tab"][aria-selected="true"]::after { visibility: visible; }
.s-eyebrow { font: 600 var(--font-size-13)/1.3 var(--font-family-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-secondary); }
.s-list { border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); overflow: hidden; }
.s-list > * + * { border-top: var(--stroke-1) solid var(--color-border-default); }
.s-tuning-row { display: flex; align-items: center; gap: var(--space-12); min-height: 64px; padding: var(--space-12) var(--space-8) var(--space-12) var(--space-16); color: var(--color-text-primary); text-decoration: none; }
.s-tuning-row .s-when { display: grid; justify-items: center; padding: var(--space-8); border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); }
.s-tuning-row .s-when small { font: 600 var(--font-size-13)/1.3 var(--font-family-sans); letter-spacing: 0.04em; color: var(--color-text-secondary); }
.s-tuning-row .s-when b { font: 600 var(--font-size-14)/20px var(--font-family-sans); white-space: nowrap; }
.s-tuning-row > span { flex: 1; min-width: 0; }
.s-tuning-row strong { display: block; font: 600 var(--font-size-16)/1.5 var(--font-family-sans); }
.s-tuning-row small { display: flex; align-items: center; gap: var(--space-8); font: 400 var(--font-size-13)/1.4 var(--font-family-sans); color: var(--color-text-secondary); }
.s-tuning-row i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-signal-live); }
.s-tuning-row[data-state="searching"] i { background: var(--color-signal-searching); }
.s-tuning-row[data-state="fixed"] i { background: var(--color-signal-locked); }
.s-next { display: grid; gap: var(--space-12); padding: var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); }
.s-next h3 { font: 700 var(--font-size-17)/1.35 var(--font-family-display); }
.s-next p { font: 400 var(--font-size-14)/1.45 var(--font-family-sans); color: var(--color-text-secondary); }
.s-nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: calc(var(--space-16) + env(safe-area-inset-bottom, 0px)); background: var(--color-bg-surface); border-top: var(--stroke-1) solid var(--color-border-default); }
.s-nav a { display: grid; justify-items: center; gap: var(--space-4); min-height: 56px; font: 400 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-secondary); text-decoration: none; }
.s-nav a::before { /* Indicador de la firma, girado 180°: base arriba, aguja hacia abajo */ content: ""; width: 40px; height: 6px; opacity: 0; background: linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) center / 2px 6px no-repeat, linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) top / 100% 1px no-repeat; }
.s-nav a[aria-current="page"] { font-weight: 600; color: var(--color-text-brand); }
.s-nav a[aria-current="page"]::before { opacity: 1; }
.s-kpi { display: grid; gap: var(--space-2); padding: var(--space-12) var(--space-16); border: var(--stroke-1) solid var(--color-border-default); border-radius: var(--radius-lg); background: var(--color-bg-surface); }
.s-kpi b { font: 800 var(--font-size-24)/1.2 var(--font-family-mono); font-variant-numeric: tabular-nums; }

/* ── App E3 · prueba interna. Solo diseño del contenedor y del panel de equipo; las piezas vienen del DS 3.0. ── */
html, body { height: 100%; }
body { background: var(--color-bg-surface-muted); }
.app-stage { min-height: 100%; display: flex; justify-content: center; align-items: stretch; gap: var(--space-24); padding-inline: 0; }
@media (min-width: 720px) { .app-stage { padding-block: var(--space-24); padding-inline: var(--space-16); align-items: flex-start; } }

.phone { position: relative; width: 100%; max-width: 430px; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--color-chat-canvas); }
@media (min-width: 720px) { .phone { height: min(900px, calc(100dvh - 48px)); border-radius: var(--radius-device); border: var(--stroke-1) solid var(--color-border-default); box-shadow: var(--shadow-toast); } }
.phone[data-panel] { background: var(--color-bg-canvas); }
.phone > .s-thread { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
.phone > .scroll { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: var(--space-16); padding: var(--space-4) var(--space-16) var(--space-24); }
.s-attach > * { width: 100%; }
.s-message[data-error] .s-bubble { outline: var(--stroke-1) dashed var(--color-text-critical); }
.mono { font-family: var(--font-family-mono); letter-spacing: 0.08em; }

/* Botones con forma de enlace o fila (el DS los muestra como <a>) */
.s-links .s-link { display: inline-flex; align-items: center; min-height: var(--size-touch-min); padding: 0; border: 0; background: none; font: 600 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-brand); }
.s-links .s-link[data-tone="danger"] { color: var(--color-text-danger); }
button.s-tuning-row { width: 100%; border: 0; background: none; text-align: left; font: inherit; }
.s-list { display: grid; }
button.s-preset { width: 100%; background: none; font: inherit; }
button.s-preset[data-state="saved"], button.s-preset[data-state="active"] { background: var(--color-bg-surface); }
button.s-preset:disabled { cursor: default; }
button.s-human { font: inherit; cursor: pointer; }
.s-nav button { display: grid; justify-items: center; gap: var(--space-4); min-height: 56px; padding: 0; border: 0; background: none; font: 400 var(--font-size-14)/20px var(--font-family-sans); color: var(--color-text-secondary); }
.s-nav button::before { content: ""; width: 40px; height: 6px; opacity: 0; background: linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) center / 2px 6px no-repeat, linear-gradient(var(--color-bg-brand), var(--color-bg-brand)) top / 100% 1px no-repeat; }
.s-nav button[aria-current="page"] { font-weight: 600; color: var(--color-text-brand); }
.s-nav button[aria-current="page"]::before { opacity: 1; }
.s-toggle:disabled, .s-band button:disabled, .s-station-option:disabled { cursor: default; opacity: 0.72; }
.s-dial-vote[data-act="rail"] { cursor: pointer; }

/* Hoja y aviso dentro del teléfono */
.sheet-scrim { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; background: color-mix(in srgb, var(--color-text-primary) 32%, transparent); }
.toast { position: absolute; z-index: 6; left: var(--space-12); right: var(--space-12); top: calc(var(--space-12) + env(safe-area-inset-top, 0px)); }
.toast .s-banner { box-shadow: var(--shadow-toast); align-items: center; }
.toast .s-banner > div { flex: 1; }
.toast button { flex: none; }

/* Panel del equipo (no es parte del producto) */

@media (min-width: 1100px) { .team-fab { display: none; } }
.team { width: 100%; max-width: 380px; display: none; flex-direction: column; gap: var(--space-16); max-height: min(900px, calc(100dvh - 48px)); overflow-y: auto; padding: var(--space-16); border: var(--stroke-1) dashed var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-bg-surface); font-size: var(--font-size-14); }
@media (min-width: 1100px) { .team { display: flex; } }
.team[data-open] { display: flex; position: fixed; z-index: 30; inset: auto 0 0 0; max-width: none; max-height: 82dvh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding-bottom: calc(var(--space-24) + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-toast); }
.team h2 { font: 800 var(--font-size-19)/1.2 var(--font-family-display); }

.team .tb { min-height: 36px; padding: 0 var(--space-12); border: var(--stroke-1) solid var(--color-border-strong); border-radius: var(--radius-sm); background: var(--color-bg-canvas); font: 600 var(--font-size-13)/1.2 var(--font-family-sans); }
.team .tb:hover { background: var(--color-bg-surface-hover); }
.team .tb[data-tone="danger"] { color: var(--color-text-danger); }
.team .log { max-height: 160px; overflow: auto; padding: var(--space-8); border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); font: 500 var(--font-size-12)/1.5 var(--font-family-mono); color: var(--color-text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; }

.team .pill[data-ok] { background: var(--color-bg-brand-soft); color: var(--color-text-brand); }
.team .pill[data-warn] { background: var(--color-bg-critical-soft); color: var(--color-text-critical); }
.team .msgs { display: grid; gap: var(--space-4); max-height: 180px; overflow: auto; }
.team .msgs p { padding: var(--space-6) var(--space-8); border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); color: var(--color-text-primary); }

@media (min-width: 1100px) { .team .close { display: none; } }

/* Feedback del equipo (8 oct): respuestas a la derecha, enviar = OK, dial con riel, ¿Te apuntas? */
.s-composer > .s-quick-replies { justify-content: flex-end; }

.e-head > span { flex: 1; min-width: 0; }
.e-head b { font: 700 var(--font-size-14)/20px var(--font-family-mono); color: var(--color-text-brand); }
.e-scale { position: relative; height: 44px; --f: 0.5; }
.e-scale::before, .e-scale::after { content: ""; position: absolute; left: 14px; top: 19px; height: 6px; border-radius: var(--radius-full); pointer-events: none; }

.e-scale::after { width: calc((100% - 28px) * var(--f)); background: var(--color-bg-brand); }
.e-marks { position: absolute; left: 13px; right: 13px; top: 4px; height: 14px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.e-marks i { width: 2px; height: 14px; background: var(--color-icon-secondary); }
.e-marks i:nth-child(even) { height: 10px; }
.e-marks i[data-on] { background: var(--color-bg-brand); }
.e-scale input[type="range"] { position: absolute; inset: 0; z-index: 1; width: 100%; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }

.e-scale input[type="range"]:focus-visible { outline: none; }

.e-rsvp { display: grid; gap: var(--space-8); padding: var(--space-16); border: var(--stroke-1) solid var(--color-border-brand); border-radius: var(--radius-lg); background: var(--color-bg-surface); }
.e-rsvp strong { font: 700 var(--font-size-16)/1.4 var(--font-family-display); }
.e-rsvp .s-actions { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: center; }
.e-rsvp .s-actions > .s-button:not([data-size]) { flex: 1; }
.e-rsvp .s-actions > p { flex: 1; color: var(--color-text-brand); font-weight: 600; }

<body>
<div class="app-stage">
  <main class="phone" id="phone" aria-label="Sintonía"></main>
  <aside class="team" id="team" aria-label="Panel del equipo"></aside>
</div>
<button class="team-fab" type="button" aria-label="Abrir el panel del equipo">EQUIPO</button>
<script>
(() => {
'use strict';
/* ── 01 · Contenido: voces, guion y catálogo de planes de ejemplo ─────────── */
const VOZ = {
  quinto: ['el-quinto', 'El Quinto'], guardiana: ['la-guardiana', 'La Guardiana'], mago: ['el-mago', 'El Mago'],
  resonador: ['el-resonador', 'El Resonador'], antena: ['la-antena', 'La Antena'], despertador: ['el-despertador', 'El Despertador'],
  gramola: ['la-gramola', 'La Gramola'], estatica: ['la-estatica', 'La Estática'],
};

const FRANJAS = [
  { id: 'manana', b: 'MAÑANA', s: '6 – 12 a. m.', h: 9, m: 0 },
  { id: 'tarde', b: 'TARDE', s: '12 – 6 p. m.', h: 14, m: 30 },
  { id: 'noche', b: 'NOCHE', s: '6 – 10 p. m.', h: 19, m: 0 },
];

const ENERGIA = ['Agotado', 'Bajo', 'Medio', 'Alto', 'A tope'];
const ANTOJOS = ['Café', 'Almuerzo', 'Caminata', 'Juegos de mesa', 'Algo cultural'];
const RESTRICCIONES = ['Presupuesto bajo', 'Sin alcohol', 'Accesibilidad', 'Que quede cerca', 'Nada especial'];

/* Contenido de EJEMPLO para la prueba interna: lugares y valores de referencia, no verificados. */
const CATALOGO = [
  { id: 'museo-cafe', titulo: 'Museo y café', antojos: ['Algo cultural', 'Café'], costo: 30000, zona: 'El Peñón', accesible: true, paradas: [['Museo La Tertulia', 75], ['Café en San Antonio', 45], ['Regreso a casa', 0]] },
  { id: 'cerro', titulo: 'Cerro temprano', antojos: ['Caminata'], costo: 0, zona: 'Norte', accesible: false, hora: [6, 0], paradas: [['Subida al cerro', 90], ['Desayuno en la base', 45], ['Regreso a casa', 0]] },
  { id: 'bici', titulo: 'Domingo en bici', antojos: ['Caminata'], costo: 0, zona: 'Varios', accesible: false, hora: [8, 0], paradas: [['Ciclovía', 90], ['Jugo en el parque', 30], ['Regreso a casa', 0]] },
  { id: 'juegos-cafe', titulo: 'Juegos en un café', antojos: ['Juegos de mesa', 'Café'], costo: 25000, zona: 'San Fernando', accesible: true, paradas: [['Café con juegos de mesa', 120], ['Postre', 30], ['Regreso a casa', 0]] },
  { id: 'almuerzo-sa', titulo: 'Almuerzo en San Antonio', antojos: ['Almuerzo'], costo: 45000, zona: 'San Antonio', accesible: true, paradas: [['Almuerzo', 75], ['Caminata por el barrio', 45], ['Regreso a casa', 0]] },
  { id: 'cafe-charla', titulo: 'Café y caminata corta', antojos: ['Café', 'Caminata'], costo: 15000, zona: 'Granada', accesible: true, paradas: [['Café', 60], ['Caminata por el bulevar', 30], ['Regreso a casa', 0]] },
  { id: 'picnic', titulo: 'Picnic en el parque', antojos: ['Almuerzo', 'Caminata'], costo: 15000, zona: 'Parque cercano', accesible: true, paradas: [['Picnic', 90], ['Caminata corta', 30], ['Regreso a casa', 0]] },
  { id: 'mercado', titulo: 'Mercado y almuerzo', antojos: ['Almuerzo', 'Algo cultural'], costo: 20000, zona: 'Centro', accesible: true, paradas: [['Mercado local', 60], ['Almuerzo', 60], ['Regreso a casa', 0]] },
  { id: 'noche-juegos', titulo: 'Noche de juegos', antojos: ['Juegos de mesa'], costo: 20000, zona: 'Casa de alguien del parche', accesible: true, paradas: [['Juegos de mesa', 120], ['Algo de comer', 30], ['Regreso a casa', 0]] },
  { id: 'cine', titulo: 'Película y conversación', antojos: ['Algo cultural', 'Juegos de mesa'], costo: 10000, zona: 'Casa de alguien del parche', accesible: true, paradas: [['Película', 110], ['Conversación', 40], ['Regreso a casa', 0]] },
];

/* Elige 3 opciones distintas según antojos y restricciones; la ronda 2 toma las siguientes. */
function elegirOpciones(antojos = [], restr = [], franjaId = 'tarde', ronda = 1, excluir = []) {
  const bajo = restr.includes('Presupuesto bajo'), acc = restr.includes('Accesibilidad');
  const fr = FRANJAS.find(f => f.id === franjaId) || FRANJAS[1];
  const score = o => (o.antojos.filter(a => antojos.includes(a)).length * 3) + (bajo && o.costo <= 15000 ? 2 : 0) - (bajo && o.costo > 30000 ? 2 : 0) + (acc && o.accesible ? 1 : 0) - (acc && !o.accesible ? 3 : 0) - (o.hora && franjaId !== 'manana' ? 2 : 0);
  const ord = CATALOGO.filter(o => !excluir.includes(o.id)).map(o => [o, score(o)]).sort((a, b) => b[1] - a[1] || a[0].id.localeCompare(b[0].id)).map(x => x[0]);
  return ord.slice(0, 3).map(o => {
    const [h, m] = o.hora || [fr.h, fr.m];
    return { id: o.id, titulo: o.titulo, costo: o.costo, zona: o.zona, h, m, paradas: o.paradas };
  });
}

const pesos = n => n === 0 ? 'Gratis' : '$' + n.toLocaleString('es-CO');
const hora12 = (h, m) => { const s = h >= 12 ? 'p. m.' : 'a. m.'; const hh = ((h + 11) % 12) + 1; return `${hh}:${String(m).padStart(2, '0')} ${s}`; };
const detalleOpcion = o => `${hora12(o.h, o.m)} · ${pesos(o.costo)} · ${o.zona}`;
const durTxt = min => !min ? '—' : min >= 60 ? `${Math.floor(min / 60)} h${min % 60 ? ' ' + (min % 60) : ''}` : `${min} min`;

/* Próximo domingo (o el de la otra semana si hoy ya es domingo pasada la hora) */
function proximoDomingo(h, m) {
  const d = new Date(); d.setSeconds(0, 0);
  const add = (7 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + add); d.setHours(h, m, 0, 0); return d.getTime();
}
const fechaCorta = t => new Date(t).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '').replace(',', '');
const horaMsg = t => new Date(t).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?\s?m\.?/i, (x, a) => ` ${a.toLowerCase()}. m.`);

const NOMBRES_SIM = ['Ana', 'Luis', 'Marta', 'Juan', 'Sofi', 'Pipe', 'Vale'];

/* Reglas de Sintonía para las respuestas libres (Claude). */
const REGLAS_IA = `Eres Sintonía (IA), «el quinto amigo del parche»: una app que ayuda a grupos de amigos en Cali a armar planes cerca, cortos y posibles. Una persona del equipo revisa todo.
Reglas:
- Español de Colombia, tuteo, cálido y breve: máximo 2 frases y 40 palabras. Sin emojis.
- No eres terapia ni una app de citas. No des consejos de salud.
- No inventes lugares, precios, horarios ni datos: usa solo lo que trae el contexto. Si no sabes, dilo.
- Nunca reveles quién votó qué ni quién dijo «Ninguna me sirve».
- Si alguien tiene un problema que no puedes resolver o pide hablar con una persona, sugiere el botón «Habla con un humano».
- Si preguntan algo fuera del plan, responde corto y vuelve al plan. Si hay un paso pendiente, recuérdalo al final.
- Responde solo con el texto del mensaje, sin comillas ni prefijos.`;

/* ── 02 · Datos: base compartida (db) con respaldo local (este navegador) ──── */
const Diag = {
  log: [], subs: new Set(),
  add(msg, err) {
    const t = new Date().toLocaleTimeString('es-CO');
    this.log.push(`${t} · ${msg}${err ? ' — ' + (err.code || err.message || String(err)) : ''}`);
    if (this.log.length > 60) this.log.shift();
    this.subs.forEach(f => f());
  },
};

/* Normaliza lo que devuelva la base (documento suelto, {data}, data(), arreglo o {docs}). */
const unwrapDoc = d => {
  if (d == null) return null;
  if (typeof d.exists === 'function' && !d.exists()) return null;
  if (d.exists === false) return null;
  let v;
  if (typeof d.data === 'function') v = d.data();
  else if (d.data && typeof d.data === 'object' && !Array.isArray(d.data)) v = d.data;
  else v = d;
  if (!v || typeof v !== 'object') return null;
  return { ...v, _id: v.id || d.id || v._id };
};
const unwrapList = s => {
  if (!s) return [];
  const arr = Array.isArray(s) ? s : Array.isArray(s.docs) ? s.docs : Array.isArray(s.items) ? s.items : Array.isArray(s.documents) ? s.documents : Array.isArray(s.results) ? s.results : [];
  return arr.map(unwrapDoc).filter(Boolean);
};
const unsubOf = r => (typeof r === 'function' ? r : r && typeof r.then === 'function' ? (() => { r.then(f => typeof f === 'function' && f()).catch(() => {}); }) : r && typeof r.unsubscribe === 'function' ? () => r.unsubscribe() : () => {});

/* Respaldo: memoria + localStorage + BroadcastChannel (varias pestañas del mismo navegador). */
const LocalDB = (() => {
  const KEY = 'sintonia-e3-local-v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { data = {}; }
  let bc = null; try { bc = new BroadcastChannel('sintonia-e3'); } catch (e) {}
  const watchers = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const notify = () => watchers.forEach(w => w());
  if (bc) bc.onmessage = ev => { if (ev.data && ev.data.data) { data = ev.data.data; notify(); } };
  const changed = () => { save(); if (bc) try { bc.postMessage({ data }); } catch (e) {} notify(); };
  const kids = col => Object.keys(data).filter(p => p.startsWith(col + '/') && p.slice(col.length + 1).indexOf('/') === -1).map(p => ({ ...data[p], _id: p.slice(col.length + 1) }));
  return {
    kind: 'local',
    async get(p) { return data[p] ? { ...data[p], _id: p.split('/').pop() } : null; },
    async set(p, v) { data[p] = JSON.parse(JSON.stringify(v)); changed(); },
    async update(p, v) { data[p] = { ...(data[p] || {}), ...JSON.parse(JSON.stringify(v)) }; changed(); },
    async del(p) { delete data[p]; Object.keys(data).filter(k => k.startsWith(p + '/')).forEach(k => delete data[k]); changed(); },
    async list(col) { return kids(col); },
    watchDoc(p, cb) { const w = () => cb(data[p] ? { ...data[p], _id: p.split('/').pop() } : null); watchers.add(w); setTimeout(w, 0); return () => watchers.delete(w); },
    watchCol(col, cb) { const w = () => cb(kids(col)); watchers.add(w); setTimeout(w, 0); return () => watchers.delete(w); },
    wipe() { data = {}; changed(); },
  };
})();

/* Base compartida de la página (capacidad db). */
const SharedDB = db => ({
  kind: 'shared',
  async get(p) { return unwrapDoc(await db.doc(p).get()); },
  async set(p, v) { await db.doc(p).set(v); },
  async update(p, v) {
    try { await db.doc(p).update(v); }
    catch (e) { const cur = unwrapDoc(await db.doc(p).get()) || {}; delete cur._id; await db.doc(p).set({ ...cur, ...v }); }
  },
  async del(p) { await db.doc(p).delete(); },
  async list(col) { return unwrapList(await db.collection(col).get()); },
  watchDoc(p, cb) { try { return unsubOf(db.doc(p).onSnapshot(s => cb(unwrapDoc(s)), e => Diag.add('lectura ' + p, e))); } catch (e) { Diag.add('suscripción ' + p, e); return () => {}; } },
  watchCol(col, cb) { try { return unsubOf(db.collection(col).onSnapshot(s => cb(unwrapList(s)), e => Diag.add('lectura ' + col, e))); } catch (e) { Diag.add('suscripción ' + col, e); return () => {}; } },
});

const Store = {
  be: LocalDB, ready: false, falla: { envio: false, offline: false },
  async init() {
    try {
      const db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
      if (db && typeof db.doc === 'function') {
        const sh = SharedDB(db);
        try { await sh.get('meta/ping'); this.be = sh; Diag.add('Base compartida conectada'); }
        catch (e) {
          if (/not.?found/i.test(String(e && (e.code || e.message)))) { this.be = sh; Diag.add('Base compartida conectada'); }
          else Diag.add('Base compartida no responde; uso este navegador', e);
        }
      } else Diag.add('Sin base compartida en esta vista; los datos quedan en este navegador');
    } catch (e) { Diag.add('No se pudo abrir la base', e); }
    this.ready = true;
  },
  get shared() { return this.be.kind === 'shared'; },
  get: (p) => Store.be.get(p),
  set: (p, v) => Store.be.set(p, v),
  update: (p, v) => Store.be.update(p, v),
  del: (p) => Store.be.del(p),
  list: (c) => Store.be.list(c),
  watchDoc: (p, cb) => Store.be.watchDoc(p, cb),
  watchCol: (c, cb) => Store.be.watchCol(c, cb),
  /* Escritura con simulación de fallas (F1/F2) */
  async write(fn) {
    if (this.falla.envio) { this.falla.envio = false; throw Object.assign(new Error('Simulado'), { code: 'error_simulado' }); }
    return fn();
  },
};

/* ── 03 · Servicios: identidad, IA (Claude) y presencia en vivo ──────────── */
const uidSafe = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-').slice(0, 120);
const rid = (n = 6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const Me = {
  base: null, alias: '', nombreCuenta: '', user: null,
  get uid() { return uidSafe(this.base + (this.alias ? '~' + this.alias : '')); },
  async init() {
    try { this.user = window.claude ? await window.claude.use('user') : null; } catch (e) { this.user = null; }
    if (this.user && typeof this.user.id === 'function') {
      try { this.base = await this.user.id(); } catch (e) { this.base = null; }
      try { const me = await this.user.me(); this.nombreCuenta = (me && (me.name || me.displayName)) || ''; } catch (e) {}
    }
    if (!this.base) { this.base = ls.get('sintonia-e3-uid') || ('local-' + rid(8)); ls.set('sintonia-e3-uid', this.base); }
    this.alias = ss.get('sintonia-e3-alias') || '';
  },
  setAlias(a) { this.alias = uidSafe(a || '').slice(0, 20); ss.set('sintonia-e3-alias', this.alias); },
};

const IA = {
  sample: null, on: true, estado: 'sin probar',
  async init() {
    try { this.sample = window.claude ? await window.claude.use('sample') : null; } catch (e) { this.sample = null; }
    this.estado = this.sample ? 'disponible' : 'no disponible en esta vista';
  },
  /* Devuelve texto de Claude o null (y la app usa el guion). */
  async responder(contexto, historial, mensaje) {
    if (!this.on || !this.sample) return null;
    const hist = historial.slice(-10).map(m => `${m.quien}: ${m.texto}`).join('\n');
    const input = `${REGLAS_IA}\n\nContexto (JSON): ${JSON.stringify(contexto)}\n\nConversación reciente:\n${hist || '(vacía)'}\n\nMensaje nuevo de ${contexto.persona || 'la persona'}: ${mensaje}\n\nResponde como Sintonía.`;
    try {
      const r = await this.sample(input, { modelTier: 'quick', cache: false });
      const t = (r && (r.text || '')).trim().replace(/^["«]|["»]$/g, '');
      this.estado = 'respondiendo';
      return t ? t.slice(0, 400) : null;
    } catch (e) {
      this.estado = e && e.code === 'not_granted' ? 'sin permiso (usa el guion)' : e && e.code === 'rate_limited' ? 'límite alcanzado (usa el guion)' : 'error (usa el guion)';
      Diag.add('IA', e);
      if (e && e.code === 'not_granted') this.on = false;
      return null;
    }
  },
};

const Live = {
  room: null, sala: null, peers: [], subs: new Set(),
  async init() {
    try { this.room = window.claude ? await window.claude.use('room') : null; } catch (e) { this.room = null; }
  },
  async entrar(pid) {
    this.salir();
    if (!this.room || typeof this.room.join !== 'function') return;
    try {
      this.sala = await this.room.join('parche-' + pid);
      if (this.sala && this.sala.onPeers) this.sala.onPeers(ps => { this.peers = Array.isArray(ps) ? ps : []; this.subs.forEach(f => f()); });
    } catch (e) { Diag.add('presencia', e); this.sala = null; }
  },
  salir() { try { this.sala && this.sala.leave && this.sala.leave(); } catch (e) {} this.sala = null; this.peers = []; },
  marcar(estado) { try { this.sala && this.sala.presence && this.sala.presence(estado); } catch (e) {} },
  escribiendo(uid) {
    return this.peers.filter(p => { const s = p && (p.presence || p.state || p); return s && s.escribiendo && s.uid !== uid; }).map(p => (p.presence || p.state || p).nombre).filter(Boolean);
  },
};

    try { this.doc = await Store.get(this.path); } catch (e) { Diag.add('leer mi estado', e); }
    if (!this.doc) { this.doc = this.def(); if (Me.nombreCuenta) this.doc.sugerido = Me.nombreCuenta.split(' ')[0]; await this.guardar(); }
    const d = this.def(); for (const k in d) if (this.doc[k] === undefined) this.doc[k] = d[k];
    delete this.doc._id;
  },
  _t: null,
  async guardar() {
    clearTimeout(this._t);
    return new Promise(res => { this._t = setTimeout(async () => { try { const d = { ...this.doc }; d.s1 = { ...d.s1, log: d.s1.log.slice(-120) }; await Store.set(this.path, d); } catch (e) { Diag.add('guardar mi estado', e); } res(); }, 150); });
  },
  get nombreVisible() { return this.doc.consent.nom ? (this.doc.nombre || 'Alguien') : 'Alguien'; },
};

const S1 = {
  pendienteIA: false,
  push(a, t, extra = {}) { const m = { id: 'l' + Date.now().toString(36) + rid(3), a, t, at: Date.now(), ...extra }; Yo.doc.s1.log.push(m); return m; },
  async decir(textos, voz = 'quinto', att = null) {
    for (let i = 0; i < textos.length; i++) {
      this.pendienteIA = true; UI.refresh();
      await espera(Math.min(900, 300 + textos[i].length * 8));
      this.pendienteIA = false;
      this.push('ai', textos[i], { voz, att: i === textos.length - 1 ? att : null });
      UI.refresh();
    }
    await Yo.guardar();
  },
  get st() { return Yo.doc.s1; },
  get paso() { return PASOS[this.st.step]; },
  ctx() { return { ans: this.st.ans, yo: Yo.doc, pid: this.st.pid, parche: this.st.parche || null }; },

  async iniciar(flow, step, extra = {}) {
    Object.assign(this.st, { flow, step, ans: { ...(extra.ans || {}) }, pid: extra.pid || null, parche: extra.parche || null });
    await this.mostrar();
  },
  async mostrar() {
    const p = this.paso; if (!p) return;
    const tx = typeof p.say === 'function' ? p.say(this.ctx()) : p.say;
    await this.decir(tx, p.voz || 'quinto', p.input && ['multi', 'band', 'dial', 'toggles', 'invite'].includes(p.input.type) ? { type: p.input.type, step: this.st.step } : null);
    if (p.auto) await p.auto(this.ctx());
  },
  /* Respuesta a un paso: valor + texto que se muestra como mensaje propio */
  async responder(valor, etiqueta) {
    const p = this.paso; if (!p) return;
    if (etiqueta) { this.push('me', etiqueta); UI.refresh(); }
    const r = p.save ? await p.save(this.ctx(), valor) : null;
    if (r === 'stay') { await Yo.guardar(); return; }
    const next = typeof p.next === 'function' ? p.next(this.ctx(), valor) : p.next;
    if (next) { this.st.step = next; await this.mostrar(); } else { this.st.flow = null; this.st.step = null; await Yo.guardar(); }
  },
  /* Texto libre en el 1:1 */
  async texto(t) {
    const p = this.paso;
    if (/^\s*salir\s*$/i.test(t)) { this.push('me', t); UI.abrirSalir(); return; }
    if (p && p.input) {
      const ops = p.input.options ? (typeof p.input.options === 'function' ? p.input.options(this.ctx()) : p.input.options) : [];
      const hit = ops.find(o => norm(o) === norm(t));
      if (p.input.type === 'text') return this.responder(t.trim().slice(0, 40), t.trim());
      if (hit && ['chips', 'toggles', 'invite'].includes(p.input.type)) return this.responder(hit, hit);
      if (p.input.type === 'chips' && p.input.libre) return this.responder(t.trim(), t.trim());
    }
    this.push('me', t); UI.refresh(); await Yo.guardar();
    this.pendienteIA = true; UI.refresh();
    const ctx = { canal: 'chat 1:1 con Sintonía', persona: Yo.doc.nombre || undefined, paso_pendiente: p ? (typeof p.say === 'function' ? p.say(this.ctx()) : p.say).slice(-1)[0] : null, flujo: this.st.flow };
    const hist = this.st.log.slice(-10).map(m => ({ quien: m.a === 'ai' ? 'Sintonía' : 'Persona', texto: m.t }));
    let r = await IA.responder(ctx, hist, t);
    this.pendienteIA = false;
    if (!r) r = p ? 'Te leo. Para seguir, responde con una de las opciones de abajo; si algo no te cuadra, toca «Habla con un humano».' : 'Te leo. Si necesitas algo, toca «Habla con un humano» y una persona del equipo te responde.';
    this.push('ai', r, { voz: (p && p.voz) || 'quinto' }); UI.refresh(); await Yo.guardar();
  },
};
const espera = ms => new Promise(r => setTimeout(r, window.__FAST ? 5 : ms));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').trim();

let ARTIFACT_URL = 'https://claude.ai/artifact/GEhe6h4CogNRJYBk1ab3BY';
const linkParche = pid => ARTIFACT_URL ? `${ARTIFACT_URL}#p-${pid}` : `Código ${pid}`;
const ETAPA_TXT = { reclutando: 'Buscando señal', sinquorum: 'Sin quórum', votacion: 'Votación abierta', resolviendo: 'Resolviendo', fijado: 'Plan fijado', encurso: 'Plan en curso', sobremesa: 'Sobremesa', cancelado: 'Cancelado' };

const Grupo = {
  pid: null, p: null, miembros: [], mensajes: [], votos: [], unsubs: [], cargado: { p: false, mi: false, me: false, vo: false },
  pendIA: false, cola: [], errorEnvio: null, sel: 1,

  base(pid) { return 'parches/' + pid; },
  async crear(ans) {
    let pid = rid(6); for (let i = 0; i < 3 && await Store.get(this.base(pid)).catch(() => null); i++) pid = rid(6);
    const now = Date.now();
    await Store.set(this.base(pid), { id: pid, nombre: ans.nombreParche || 'Parche del domingo', org: Me.uid, orgNombre: Yo.nombreVisible, tipo: ans.tipo || '', quorum: ans.quorum || 4, antojos: ans.antojos || [], franja: ans.franja || 'tarde', stage: 'reclutando', ronda: 0, creado: now, plazo: now + 48 * 3600e3, ans: { historia: ans.historia || '', organiza: ans.organiza || '', energia: ans.energia || null, tamano: ans.tamano || '' } });
    if (!Yo.doc.parches.includes(pid)) Yo.doc.parches.push(pid);
    if (!Yo.doc.organizo.includes(pid)) Yo.doc.organizo.push(pid);
    await Yo.guardar();
    await this.unirme(pid, { franja: ans.franja, restr: [] }, 'organiza');
    return pid;
  },
  async unirme(pid, ans, rol = 'invitado') {
    const yo = { id: Me.uid, uid: Me.uid, nombre: Yo.doc.nombre || 'Alguien', muestra: !!Yo.doc.consent.nom, consent: { ...Yo.doc.consent }, rol, restr: ans.restr || [], franja: ans.franja || 'tarde', unido: Date.now() };
    await Store.set(`${this.base(pid)}/miembros/${Me.uid}`, yo);
    if (!Yo.doc.parches.includes(pid)) { Yo.doc.parches.push(pid); await Yo.guardar(); }
    const p = await Store.get(this.base(pid)); const ms = await Store.list(`${this.base(pid)}/miembros`);
    const n = ms.filter(m => m.consent && !m.salio).length, N = (p && p.quorum) || 4;
    await this.msgAI(pid, 'join-' + Me.uid, `¡${rol === 'organiza' ? 'Arrancamos' : 'Ya está dentro ' + (yo.muestra ? yo.nombre : 'alguien nuevo')}! ${n >= N ? 'Ya están todos.' : `Falta${N - n > 1 ? 'n' : ''} ${N - n} persona${N - n > 1 ? 's' : ''} para que les proponga planes.`}`, 'quinto', { type: 'quorum', n, N });
  },
  async msgAI(pid, id, t, voz, att = null, solo = null) {
    const m = { id, a: 'ai', t, voz, at: Date.now() }; if (att) m.att = att; if (solo) m.solo = solo;
    const prev = this.pid === pid ? this.mensajes.find(x => x._id === id || x.id === id) : null;
    if (prev && prev.t === t && !att) return;
    if (prev) m.at = prev.at;
    await Store.set(`${this.base(pid)}/mensajes/${id}`, m).catch(e => Diag.add('mensaje IA', e));
  },

  abrir(pid) {
    if (this.pid === pid) return;
    this.cerrar(); this.pid = pid; this.cargado = { p: false, mi: false, me: false, vo: false };
    const b = this.base(pid);
    this.unsubs.push(Store.watchDoc(b, d => { this.p = d; this.cargado.p = true; this.cambio(); }));
    this.unsubs.push(Store.watchCol(b + '/miembros', l => { this.miembros = l; this.cargado.mi = true; this.cambio(); }));
    this.unsubs.push(Store.watchCol(b + '/mensajes', l => { this.mensajes = l.sort((a, c) => (a.at || 0) - (c.at || 0)); this.cargado.me = true; this.cambio(); }));
    this.unsubs.push(Store.watchCol(b + '/votos', l => { this.votos = l; this.cargado.vo = true; this.cambio(); }));
    Live.entrar(pid);
  },
  cerrar() { this.unsubs.forEach(u => { try { u(); } catch (e) {} }); this.unsubs = []; this.pid = null; this.p = null; this.miembros = []; this.mensajes = []; this.votos = []; Live.salir(); },
  get listo() { const c = this.cargado; return c.p && c.mi && c.me && c.vo; },
  get activos() { return this.miembros.filter(m => m.consent && !m.salio); },
  get yo() { return this.miembros.find(m => m.uid === Me.uid) || null; },
  get N() { return (this.p && this.p.quorum) || 4; },
  votosRonda(r = this.p && this.p.ronda) { const act = new Set(this.activos.map(m => m.uid)); return this.votos.filter(v => v.ronda === r && act.has(v.uid)); },
  get miVoto() { return this.votosRonda().find(v => v.uid === Me.uid) || null; },
  nombreDe(uid) { const m = this.miembros.find(x => x.uid === uid); return m ? (m.muestra ? m.nombre : 'Alguien') : 'Alguien'; },

  _cambioT: null,
  cambio() { UI.refresh(); clearTimeout(this._cambioT); this._cambioT = setTimeout(() => this.tick(), 350); },

  /* Transiciones del grupo. Cualquiera que tenga el chat abierto las puede escribir: los ids son fijos. */
  _tickT: null,
  async tick() {
    const p = this.p; if (!this.listo || !p || !this.yo) return;
    const pid = this.pid, b = this.base(pid), n = this.activos.length, N = this.N, now = Date.now();
    clearTimeout(this._tickT);
    try {
      if (p.stage === 'reclutando' && n >= N) {
        const restr = [...new Set(this.activos.flatMap(m => m.restr || []))];
        const ops = elegirOpciones(p.antojos, restr, p.franja, 1);
        await Store.update(b, { stage: 'votacion', ronda: 1, opciones: ops, votoAbre: now });
        await this.msgAI(pid, 'opciones-r1', 'Tengo 3 opciones cerca, cortas y posibles. Compárenlas y voten:', 'mago', { type: 'vote', ronda: 1, opciones: ops });
        return;
      }
      if (p.stage === 'reclutando' && p.plazo && now > p.plazo) { await Store.update(b, { stage: 'sinquorum' }); await this.msgAI(pid, 'sinquorum-' + p.plazo, 'No se completó el quórum a tiempo. Puede pasar. ¿Qué hacemos?', 'estatica', { type: 'quorum', n, N }); return; }
      if (p.stage === 'votacion') {
        const vr = this.votosRonda();
        if (vr.some(v => v.opcion === 'ninguna') && !this.mensajes.some(m => m._id === 'veto-r' + p.ronda)) await this.msgAI(pid, 'veto-r' + p.ronda, 'Alguien prefiere otra opción. Si la mayoría tampoco quiere ninguna, les propongo otras.', 'resonador');
        if (n > 0 && vr.length >= n) { await Store.update(b, { stage: 'resolviendo', cierreAt: now }); await this.msgAI(pid, 'cierre-r' + p.ronda, 'Cerró la votación. Estoy revisando con el equipo.', 'mago', { type: 'valves' }); return; }
      }
      if (p.stage === 'resolviendo') {
        const falta = (p.cierreAt || now) + (window.__FAST ? 300 : 6000) - now;
        if (falta > 0) { this._tickT = setTimeout(() => this.tick(), falta + 50); return; }
        const vr = this.votosRonda(); const cuenta = [0, 0, 0]; let ninguna = 0;
        vr.forEach(v => v.opcion === 'ninguna' ? ninguna++ : cuenta[v.opcion - 1]++);
        if (ninguna > vr.length / 2 && (p.ronda || 1) < 2) {
          const restr = [...new Set(this.activos.flatMap(m => m.restr || []))];
          const ops = elegirOpciones(p.antojos, restr, p.franja, 2, (p.opciones || []).map(o => o.id));
          await Store.update(b, { stage: 'votacion', ronda: 2, opciones: ops, votoAbre: now });
          await this.msgAI(pid, 'opciones-r2', 'La mayoría prefiere otra cosa. Aquí van 3 opciones nuevas:', 'resonador', { type: 'vote', ronda: 2, opciones: ops });
          return;
        }
        let k = 0; cuenta.forEach((c, i) => { if (c > cuenta[k]) k = i; });
        const o = (p.opciones || [])[k]; if (!o) return;
        const plan = { ...o, fecha: proximoDomingo(o.h, o.m), votos: cuenta[k], de: vr.length };
        await Store.update(b, { stage: 'fijado', plan, fijadoAt: now });
        await this.msgAI(pid, 'plan', `¡Plan fijado! Ganó «${o.titulo}» con ${cuenta[k]} de ${vr.length} votos. Les aviso un día antes y una hora antes.`, 'antena', { type: 'plan', plan, n, N });
        return;
      }
      if (p.stage === 'sobremesa' && !Yo.doc.sobremesa[pid] && S1.st.flow !== 'D') {
        await S1.iniciar('D', 'D1', { pid, parche: { titulo: p.plan ? p.plan.titulo : p.nombre } });
