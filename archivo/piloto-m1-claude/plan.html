<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sintonía · El plan de tu parche</title>
<link rel="stylesheet" href="assets/sintonia.css">
</head>
<body><div style="background:#FFF6DD;color:#5B4A12;border-bottom:1px solid #F0E2B6;font:600 13px/1.4 system-ui,sans-serif;padding:8px 16px;text-align:center">Versión archivada · solo referencia · no envía datos · <a href="/sintonia-piloto/archivo/" style="color:inherit">ver archivo</a></div>
<main class="wrap">
  <header class="top">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span>Sintonía</a>
    <button class="btn btn-ghost btn-sm" id="refrescar" type="button" aria-label="Actualizar">↻ Actualizar</button>
  </header>
  <div id="app" aria-live="polite">
    <div class="card empty"><div class="pulse" aria-hidden="true"></div><p class="muted">Cargando tu plan…</p></div>
  </div>
  <footer class="foot">Piloto académico · Universidad Icesi · <a href="aviso.html">Aviso de privacidad</a></footer>
</main>
<script src="assets/sintonia.js"></script>
<script>
(function () {
  var app = S.$('#app'), pid = S.param('pid') || S.me().pid, planId = S.param('plan_id') || '', timer = null, data = null;
  if (S.param('pid')) S.LS.set('sintonia_pid', S.param('pid'));

  function html(h) { app.innerHTML = h; }
  function poll(on) { clearTimeout(timer); if (on) timer = setTimeout(load, 20000); }

  function stopsHtml(o) {
    return '<ul class="stops">' + (o.paradas || []).map(function (p, i) {
      return '<li><b>' + (i + 1) + '. ' + S.esc(p.nombre) + '</b><div class="meta"><span>' + S.esc(p.zona || '') + '</span>' +
        (p.horario ? '<span>Horario: ' + S.esc(p.horario) + '</span>' : '') + (p.costo_aprox !== '' && p.costo_aprox !== undefined ? '<span>Costo: ' + (/^\$?\s*0$/.test(String(p.costo_aprox).trim()) ? 'gratis' : S.esc(p.costo_aprox)) + '</span>' : '') + '</div></li>';
    }).join('') + '</ul>';
  }
  function optionHtml(o, i, extra) {
    return '<h3>' + S.esc(o.titulo || ('Opción ' + (i + 1))) + '</h3>' + stopsHtml(o) +
      '<div class="meta">' + (o.hora_salida ? '<span>Salida sugerida: <b>' + S.esc(o.hora_salida) + '</b></span>' : '') +
      (o.presupuesto_aprox ? '<span>Presupuesto: <b>' + S.esc(o.presupuesto_aprox) + '</b></span>' : '') + '</div>' +
      (o.por_que ? '<p class="small" style="margin:10px 0 0">' + S.esc(o.por_que) + '</p>' : '') + (extra || '');
  }

  function load() {
    if (!pid) return html('<div class="card warn empty"><h2>Abre tu enlace personal</h2><p class="small">Este enlace llega cuando te registras. Si lo perdiste, escríbele a quien organiza o al WhatsApp de Sintonía.</p></div>');
    var q = { view: 'plan', pid: pid }; if (planId) q.plan_id = planId;
    S.get(q).then(function (r) {
      data = r;
      if (!r || !r.ok) { poll(false); return html('<div class="card danger empty"><h2>No pudimos abrir tu plan</h2><p class="small">' + S.esc(S.errMsg(r)) + '</p></div>'); }
      if (r.plan_id) planId = r.plan_id;
      render(r);
    });
  }

  function render(r) {
    if (r.experimento === 'E1' && r.estado !== 'cerrado') {
      poll(false);
      return html('<div class="card soft empty"><h2>Tu plan va por WhatsApp</h2><p class="small">Tu parche está en la versión de WhatsApp: las opciones, la votación y los recordatorios te llegan por el chat de Sintonía.</p></div>');
    }
    if (r.estado === 'sin_plan') {
      poll(true);
      if (r.grupo_estado === 'excluido') { poll(false); return html('<div class="card warn empty"><h2>Este grupo no entra en la prueba</h2><p class="small">No todas las personas invitadas completaron las autorizaciones, así que por rigor el grupo no participa. Gracias por tu tiempo.</p></div>'); }
      if (r.grupo_estado === 'reclutando') return html('<div class="card empty"><div class="pulse" aria-hidden="true"></div><h2>Esperando a tu parche</h2><p class="small muted">El plan arranca cuando todas las personas invitadas acepten desde su enlace.</p></div>');
      return preparando();
    }
    if (r.estado === 'preparando') { poll(true); return preparando(); }
    if (r.estado === 'votando') { poll(true); return votando(r); }
    if (r.estado === 'cerrado') { poll(false); return cerrado(r); }
    if (r.estado === 'caido') { poll(false); return html('<div class="card warn empty"><h2>Esta vez el plan no se dio</h2><p class="small">Pasa. Cuando haya una nueva propuesta, aparecerá aquí mismo.</p></div>'); }
    html('<div class="card empty"><p class="muted">Estado del plan: ' + S.esc(r.estado) + '</p></div>');
  }

  function preparando() {
    html('<div class="card empty"><div class="pulse" aria-hidden="true"></div><h2>Sintonía está armando las opciones para tu parche.</h2><p class="small muted">Vuelve en un momento. Esta página se actualiza sola.</p></div>');
  }

  function votando(r) {
    var ops = r.opciones || [], total = Math.max(1, Number(r.n_invitados) || 1);
    var h = '<div class="hero"><h1>¿Cuál les late?</h1><p>Vota por una opción. Si ninguna te sirve, dilo: así nadie queda incómodo.</p></div>';
    h += '<p class="small muted">' + (r.n_votos || 0) + ' de ' + (r.n_invitados || '?') + ' ya votaron · el conteo es anónimo</p>';
    ops.forEach(function (o, i) {
      var n = (r.conteo && r.conteo[i]) || 0, mine = String(r.mi_voto) === String(i);
      h += '<article class="option' + (mine ? ' mine' : '') + '">' + optionHtml(o, i,
        '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(n / total * 100) + '%"></i></div>' +
        '<div class="actions"><button class="btn ' + (mine ? 'btn-ghost' : 'btn-primary') + ' btn-block" data-voto="' + i + '" data-busy="Guardando…">' + (mine ? '✓ Tu voto · ' : 'Voto por esta · ') + n + ' voto' + (n === 1 ? '' : 's') + '</button></div>') + '</article>';
    });
    h += '<div class="card"><p class="small" style="margin:0 0 8px">Ninguna me sirve' + (r.vetos ? ' · ' + r.vetos + ' ya lo dijeron' : '') + '</p><button class="btn ' + (r.mi_voto === 'veto' ? 'btn-ghost' : 'btn-danger') + ' btn-block" data-veto data-busy="Guardando…">' + (r.mi_voto === 'veto' ? '✓ Dijiste que ninguna te sirve' : 'Veto · ninguna me sirve') + '</button></div>';
    html(h);
    S.$$('[data-voto]', app).forEach(function (b) { b.onclick = function () { votar(b, Number(b.dataset.voto), false); }; });
    S.$('[data-veto]', app).onclick = function () { votar(this, '', true); };
  }
  function votar(btn, opcion, veto) {
    S.busy(btn, function () { return S.post({ action: 'votar', plan_id: planId, pid: pid, opcion: opcion, veto: veto }); })
      .then(function (r) { if (!r || !r.ok) return S.toast(S.errMsg(r), true); S.toast(veto ? 'Anotado: ninguna te sirve.' : '¡Voto guardado!'); load(); });
  }

  function cerrado(r) {
    var o = (r.opciones || [])[Number(r.elegida)] || (r.opciones || [])[0] || {};
    var hora = r.hora_encuentro ? new Date(r.hora_encuentro) : null, now = Date.now();
    var ventana = !hora || (now >= hora.getTime() - 3 * 36e5 && now <= hora.getTime() + 8 * 36e5);
    var yo = r.yo || {};
    var h = '<div class="hero"><h1>¡El plan quedó!</h1><p>Llega sabiendo qué esperar. Ruta clara, ganas intactas.</p></div>';
    h += '<article class="option win">' + optionHtml(o, 0, hora ? '<p style="margin:12px 0 0"><b>Encuentro: ' + S.esc(S.fecha(hora)) + '</b></p>' : '') + '</article>';
    if (r.experimento !== 'E1') {
      h += '<div class="card"><h3>¿Vas?</h3><p class="small muted">' + (r.n_apuntados || 0) + ' de ' + (r.n_invitados || '?') + ' ya se apuntaron.</p><div class="actions split">' +
        (yo.apuntado ? '<button class="btn btn-ghost" data-ev="no_puedo" data-busy="Guardando…">Ya no puedo</button><span class="btn btn-primary" aria-disabled="true">✓ Te apuntaste</span>'
                     : '<button class="btn btn-primary" data-ev="me_apunto" data-busy="Guardando…">Me apunto</button><button class="btn btn-ghost" data-ev="no_puedo" data-busy="Guardando…">No puedo</button>') + '</div></div>';
      h += '<div class="card"><h3>El día del plan</h3>' + (yo.llego ? '<p class="small">✓ Marcaste que llegaste. ¡Que lo disfruten!</p><div class="actions"><button class="btn btn-ghost btn-block" data-ev="llego_casa" data-busy="Guardando…">Ya llegué a casa</button></div>'
        : '<p class="small muted">Cuando llegues al sitio, márcalo aquí. No usamos tu ubicación.</p><div class="actions"><button class="btn btn-honey btn-block" data-ev="checkpoint_llegada" data-busy="Guardando…"' + (ventana ? '' : ' disabled') + '>¡Llegué!</button></div>' + (ventana ? '' : '<p class="tiny muted center">Se activa unas horas antes del encuentro.</p>')) + '</div>';
    }
    h += '<div class="card soft"><h3>Después de la salida</h3>' + (yo.retro ? '<p class="small">¡Gracias por contarnos cómo les fue!</p>' :
      '<p class="small">Si hubo sintonía, sigan. Cuéntanos cómo te fue en 2 minutos.</p><div class="actions"><a class="btn btn-primary btn-block" href="' + S.esc(S.link('retro.html', { plan_id: planId, pid: pid })) + '">Cuéntanos cómo te fue</a></div>') + '</div>';
    html(h);
    S.$$('[data-ev]', app).forEach(function (b) {
      b.onclick = function () {
        S.busy(b, function () { return S.post({ action: 'evento', plan_id: planId, pid: pid, tipo: b.dataset.ev }); })
          .then(function (x) { if (!x || !x.ok) return S.toast(S.errMsg(x), true); S.toast({ me_apunto: '¡Listo, te esperamos!', no_puedo: 'Anotado. Gracias por avisar.', checkpoint_llegada: '¡Bienvenid@! Quedó registrado.', llego_casa: 'Qué bueno. ¡Gracias!' }[b.dataset.ev]); load(); });
      };
    });
  }

  S.$('#refrescar').onclick = load;
  document.addEventListener('visibilitychange', function () { if (!document.hidden && data && ['votando', 'preparando', 'sin_plan'].indexOf(data.estado) >= 0) load(); });
  load();
})();
</script>
</body>
</html>
